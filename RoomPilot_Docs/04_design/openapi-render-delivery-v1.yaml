# =============================================================================
# openapi-render-delivery-v1.yaml — 第 7／8 步生圖與交付家族 API 契約
# -----------------------------------------------------------------------------
# 版本: v1.0 ｜ 更新: 2026-08-12 ｜ 狀態: 草稿（待 owner 核准）
# Owner: Bella（backend/server/ 主要 owner）；生圖與報告 Agent 側為 Yen
# 語域: L3（工程）——欄位、狀態碼與 detail code 直述，業務語意見 api_spec.md
# 實例: 每個 API 家族一份；本檔＝render／delivery（main.py:2028-2491、2947-2964）
# 定位宣告: 本檔回答「這個家族每個端點的 method／path／requestBody／response 形狀
#   與錯誤碼」；設計約定與跨家族錯誤語意見 ../04_design/api_spec.md；專案與工作流
#   端點見 openapi-project-workflow-v1.yaml；場景與家具見 openapi-scene-v1.yaml；
#   Agent 與 RAG 見 openapi-agent-rag-v1.yaml。
# 佐證基準: 分支 yen、HEAD 8f378b24、2026-08-12 工作樹。行號隨程式碼演進，
#   衝突時以原始碼為準。
# =============================================================================
openapi: 3.1.0
info:
  title: RoomPilot Render & Delivery API
  version: 1.0.0
  description: |
    RoomPilot 八步工作流中**第 7 步（方案鎖定與色卡）與第 8 步（AI 生圖與成果包）**
    的端點家族，涵蓋：外部渲染供應商狀態與任務、AI 生圖狀態、代表房色卡比較圖、
    逐房效果圖與逐房改圖、設計手冊 PDF、品牌交付提案 PDF、成果包 JSON。

    - **本檔由程式碼反推，非手寫契約先行**：每個 operation 的 `description` 標註
      佐證行號（`backend/server/` 相對短名）。人工核准前一律視為 TO-BE。
    - **佐證基準**：分支 `yen`、HEAD `8f378b24`、2026-08-12 工作樹。
    - **無認證機制**：Pilot 階段僅 loopback 服務，未定義 `securitySchemes`；
      服務邊界與是否需帳號由 owner 界定（DEC-014）。
    - **錯誤格式**：FastAPI `HTTPException(status, {"code": ..., "message": ...})`
      →回應為 `{"detail": {"code": ..., "message": ...}}`。唯一例外是
      `POST /api/projects/{project_id}/design-delivery` 的 422，只有 `code`
      沒有 `message`（`main.py:2953`）。
    - **狀態端點只宣告 200，是刻意的**：`GET /api/render-provider/status`
      （`main.py:2028-2030`）、`GET /api/ai-render/status`（`main.py:2064-2067`）、
      `GET /api/delivery-proposal/status`（`main.py:2378-2381`）三支都是單行委派，
      原始碼中**沒有任何 `raise` 或 try/except**，可用性以 200 主體的 `configured`／
      `reason` 承載。對照組是同檔的 `POST /api/projects/{id}/render-jobs`
      （`main.py:2041-2057` 宣告 422／502／503）。因此本檔不為這三支宣告錯誤
      response；未捕捉例外會落到 FastAPI 預設 500，那是框架行為而非本契約承諾。
    - **單位鐵律**：所有長度欄位為公分（cm），相機座標為 `[x, y, z]` 公分三元組。
    - **影像傳遞**：影像一律走 `data:image/...;base64,...` data URL，於請求與回應
      的 JSON 內傳遞；base64 不寫入 project workflow（workflow 上限 2 MiB，
      `project_store.py:11,224-225`）。
    - 對應需求：FR-055–FR-064、FR-067；驗收 ACPT-047–ACPT-055、ACPT-056、
      ACPT-060（見 ../01_requirements/srs.md §2、../01_requirements/prd.md §3）。
  contact:
    name: RoomPilot 工程文件
    url: https://example.invalid/roompilot-docs
