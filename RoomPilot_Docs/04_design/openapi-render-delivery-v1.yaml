x-open-questions:
  - id: OPEN-10
    note: 對客戶的正式交付主件是成果包 JSON、交付提案 PDF 或設計手冊 PDF——本檔三者並列，未標主件。
  - id: OPEN-16
    note: 改圖額度「整批一次」（契約文字）vs「逐房各一次」（現行程式，main.py:2244-2248）。本檔照程式行為描述。
  - id: OPEN-17
    note: 色卡比較圖「每案只做一次」的依據（成本控管或產品定案）未載明。
  - id: OPEN-18
    note: 色卡圖在頁面重整後消失、但 palette_render.generated 仍為 true 是否預期。
  - id: 待確認（尚無 OPEN 編號）
    note: |
      本家族所有寫入 workflow 的端點（ai-renders、palette-renders、edit、design-manual、
      delivery-proposal）皆未攔截 project_store.WorkflowTooLargeError
      （main.py:2117、2199、2279、2324、2407 直呼
      PROJECT_STORE.update_workflow），超過 2 MiB 時會以 FastAPI 預設 500 外洩，
      回應不符本家族的 detail envelope。是否補 413／409 由 owner 決定。
  - id: 待確認（尚無 OPEN 編號）
    note: |
      生圖與 PDF 產出的逾時、重試次數與成本上限未在程式中設定（僅
      render_service.py:33-38 有 provider HTTP 逾時 5–180 秒可調）；SLA 與配額待 owner 明文。
servers:
  - url: http://127.0.0.1:8002
    description: Pilot 本機 loopback（唯一部署形態；README 的 uvicorn 埠）
tags:
  - name: render-status
    description: 供應商與生圖服務狀態端點（FR-067；不外洩金鑰與伺服器檔案佈局）
  - name: render
    description: 第 7／8 步生圖（色卡比較、逐房效果圖、逐房改圖）
  - name: delivery
    description: 第 8 步交付物（設計手冊 PDF、交付提案 PDF、成果包 JSON）

paths:
  /api/render-provider/status:
    get:
      tags: [render-status]
      operationId: getRenderProviderStatus
      summary: 查詢外部渲染供應商是否已設定（不外洩 token）
      description: |
        讀 `ROOMPILOT_RENDER_PROVIDER_URL`／`_TOKEN`／`_NAME` 環境變數，只回布林與
        供應商名。佐證 `main.py:2028-2030`、`render_service.py:41-49`。
      x-requirement:
        fr: [FR-067]
        acpt: [ACPT-056]
        evidence: main.py:2028-2030
      responses:
        '200':
          description: 供應商設定狀態
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderProviderStatus' }

  /api/ai-render/status:
    get:
      tags: [render-status]
      operationId: getAiRenderStatus
      summary: 查詢 AI 生圖服務（OpenRouter）是否可用與使用模型
      description: |
        只回 `configured` 布林與模型 id，不外洩 `OPENROUTER_API_KEY`。
        佐證 `main.py:2064-2067`、`ai_render_service.py:65-77`。
      x-requirement:
        fr: [FR-067]
        acpt: [ACPT-056]
        evidence: main.py:2064-2067
      responses:
        '200':
          description: 生圖服務狀態
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiRenderStatus' }

  /api/delivery-proposal/status:
    get:
      tags: [render-status]
      operationId: getDeliveryProposalStatus
      summary: 查詢交付提案排版引擎（playwright Chromium）是否可用
      description: |
        不可用時 `reason` 帶可照做的安裝指引字串。佐證 `main.py:2378-2381`、
        `design_manual_service.py:70-73`、`agent/skills/delivery/__init__.py:43-56`。
      x-requirement:
        fr: [FR-062, FR-067]
        acpt: [ACPT-053, ACPT-056]
        evidence: main.py:2378-2381
      responses:
        '200':
          description: 排版引擎狀態
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryProposalStatus' }

  /api/projects/{project_id}/render-jobs:
    post:
      tags: [render]
      operationId: createProjectRenderJobs
      summary: 送出外部渲染任務（色卡比較或逐房定稿）
      description: |
        脫敏後轉送外部渲染供應商；`requirements` 與 `render_brief` 會依
        `PRIVATE_KEYS` 遞迴剝除個資欄位再送出。供應商回應原樣回傳並補
        `request_id`／`provider`。佐證 `main.py:2033-2057`、`render_service.py:100-175`。
        注意：本端點的錯誤訊息仍寫「請回到第 9 步」（`main.py:2046`），與對外八步導覽
        不一致——文案落差，非行為缺陷。
      x-requirement:
        fr: [FR-055, FR-067]
        acpt: [ACPT-047]
        evidence: main.py:2033-2057
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenderJobRequest' }
      responses:
        '202':
          description: 供應商已接受任務（回應形狀由供應商決定）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenderJobAccepted' }
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '422':
          description: |
            `render_project_mismatch`（body 的 project_id 與路徑不符，main.py:2036-2040）；
            或 `prepare_render_payload` 的驗證碼：`unsupported_render_mode`、
            `scene_version_required`、`style_card_ids_required`、
            `locked_master_camera_required`、`room_views_required`、
            `room_view_room_id_required`、`room_view_camera_required`
            （`render_service.py:92-114`，經 main.py:2043-2047 轉為 422）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502':
          description: |
            供應商拒絕：`render_provider_http_<狀態碼>`、`render_provider_invalid_json`、
            `render_provider_invalid_response`（`render_service.py:145-162`）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: |
            `render_provider_not_configured`（未設 URL）或 `render_provider_unreachable`
            （連線失敗）（`render_service.py:127-130,150-151`）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/projects/{project_id}/palette-renders:
    post:
      tags: [render]
      operationId: createProjectPaletteRenders
      summary: 第 7 步代表房色卡比較圖（每專案僅能成功一次）
      description: |
        同一代表房 × 多張色卡，以執行緒池一次併發送 Gen_Pic Agent（Nano Banana Pro，
        `ai_render_service.py:432-488`），結果順序對齊 `style_card_ids`。
        已成功生成過→409 `palette_already_generated`，**不再呼叫模型**；
        全部色卡皆失敗→不鎖定旗標、回傳失敗結果供重試（此時回應**不含**
        `revision`／`updated_at`）。base64 不入 workflow，只存 `generated` 旗標與各卡狀態。
        佐證 `main.py:2135-2221`。
      x-requirement:
        fr: [FR-056]
        acpt: [ACPT-048]
        dec: [DEC-010]
        evidence: main.py:2135-2221
        open: [OPEN-17, OPEN-18]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaletteRenderRequest' }
      responses:
        '201':
          description: 色卡比較圖結果（含全失敗的可重試情形）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaletteRenderResponse' }
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          description: '`palette_already_generated`——此專案已成功生成過色卡比較圖（main.py:2148-2155）。'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: |
            `render_project_mismatch`（main.py:2142-2146）、`scene_required`（缺 scene 或
            scene.scene_objects，2157-2161）、`room_required`（缺代表房或 room_id，2163-2167）、
            `reference_png_required`（代表房缺 3D 截圖 data URL，2168-2172）、
            `style_card_ids_required`（色卡清單為空，2174-2180）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: '`openrouter_api_key_not_configured`——未設定 OPENROUTER_API_KEY，不回任何影像（main.py:2183-2190、ai_render_service.py:441-442）。'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/projects/{project_id}/ai-renders:
    post:
      tags: [render]
      operationId: createProjectAiRenders
      summary: 第 8 步逐房效果圖（客廳另出夜景）
      description: |
        逐房鎖定視角截圖送 Gen_Pic Agent，執行緒池併發、結果順序對齊輸入 `rooms`。
        單房失敗只標該房 `status: "failed"`，其餘照常回傳；客廳額外一張
        `full_render_night`，夜景失敗只附 `night_notices`，不影響日光圖。
        伺服器把每房 `lock_manifest` 存入 workflow（供改圖鎖定），並重置 `edit_used = 0`。
        佐證 `main.py:2070-2132`、`ai_render_service.py:331-430`。
      x-requirement:
        fr: [FR-058, FR-059]
        acpt: [ACPT-050, ACPT-051, ACPT-060]
        dec: [DEC-006, DEC-011]
        evidence: main.py:2070-2132
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiRenderRequest' }
      responses:
        '201':
          description: 逐房生圖結果（含部分失敗）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiRenderResponse' }
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '422':
          description: |
            `render_project_mismatch`（main.py:2079-2083）、`scene_required`（2085-2089）、
            `room_views_required`（rooms 非陣列或為空，2091-2095）、
            `room_id_required`（任一房缺 room_id，2097-2101）、
            `reference_png_required`（任一房缺 3D 視角截圖，2102-2106）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: '`openrouter_api_key_not_configured`（main.py:2109-2116、ai_render_service.py:342-343）。'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/projects/{project_id}/ai-renders/{room_id}/edit:
    post:
      tags: [render]
      operationId: editProjectAiRender
      summary: 第 8 步逐房改圖（每房各一次額度）
      description: |
        以該房 `lock_manifest` 約束「只改指定內容、其餘與原圖一致」。額度由伺服器
        強制：同房第二次→409 `ai_edit_budget_exhausted`；尚未生圖（無 room_state 或
        無 lock_manifest）→409 `room_not_generated`。成功後該房 `edit_used = 1`，
        回應 `edit_remaining = 0`。佐證 `main.py:2224-2287`、`ai_render_service.py:491-529`。
        注意：程式為**逐房各一次**，既有契約文字寫「整批一次」——見 OPEN-16。
      x-requirement:
        fr: [FR-060]
        acpt: [ACPT-052]
        dec: [DEC-011]
        evidence: main.py:2224-2287
        open: [OPEN-16]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiRenderEditRequest' }
      responses:
        '201':
          description: 改圖結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiRenderEditResponse' }
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          description: |
            `room_not_generated`（該房尚未生圖或無鎖定清單，main.py:2237-2241）；
            `ai_edit_budget_exhausted`（該房 edit_used >= 1，main.py:2244-2248）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: |
            `feedback_required`（未描述修改內容，main.py:2250-2253）、
            `base_image_required`（缺要修改的原圖 data URL，main.py:2254-2257）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502':
          description: '`ai_edit_failed`——上游 Gen_Pic 失敗，`message` 為 notices 以「；」串接（main.py:2270-2274）。'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: '`openrouter_api_key_not_configured`（main.py:2262-2269）。'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/projects/{project_id}/design-manual:
    post:
      tags: [delivery]
      operationId: createProjectDesignManual
      summary: 產出八章設計手冊 PDF
      description: |
        Report Agent 統整需求、配置、家具、色卡與生圖成果輸出 PDF；未設定
        `OPENROUTER_API_KEY` 時走 deterministic 底稿照樣輸出（不假失敗、不假成功）。
        重新產出會覆蓋 workflow 紀錄並提高 `revision`，舊 PDF 檔保留在
        `.runtime/manuals/{project_id}/`。回應中的紀錄**不含檔名**，只給 `download_url`。
        佐證 `main.py:2300-2331`、`design_manual_service.py:211-239`、`main.py:2294-2297`。
      x-requirement:
        fr: [FR-061]
        acpt: [ACPT-053]
        dec: [DEC-012]
        evidence: main.py:2300-2331
        open: [OPEN-10]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportPayload' }
      responses:
        '201':
          description: 手冊已產出
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignManualResponse' }
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '422':
          $ref: '#/components/responses/ReportPayloadInvalid'
        '502':
          description: '`design_manual_failed`——`message` 為 ToolError 原因（main.py:2320-2323、design_manual_service.py:231-232）。'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/projects/{project_id}/design-manual/pdf:
    get:
      tags: [delivery]
      operationId: downloadProjectDesignManual
      summary: 下載設計手冊 PDF
      description: 佐證 `main.py:2334-2350`；檔案位於 `.runtime/manuals/{project_id}/`（`main.py:2290-2291`）。
      x-requirement:
        fr: [FR-061]
        acpt: [ACPT-053]
        evidence: main.py:2334-2350
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: PDF 檔
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404':
          description: |
            `project_not_found`（main.py:1672-1682）或 `design_manual_not_found`
            （workflow 無手冊紀錄，main.py:2339-2343）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '410':
          description: '`design_manual_file_missing`——紀錄存在但檔案已遺失，需重新產出（main.py:2345-2350）。'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/projects/{project_id}/delivery-proposal:
    post:
      tags: [delivery]
      operationId: createProjectDeliveryProposal
      summary: 產出品牌版交付提案 PDF
      description: |
        與設計手冊吃**同一份** payload（`_validated_report_payload`，`main.py:2353-2376`），
        由 roompilot-delivery-pdf 打包 skill 排版。排版引擎（playwright Chromium）未安裝
        → 503 且 `message` 為含安裝指令的指引，不產壞檔。文案走離線底稿時，
        `proposal.warnings[0]` 會明說（`agent/skills/delivery/__init__.py:105-112`）。
        佐證 `main.py:2384-2418`、`design_manual_service.py:242-280`。
      x-requirement:
        fr: [FR-062]
        acpt: [ACPT-053]
        dec: [DEC-012, DEC-017]
        evidence: main.py:2384-2418
        open: [OPEN-10]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportPayload' }
      responses:
        '201':
          description: 交付提案已產出
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryProposalResponse' }
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '422':
          $ref: '#/components/responses/ReportPayloadInvalid'
        '502':
          description: '`delivery_proposal_failed`——排版以外的產出失敗（main.py:2403-2406）。'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: |
            `delivery_engine_not_configured`——排版引擎缺席；`message` 為
            `delivery_engine_status()` 的中文安裝指引（main.py:2399-2402、
            `agent/skills/delivery/__init__.py:43-56`）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/projects/{project_id}/delivery-proposal/pdf:
    get:
      tags: [delivery]
      operationId: downloadProjectDeliveryProposal
      summary: 下載交付提案 PDF
      description: 佐證 `main.py:2421-2437`；與設計手冊共用 `.runtime/manuals/{project_id}/` 目錄。
      x-requirement:
        fr: [FR-062]
        acpt: [ACPT-053]
        evidence: main.py:2421-2437
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: PDF 檔
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404':
          description: '`project_not_found` 或 `delivery_proposal_not_found`（main.py:2426-2430）。'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '410':
          description: '`delivery_proposal_file_missing`——紀錄存在但檔案已遺失（main.py:2432-2437）。'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/projects/{project_id}/design-delivery:
    post:
      tags: [delivery]
      operationId: createProjectDesignDelivery
      summary: 產出第 8 步成果包 JSON（六章、含脫敏審核）
      description: |
        由前端送入的成果資料組六章 JSON（不重算幾何、不重新生圖），並依
        `DELIVERY_SENSITIVE_KEYS`（`main.py:2475-2491`）遞迴剝除敏感欄位；
        剝除路徑列在 `security_review.redacted_paths`。若 workflow 已有交付提案紀錄，
        會併入 `delivery_proposal`（含 `download_url`），否則 `status: "not_generated"`。
        本端點**不寫入** workflow、不提高 `revision`。
        佐證 `main.py:2947-2964`、`main.py:2773-2945`、`main.py:2745-2770`。
      x-requirement:
        fr: [FR-063, FR-064]
        acpt: [ACPT-054, ACPT-055]
        dec: [DEC-012, DEC-013]
        evidence: main.py:2947-2964
        open: [OPEN-10]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DesignDeliveryRequest' }
      responses:
        '200':
          description: 成果包 JSON
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignDeliveryPackage' }
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '422':
          description: |
            `delivery_project_mismatch`——body 的 project_id 與路徑不符。
            **此處 detail 只有 `code`、沒有 `message`**（main.py:2953），
            與本家族其他端點不一致。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      description: 專案 ID（Project Store 主鍵）
      schema: { type: string }
    RoomId:
      name: room_id
      in: path
      required: true
      description: 房間 ID，需與 `ai_render.rooms[].room_id` 相符（main.py:2228-2236）
      schema: { type: string }

  responses:
    ProjectNotFound:
      description: '`project_not_found`——找不到專案（main.py:1672-1682）。'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ReportPayloadInvalid:
      description: |
        設計手冊與交付提案共用的驗證（`main.py:2353-2376`）：
        `manual_project_mismatch`、`scene_required`（缺 scene 或 scene.scene_objects）、
        `rooms_required`（rooms 非陣列或無任何帶 room_id 的項目）。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    ErrorEnvelope:
      type: object
      required: [detail]
      properties:
        detail: { $ref: '#/components/schemas/ErrorDetail' }
    ErrorDetail:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 機器可判讀的錯誤碼；各端點的可能值列於該 operation 的 response description。
        message:
          type: string
          description: 可直接顯示給使用者的正體中文說明。design-delivery 的 422 不含本欄（main.py:2953）。

    RenderProviderStatus:
      type: object
      required: [configured, provider, has_token]
      properties:
        configured: { type: boolean, description: 是否已設定 ROOMPILOT_RENDER_PROVIDER_URL }
        provider: { type: string, default: remote_renderer }
        has_token: { type: boolean, description: 是否設有 token（不回傳 token 本身） }
    AiRenderStatus:
      type: object
      required: [configured, provider, model, fallback_model]
      properties:
        configured: { type: boolean, description: 是否已設定 OPENROUTER_API_KEY }
        provider: { type: string, const: openrouter }
        model: { type: string, description: 主要生圖模型 id（ai_render_service.py:71-72） }
        fallback_model: { type: string, description: 主模型失敗時的備援模型 id }
    DeliveryProposalStatus:
      type: object
      required: [available, reason]
      properties:
        available: { type: boolean }
        reason:
          type: string
          description: 不可用原因；可用時為空字串（agent/skills/delivery/__init__.py:50-56）。

    Camera:
      type: object
      description: 鎖定視角相機；座標為公分三元組（render_service.py:74-87）。
      required: [position_cm, target_cm]
      properties:
        position_cm:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: number }
        target_cm:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: number }
        fov_deg:
          type: number
          exclusiveMinimum: 0
          description: 可省略；給值時必須 > 0。
    RenderJobRequest:
      type: object
      required: [project_id, mode, scene_version, style_card_ids, master_view]
      properties:
        project_id: { type: string, description: 必須等於路徑上的 project_id（main.py:2036-2040）。 }
        mode:
          type: string
          enum: [palette_comparison, room_final]
        scene_version: { type: string, description: 非空字串；會放進 X-RoomPilot-Scene-Version 標頭。 }
        style_card_ids:
          type: array
          items: { type: string }
          minItems: 1
        master_view:
          type: object
          required: [camera]
          properties:
            camera: { $ref: '#/components/schemas/Camera' }
        room_views:
          type: array
          description: mode = room_final 時必填，每項需 room_id 與合法 camera。
          items:
            type: object
            required: [room_id, camera]
            properties:
              room_id: { type: string }
              camera: { $ref: '#/components/schemas/Camera' }
        requirements:
          type: object
          additionalProperties: true
          description: 轉送前遞迴剝除 PRIVATE_KEYS 個資欄位（render_service.py:117-119）。
        render_brief:
          type: object
          additionalProperties: true
          description: 同上，轉送前脫敏。
        request_id: { type: string, description: 省略時伺服器補 uuid4 hex，並作為 Idempotency-Key。 }
      additionalProperties: true
    RenderJobAccepted:
      type: object
      description: 外部供應商的回應原樣回傳，僅補預設欄位（render_service.py:164-168）。
      properties:
        request_id: { type: string }
        provider: { type: string }
      additionalProperties: true

    SceneEnvelope:
      type: object
      description: |
        前端 `state.sceneData`（scene_json）。伺服器只檢查 `scene_objects` 存在且非空
        （main.py:2085-2089、2157-2161、2361-2365）；完整結構見 openapi-scene-v1.yaml。
      required: [scene_objects]
      properties:
        scene_objects:
          type: array
          minItems: 1
          items: { type: object, additionalProperties: true }
      additionalProperties: true
    PngDataUrl:
      type: string
      pattern: '^data:image/'
      description: 3D 視角截圖，`data:image/png;base64,...`（main.py:2060-2061 只檢前綴）。

    AiRenderRoomView:
      type: object
      required: [room_id, reference_png_data_url]
      properties:
        room_id: { type: string, description: 非空白字串。 }
        room_label: { type: string, description: 房名；缺省時以 room_id 代替（ai_render_service.py:310-316）。 }
        room_type:
          type: string
          description: 客廳判定權威值 `living_room`；後援為 room_label 含「客廳」（ai_render_service.py:319-325）。
        reference_png_data_url: { $ref: '#/components/schemas/PngDataUrl' }
        note: { type: string, description: 逐房補充需求，原文併入提示詞（ai_render_service.py:299-307）。 }
    AiRenderRequest:
      type: object
      required: [scene, rooms]
      properties:
        project_id: { type: string, description: 可省略；給值時必須等於路徑（main.py:2079-2083）。 }
        scene: { $ref: '#/components/schemas/SceneEnvelope' }
        rooms:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/AiRenderRoomView' }
    AiRenderResult:
      type: object
      required: [room_id, room_label, status]
      properties:
        room_id: { type: string }
        room_label: { type: string }
        status: { type: string, enum: [completed, failed] }
        image_id: { type: string, description: status = completed 才有。 }
        image_data_url: { type: string, description: 日光圖 data URL；status = completed 才有。 }
        model: { type: string }
        notices:
          type: array
          items: { type: string }
          description: 失敗時為 GenPicFailure.notices；成功時為模型回報事項。
        night_image_id: { type: string, description: 僅客廳且夜景成功時出現。 }
        night_image_data_url: { type: string, description: 客廳夜景圖（stage = full_render_night）。 }
        night_model: { type: string }
        night_notices:
          type: array
          items: { type: string }
          description: 夜景失敗時才出現；不影響日光圖交付（ai_render_service.py:404-414）。
    AiRenderResponse:
      type: object
      required: [results, edit_remaining, revision, updated_at]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/AiRenderResult' }
          description: 順序對齊請求的 rooms。
        edit_remaining:
          type: integer
          const: 1
          description: 常數 1（main.py:2129）；實際額度為每房各一次，見 OPEN-16。
        revision: { type: integer }
        updated_at: { type: string, format: date-time }

    PaletteRenderRequest:
      type: object
      required: [scene, room, style_card_ids]
      properties:
        project_id: { type: string, description: 可省略；給值時必須等於路徑（main.py:2142-2146）。 }
        scene: { $ref: '#/components/schemas/SceneEnvelope' }
        room:
          type: object
          required: [room_id, reference_png_data_url]
          properties:
            room_id: { type: string }
            room_label: { type: string }
            reference_png_data_url: { $ref: '#/components/schemas/PngDataUrl' }
            note: { type: string }
        style_card_ids:
          type: array
          minItems: 1
          items: { type: string }
          description: 空白字串會被濾除；濾除後全空即 422。
    PaletteRenderResult:
      type: object
      required: [style_card_id, status]
      properties:
        style_card_id: { type: string }
        status: { type: string, enum: [completed, failed] }
        image_id: { type: string }
        image_data_url: { type: string, description: base64 只在回應中，不寫入 workflow。 }
        model: { type: string }
        notices:
          type: array
          items: { type: string }
    PaletteRenderResponse:
      type: object
      required: [results, already_generated, room_id]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/PaletteRenderResult' }
          description: 順序對齊 style_card_ids。
        already_generated:
          type: boolean
          const: false
          description: |
            兩條回傳路徑皆為 false（main.py:2196、2217）；「已生成過」是走 409 而非本欄。
        room_id: { type: string }
        revision:
          type: integer
          description: 全部色卡失敗時**不出現**（該路徑不寫 workflow，main.py:2192-2197）。
        updated_at:
          type: string
          format: date-time
          description: 同上，全失敗時不出現。

    AiRenderEditRequest:
      type: object
      required: [feedback, image_data_url]
      properties:
        feedback: { type: string, minLength: 1, description: 想修改的內容；strip 後不得為空。 }
        image_data_url:
          allOf:
            - $ref: '#/components/schemas/PngDataUrl'
          description: 要修改的當前圖（由前端持有並回送）。
    AiRenderEditResponse:
      type: object
      required: [result, edit_remaining, revision, updated_at]
      properties:
        result:
          type: object
          required: [room_id, status, image_id, image_data_url, model, notices]
          properties:
            room_id: { type: string }
            status: { type: string, const: completed }
            image_id: { type: string }
            image_data_url: { type: string }
            model: { type: string }
            notices:
              type: array
              items: { type: string }
        edit_remaining: { type: integer, const: 0 }
        revision: { type: integer }
        updated_at: { type: string, format: date-time }

    ReportRoom:
      type: object
      required: [room_id]
      properties:
        room_id: { type: string }
        room_label: { type: string }
        width_cm: { type: number }
        depth_cm: { type: number }
        image_data_url:
          type: string
          description: 該房最新生圖（改圖後前端已就地更新）；缺此欄該房不入圖庫（design_manual_service.py:148-165）。
        model: { type: string }
    ReportPayload:
      type: object
      description: 設計手冊與交付提案共用（main.py:2353-2376）。
      required: [scene, rooms]
      properties:
        project_id: { type: string, description: 可省略；給值時必須等於路徑。 }
        scene: { $ref: '#/components/schemas/SceneEnvelope' }
        rooms:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ReportRoom' }
    DesignManualRecord:
      type: object
      description: workflow 紀錄去掉 filename 後的公開形（main.py:2294-2297）。
      required: [created_at, sections, rendered_rooms, download_url]
      properties:
        created_at: { type: string, format: date-time }
        sections:
          type: array
          items: { type: string }
          description: 各章標題（design_manual_service.py:233-238）。
        rendered_rooms:
          type: array
          items: { type: string }
        download_url:
          type: string
          description: 固定為 `/api/projects/{project_id}/design-manual/pdf`
    DesignManualResponse:
      type: object
      required: [manual, revision, updated_at]
      properties:
        manual: { $ref: '#/components/schemas/DesignManualRecord' }
        revision: { type: integer }
        updated_at: { type: string, format: date-time }
    DeliveryProposalRecord:
      type: object
      required: [created_at, warnings, rendered_rooms, download_url]
      properties:
        created_at: { type: string, format: date-time }
        warnings:
          type: array
          items: { type: string }
          description: 排版與文案警告；走離線底稿時第一則會明說（agent/skills/delivery/__init__.py:105-112）。
        rendered_rooms:
          type: array
          items: { type: string }
        download_url:
          type: string
          description: 固定為 `/api/projects/{project_id}/delivery-proposal/pdf`
    DeliveryProposalResponse:
      type: object
      required: [proposal, revision, updated_at]
      properties:
        proposal: { $ref: '#/components/schemas/DeliveryProposalRecord' }
        revision: { type: integer }
        updated_at: { type: string, format: date-time }

    DesignDeliveryRequest:
      type: object
      description: |
        本端點對 payload **不做必填驗證**（型別不符者一律以空值代入，main.py:2776-2779），
        只檢查 project_id 是否相符。以下欄位為實際被讀取者。
      properties:
        project_id: { type: string, description: 可省略；給值時必須等於路徑（main.py:2953）。 }
        generated_at: { type: string, description: 省略時由伺服器補 UTC ISO 時戳（main.py:2494-2495）。 }
        style_card:
          type: object
          additionalProperties: true
          description: 讀 name／id；整包脫敏後放入 presentation.style_card。
        configuration_snapshot:
          type: object
          properties:
            snapshot_id: { type: string }
            furniture:
              type: array
              items: { type: object, additionalProperties: true }
              description: 以 room_id 分派到各房；逐件脫敏。
            fixed_structure:
              type: object
              description: 只取 walls／doors／windows／beams／columns 的長度作計數（main.py:2898-2902）。
              additionalProperties: true
          additionalProperties: true
        rooms:
          type: array
          items:
            type: object
            properties:
              room_id: { type: string }
              room_name: { type: string, description: 缺省為「未命名空間」。 }
              room_type: { type: string, description: 經 DELIVERY_ROOM_TYPE_ALIASES 正規化（main.py:2456-2472）。 }
              questionnaire:
                type: object
                description: 讀 lockedFurniture／locked_furniture、usage、summary／note、surfaces、generativeEquipment、source。
                additionalProperties: true
              render:
                type: object
                description: 讀 submitted_at／revision_submitted_at 判定 render_completed／revision_used。
                additionalProperties: true
              view:
                type: object
                description: 第 7 步鎖定視角，脫敏後放入工程報告。
                additionalProperties: true
            additionalProperties: true
      additionalProperties: true
    SecurityReview:
      type: object
      description: deterministic 資安閘（main.py:2745-2770）；非人工審核。
      required: [status, status_label, reviewer, reviewed_at, checks, redacted_paths]
      properties:
        status: { type: string, enum: [passed, passed_with_redactions] }
        status_label: { type: string }
        reviewer: { type: string, const: RoomPilot 後端 deterministic security gate }
        reviewed_at: { type: string, format: date-time }
        checks:
          type: array
          items:
            type: object
            required: [check_id, status, detail]
            properties:
              check_id:
                type: string
                enum: [provider_secret_isolation, sensitive_field_redaction, price_integrity]
              status: { type: string, enum: [passed, redacted] }
              detail: { type: string }
        redacted_paths:
          type: array
          items: { type: string }
          description: 被剝除的敏感欄位路徑（依 DELIVERY_SENSITIVE_KEYS，main.py:2475-2491）。
    BudgetReport:
      type: object
      description: 工程與家具概算（main.py:2869-2887）；不臆造價格。
      required: [title, currency, pricing_status, lines, disclaimer]
      properties:
        title: { type: string }
        currency: { type: string, const: TWD }
        pricing_status: { type: string, enum: [pending_quote, catalog_reference_only] }
        pricing_status_label: { type: string }
        known_furniture_reference_subtotal_twd: { type: integer, description: 只加總 category = furniture 且有金額者。 }
        estimated_structural_subtotal_twd: { type: integer, description: 只加總 status = concept_estimate 且有金額者。 }
        pending_quote_count: { type: integer }
        lines:
          type: array
          items:
            type: object
            properties:
              category: { type: string }
              status: { type: string, enum: [concept_estimate, pending_quote, catalog_reference] }
              amount_twd:
                type: [integer, 'null']
                description: 查無費率或單位不符時為 null（不猜價，ACPT-055）。
            additionalProperties: true
        disclaimer: { type: string, description: 明講須現場丈量與廠商正式報價。 }
    DesignDeliveryPackage:
      type: object
      required:
        [schema_version, artifact_type, project_id, generated_at, presentation,
         engineering_report, security_review, budget, budget_report, delivery_proposal, web_report]
      properties:
        schema_version: { type: string, const: '1.1' }
        artifact_type: { type: string, const: roompilot.web_design_delivery.v1 }
        project_id: { type: string }
        snapshot_id: { type: [string, 'null'] }
        generated_at: { type: string, format: date-time }
        presentation:
          type: object
          description: 一、全屋設計與裝潢簡報；rooms 逐房含 designer_reference 免責語（main.py:2811-2833）。
          additionalProperties: true
        engineering_report:
          type: object
