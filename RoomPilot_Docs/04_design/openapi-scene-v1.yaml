# =============================================================================
# openapi-scene-v1.yaml — RoomPilot 場景與型錄 API 契約（第 5–6 步）
# 版本 v1.0 ｜ 更新 2026-08-12 ｜ 狀態 草稿（待 owner 核准）
# Owner: Bella（backend/server/ 主要 owner）；型錄供應面 Kai；幾何裁決面 Ancai
# 語域: L3（工程）——直接寫路徑、欄位、狀態碼與 detail 字串
# 佐證基準: 分支 yen、HEAD 8f378b24、2026-08-12 工作樹；行號隨程式碼演進，衝突時以原始碼為準
# =============================================================================
openapi: 3.1.0
info:
  title: RoomPilot 場景與型錄 API
  version: 1.0.0
  description: |
    本檔涵蓋 RoomPilot 八步工作流中**第 5 步（需求問卷視覺題庫）與第 6 步（家具型錄、
    場景生成、擺位裁決、模型交付）**這一族路由，全部實作在 `backend/server/main.py`
    的單一 FastAPI app。

    **佐證基準**：分支 `yen`、HEAD `8f378b24`、2026-08-12 工作樹。
    **本檔由程式碼反推，非手寫契約先行**——每個 schema 欄位都對照實際的 dict 組裝或
    `Query()` 宣告；程式碼看不出形狀的欄位一律標「待確認」，不臆測型別。

    **本檔涵蓋**：`/api/catalog/status`、`/api/questionnaire/visual-catalog`、
    `/api/questionnaire/visual-images/{image_id}`、`/api/furniture`（分頁與 facet）、
    `/api/scene/generate|layout|decorate|validate`、
    `/api/furniture/{furniture_id}/model|model.gltf|buffer.bin|images/{image_index}`。

    **本檔不含**：專案與工作流保存（[`openapi-project-workflow-v1.yaml`](./openapi-project-workflow-v1.yaml)）、
    Agent 與檢索（[`openapi-agent-rag-v1.yaml`](./openapi-agent-rag-v1.yaml)）、
    生圖與交付（[`openapi-render-delivery-v1.yaml`](./openapi-render-delivery-v1.yaml)）。
    端點總索引、錯誤格式約定與棄用政策見 [`api_spec.md`](./api_spec.md)；
    `/api/scene/bootstrap`、`/api/scene/provider-status`、`/api/site-data`、`/api/home-data`、
    `/api/styles` 與 `frontend3d/` 遺留路由（`/api/sample-furniture`、`/api/furniture/{name}`，
    `main.py:4050-4052` 註明為移植路由）不在本檔。

    **共通約定**
    - 無認證、無 CORS、無 rate limit；唯一邊界是 `--host 127.0.0.1`（NFR-019，待 DEC-014 核准）。
    - 長度與座標一律公分，`position_cm` 以房間中心為原點、`rotation_y_deg ∈ [0,360)`
      （`scene_service.py:2672-2677`；ADR-007、NFR-017）。
    - 錯誤主體為 FastAPI 預設 `{"detail": ...}`；本族多數 `detail` 是繁體中文句子而非
      機器碼，唯一機器碼是 `questionnaire_image_not_found`。
    - `/api/scene/*` 四支路由在 `scene_service.py` 全檔**沒有任何 `raise`**，也沒有
      try/except；輸入畸形（例如 `floorplan.width_cm` 非數值）會以未捕捉例外變成 500。
      這是現況記述，不是設計意圖，見 §x-open-question。
    - `GET /api/catalog/status` 只宣告 200，是刻意的：`main.py:3144-3146` 是單行委派，
      沒有 `raise` 也沒有 try/except，型錄可用性以 200 主體承載（PostgreSQL 不可用時
      降級為已驗證 JSON，見 ADR-005）。本檔不為它宣告錯誤 response；未捕捉例外會落到
      FastAPI 預設 500，那是框架行為而非本契約承諾。
    - 家具合法位置只由 `backend/engine/` 判定（AGENTS.md §不可違反的契約、ADR-002）。
    - 家電需求只寫入 `scene_json.render_context.appliance_requirements`，不進 `scene_objects`
      （`scene_service.py:3058-3062`；ADR-006、FR-028）。
servers:
  - url: http://127.0.0.1:8002
    description: Pilot 本機唯一部署形態（`README.md:49`、ADR-012）
tags:
  - name: catalog
    description: 型錄供應狀態與分頁查詢（FR-039–042；MOD-CAT／MOD-SQL）
  - name: questionnaire
    description: 第 5 步視覺題庫（FR-026；MOD-SRV-SCENE）
  - name: scene
    description: 第 6 步 scene_json 生成、重排、軟裝與落點驗證（FR-029–038；MOD-SRV-SCENE／MOD-ENG）
  - name: model-delivery
    description: GLB 與型錄圖片交付（FR-042；ADR-005）

paths:
  /api/catalog/status:
    get:
      tags: [catalog]
      summary: 揭露型錄供應者、GLB 與圖片 manifest、面材與色卡數（不外洩連線設定）
      operationId: getCatalogStatus
      x-evidence: main.py:3095-3146；postgres_repository.py:748-857
      x-requirement: [FR-040, FR-041, NFR-008, ACPT-037]
      responses:
        "200":
          description: |
            **DB 不可用時仍回 200**，以 `catalog_provider.available=false` ＋ `reason`
            （例外類別名）表達，服務不整體停擺（`postgres_repository.py:849-857`；NFR-008）。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogStatus" }

  /api/questionnaire/visual-catalog:
    get:
      tags: [questionnaire]
      summary: 取得視覺題庫（可依空間類型與已生成圖片篩選）
      operationId: getQuestionnaireVisualCatalog
      x-evidence: main.py:3195-3215；questionnaire_visuals.py:100-135,221-240
      x-requirement: [FR-026, ACPT-024]
      parameters:
        - name: space_type
          in: query
          required: false
          schema: { type: string, nullable: true }
          description: 直接映射 SQLite `WHERE space_type = ?`；未列舉合法值（`questionnaire_visuals.py:226-228`）。
        - name: ready_only
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: true 時只回 `ready = 1` 的題目（`questionnaire_visuals.py:229-230`）。
      responses:
        "200":
          description: 成功；`questions` 依 `sequence` 排序。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionnaireVisualCatalog" }
        "422":
          description: FastAPI 參數驗證失敗（`ready_only` 非布林可解析值）。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FastApiValidationError" }

  /api/questionnaire/visual-images/{image_id}:
    get:
      tags: [questionnaire]
      summary: 取得單一題目選項的視覺圖 metadata
      operationId: getQuestionnaireVisualImage
      x-evidence: main.py:3218-3226；questionnaire_visuals.py:20-48,242-250
      x-requirement: [FR-026, ACPT-024]
      parameters:
        - name: image_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 回傳 metadata（含 `image_url` 靜態路徑），**不回傳圖片位元組**。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionnaireOption" }
        "404":
          description: 'detail 字串：`questionnaire_image_not_found`'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetail" }
              example: { detail: questionnaire_image_not_found }

  /api/furniture:
    get:
      tags: [catalog]
      summary: 家具型錄分頁查詢與 facet（隔離區資料零外洩）
      operationId: listFurniture
      x-evidence: main.py:3229-3279,1369-1405,1429-1508；tests/test_cloud_quarantine.py:23-40
      x-requirement: [FR-039, FR-045, NFR-006, ACPT-036, ACPT-040]
      parameters:
        - { name: style, in: query, schema: { type: string, nullable: true }, description: 比對 `_furniture_matches_style`（main.py:1386）。 }
        - { name: group, in: query, schema: { type: string, nullable: true }, description: 全等比對 `taxonomy_group`（main.py:1388）。 }
        - { name: type, in: query, schema: { type: string, nullable: true }, description: 全等比對 `normalized_type`；程式內參數名為 `item_type`（main.py:3233）。 }
        - { name: q, in: query, schema: { type: string, nullable: true }, description: 關鍵字；命中時改用 `_furniture_query_sort_key` 重排（main.py:1400-1404）。 }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 80, default: 24 } }
        - { name: has_model, in: query, schema: { type: boolean, nullable: true }, description: 依 `has_model` 布林精確篩（main.py:1392）。 }
        - name: detail
          in: query
          schema: { type: string, default: card }
          description: |
            僅 `scene` 與其他兩種行為：`scene` 回型錄原始欄位全集，任何其他值（含預設
            `card`）回 `FurnitureCard`（main.py:3266）。程式未以 enum 限制取值。
        - { name: color, in: query, schema: { type: string, nullable: true }, description: 經 `_normalize_furniture_facet_value` 正規化後 casefold 全等（main.py:1394）。 }
        - { name: material, in: query, schema: { type: string, nullable: true }, description: 同上（main.py:1396）。 }
        - name: size
          in: query
          schema: { type: string, enum: [small, medium, large], nullable: true }
          description: 依最長邊分桶 ≤80／≤160／>160 cm（main.py:1408-1426）。
      responses:
        "200":
          description: |
            `filter_options` 的 facet 由**未套 color／material／size 的候選集**計算
            （main.py:3243-3249），因此已選面向不會把自己的其他選項洗掉。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FurnitureListResponse" }
        "422":
          description: |
            `page < 1` 或 `page_size` 不在 1–80，由 FastAPI `Query(ge=/le=)` 直接擋下
            （main.py:3235-3236；NFR-006）。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FastApiValidationError" }

  /api/scene/generate:
    post:
      tags: [scene]
      summary: 由問卷＋layout_json／floorplan_editor 產生 scene_json（含 A／B 方案）
      operationId: generateScene
      x-evidence: main.py:3591-3644；scene_service.py:2888,2995-3088
      x-requirement: [FR-028, FR-029, FR-030, FR-031, FR-037, ACPT-026, ACPT-027, ACPT-028, ACPT-029, ACPT-034]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SceneGenerateRequest" }
      responses:
        "200":
          description: |
            回傳整包場景，且以 `scene_json` 鍵**再放一份深拷貝**（main.py:3641-3644）；
            前端持久化的是 `scene_json`。擺不下的品項不會被丟棄，改以
            `placement.failed[]` ＋ `placement.unavailable_types[]` 回報（FR-037）。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneGenerateResponse" }
        "422":
          description: '請求主體不是 JSON 物件（FastAPI 對 `payload: dict` 的預設驗證）。'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FastApiValidationError" }
        "500":
          description: |
            **現況**：本路由無 try/except，`build_scene_payload` 內部例外（型錄不可用、
            floorplan 欄位型別錯誤等）以未捕捉例外呈現，無結構化 detail。見 §x-open-question。

  /api/scene/layout:
    post:
      tags: [scene]
      summary: 由引擎重算全場座標；validate_only 只驗不排
      operationId: layoutScene
      x-evidence: main.py:3647-3709；scene_service.py:2338-2391
      x-requirement: [FR-030, FR-031, FR-032, FR-034, ACPT-029, ACPT-030]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SceneLayoutRequest" }
      responses:
        "200":
          description: |
            指定 `placement_room_id` 時，標了他房 id 的品項一律 **passthrough 原樣回傳**
            並排在陣列前段（main.py:3676-3691），伺服器端保證單房呼叫不動他房家具。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneLayoutResponse" }
        "422":
          description: 請求主體不是 JSON 物件。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FastApiValidationError" }
        "500":
          description: 同 `/api/scene/generate`：無錯誤處理，例外即 500。

  /api/scene/decorate:
    post:
      tags: [scene]
      summary: 依風格與錨點家具加入軟裝（地毯／植栽／落地燈／布簾），座標仍由引擎決定
      operationId: decorateScene
      x-evidence: main.py:3799-3995,3726-3762
      x-requirement: [FR-038, ACPT-035]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SceneDecorateRequest" }
      responses:
        "200":
          description: |
            每次呼叫是**重算不是累加**：先移除本房與 `default` 的既有 `auto_decor_role`
            品項再重建（main.py:3835-3841）。找不到有 GLB 的候選時列入
            `decor_summary.unavailable` 並繼續，不中斷（main.py:3939-3943）。
            擺不下的自動軟裝直接從回傳中濾除，不留失敗標記（main.py:3977-3982）。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneDecorateResponse" }
        "409":
          description: |
            **實測不可達**：`_auto_decor_catalog_item` 的 409 `decor_model_missing`
            （main.py:3756-3762）在唯一呼叫點被 `except HTTPException` 全數攔下轉成
            `unavailable`（main.py:3939-3943），布簾走常數不會拋。保留於契約僅記錄該
            分支存在，見 §x-open-question。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecorModelMissingError" }
        "422":
          description: 請求主體不是 JSON 物件。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FastApiValidationError" }

  /api/scene/validate:
    post:
      tags: [scene]
      summary: 單件家具拖曳落點合法性判定（引擎裁決，回中文原因）
      operationId: validateScenePlacement
      x-evidence: main.py:3998-4009；scene_service.py:2111-2156；engine/clearance.py:118-143
      x-requirement: [FR-033, FR-034, FR-035, ACPT-031, ACPT-032]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SceneValidateRequest" }
      responses:
        "200":
          description: |
            `ok=false` 時 `reason` 是繁體中文句子，只回**最先命中**的違規
            （`engine/clearance.py:118-143`）。已知固定字串包含
            「超出房間範圍(需完整放在某一間房內,不能跨牆)」（`scene_service.py:2125`）、
            「落地窗是陽台出入動線，家具不可擋在前方。」（`scene_service.py:2136`）、
            「家具不可遮擋窗戶前方採光淨空。」（`scene_service.py:2147`）；
            其餘由引擎產生，字串清單見 [`lld.md`](./lld.md)。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneValidateResponse" }
        "422":
          description: 請求主體不是 JSON 物件。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FastApiValidationError" }

  /api/furniture/{furniture_id}/model:
    get:
      tags: [model-delivery]
      summary: 取得家具 GLB（遠端 URL 走 307 轉址）
      operationId: getFurnitureModel
      x-evidence: main.py:4012-4018,1066-1087,1020-1029；services/cloud_models.py:44-52,160-192
      x-requirement: [FR-042, ACPT-038]
      parameters:
        - { name: furniture_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 本機或遠端取得的 GLB 位元組（`model/gltf-binary`）。
          content:
            model/gltf-binary:
              schema: { type: string, format: binary }
        "307":
          description: |
            `model_url` 以 `http(s)://` 開頭時直接轉址（main.py:4016-4017）；或 CloudFront
            manifest 命中時轉址（main.py:1067-1069）。
          headers:
            Location: { schema: { type: string, format: uri } }
        "404":
          description: |
            detail 字串（繁體中文句子，非機器碼）：
            `Furniture not found in merged catalog.`（main.py:1029）；
            CloudFront 模式且 manifest 未命中時為 `cloud_model_status()` 的第二元素，
            例如 `CloudFront manifest 中找不到此家具的 delivery_url。`、
            `CloudFront 模式未設定 manifest。`、`CloudFront manifest 沒有已驗證的家具模型。`
            （`services/cloud_models.py:177-192`）；本機檔缺失時
            `找不到這件家具對應的 GLB 檔案(dataset/ 未就緒?)。`（main.py:1093）或
            `找不到可載入的 GLB 模型。`（main.py:1087）。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetail" }
        "502":
          description: |
            遠端 GLB 讀取失敗 `遠端 GLB 讀取失敗：<原因>`，或回傳內容非 glTF magic
            `遠端模型不是可用的 GLB 檔案。`（main.py:1057-1061，逾時 20 秒）。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetail" }

  /api/furniture/{furniture_id}/model.gltf:
    get:
      tags: [model-delivery]
      summary: 本機 GLB 拆解為 glTF JSON（CloudFront 模式停用）
      operationId: getFurnitureModelGltf
      x-evidence: main.py:4021-4027,1098-1115
      x-requirement: [FR-042, ACPT-038]
      parameters:
        - { name: furniture_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: |
            glTF JSON，`buffers[0].uri` 改寫為 `buffer.bin`、內嵌影像改寫為 `images/{index}`
            （main.py:1102-1109）。完整 glTF 2.0 結構不在本檔重述。
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404":
          description: '`找不到這件家具資料。`（main.py:1008）或 `找不到這件家具對應的 GLB 檔案(dataset/ 未就緒?)。`（main.py:1093）'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetail" }
        "410":
          description: '`CloudFront 模式不提供本機 glTF 拆解端點。`（main.py:4024）'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetail" }

  /api/furniture/{furniture_id}/buffer.bin:
    get:
      tags: [model-delivery]
      summary: 本機 GLB 二進位 buffer（CloudFront 模式停用）
      operationId: getFurnitureModelBuffer
      x-evidence: main.py:4030-4037
      x-requirement: [FR-042, ACPT-038]
      parameters:
        - { name: furniture_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: GLB BIN chunk。
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          description: '同 `model.gltf`：`找不到這件家具資料。` 或 `找不到這件家具對應的 GLB 檔案(dataset/ 未就緒?)。`'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetail" }
        "410":
          description: '`CloudFront 模式不提供本機 GLB buffer。`（main.py:4033）'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetail" }

  /api/furniture/{furniture_id}/images/{image_index}:
    get:
      tags: [model-delivery]
      summary: 取出 GLB 內嵌貼圖（CloudFront 模式停用）
      operationId: getFurnitureModelImage
      x-evidence: main.py:4040-4047
      x-requirement: [FR-042, ACPT-038]
      parameters:
        - { name: furniture_id, in: path, required: true, schema: { type: string } }
        - { name: image_index, in: path, required: true, schema: { type: integer }, description: 'glTF `images[]` 索引；越界行為由 `_image_bytes_from_glb` 決定，待確認。' }
      responses:
        "200":
          description: 影像位元組，`Content-Type` 取自 GLB 內宣告的 mimeType。
          content:
            image/*:
              schema: { type: string, format: binary }
        "404":
          description: '同 `model.gltf` 的 404 字串。'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetail" }
        "410":
          description: '`CloudFront 模式不提供本機 GLB 圖片。`（main.py:4043）'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorDetail" }
        "422":
          description: '`image_index` 非整數（FastAPI 路徑參數驗證）。'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FastApiValidationError" }

components:
  schemas:
    ErrorDetail:
      type: object
      required: [detail]
      properties:
        detail: { type: string, description: FastAPI `HTTPException(detail=str)` 的原字串；本族多為繁體中文句子。 }

    FastApiValidationError:
      type: object
      required: [detail]
      description: FastAPI 預設 422 主體，非本專案自訂。
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc: { type: array, items: { oneOf: [{ type: string }, { type: integer }] } }
              msg: { type: string }
              type: { type: string }

    DecorModelMissingError:
      type: object
      required: [detail]
      properties:
        detail:
          type: object
          required: [code, message]
          properties:
            code: { type: string, const: decor_model_missing }
            message: { type: string, description: '例：`型錄中找不到可用的地毯 GLB，已停止自動配置。`（main.py:3760）' }

    CatalogProvider:
      type: object
      description: |
        三種分支共用一個物件（`postgres_repository.py:748-857`）：
        (a) JSON 離線模式；(b) PostgreSQL 可用；(c) PostgreSQL 探測失敗。
        `provider` 決策見 `postgres_repository.py:199-204`：`ROOMPILOT_CATALOG_PROVIDER`
        ∈ {json,local,fallback} → JSON，其餘（含未設）→ postgres（FR-041、ADR-005）。
      required: [provider, available, ready, source_of_truth, strict]
      properties:
        provider: { type: string, enum: [json_offline, kai_postgresql] }
        available: { type: boolean }
        ready: { type: boolean, description: PostgreSQL 分支需 `count > 0` 且 view 存在。 }
        strict: { type: boolean }
        source_of_truth: { type: string, enum: [versioned_files, postgresql] }
        reason: { type: string, description: 'JSON 分支固定 `explicit_json_mode`；失敗分支為例外類別名（如 `OperationalError`）。' }
        count: { type: integer, description: '`kind = ''furniture''` 的列數。與 `main.py:919` 的 `OFFICIAL_CATALOG_COUNT == 8675` 是否一致見 OPEN-06。' }
        api_view: { type: string, const: roompilot.furniture_catalog_current }
        data_revision: { type: [string, "null"], format: date-time, description: 目前 SQL 固定回 NULL（`postgres_repository.py:805`）。 }
        import_batch: { type: [object, "null"], description: 目前 `batch` 恆為 None，故固定 null（`postgres_repository.py:800,817-826`）。 }
        assets:
          type: object
          properties:
            model_count: { type: integer }
            front_image_count: { type: integer }
            side_image_count: { type: integer }
            angle_45_image_count: { type: integer }
            complete_image_item_count: { type: integer }
        database:
          type: object
          properties:
            name: { type: string }
            server_version: { type: string }
            api_view_ready: { type: boolean }
            project_table_ready: { type: boolean, description: SQL 固定回 FALSE（`postgres_repository.py:804`）。 }
            project_count: { type: [integer, "null"] }

    CatalogStatus:
      type: object
      required: [catalog_provider, furniture, furniture_images, surfaces, doors, style_cards]
      properties:
        catalog_provider: { $ref: "#/components/schemas/CatalogProvider" }
        furniture:
          type: object
          description: PostgreSQL 可用時為固定五欄（main.py:3100-3106）；否則為 `manifest_status()` 去掉 `mode` 的結果（main.py:3118-3119），欄位集合待確認。
          properties:
            provider: { type: string }
            manifest_ready: { type: boolean }
            verified_model_count: { type: integer }
            catalog_count: { type: integer }
            source_of_truth: { type: string }
        furniture_images:
          type: object
          description: PostgreSQL 分支的 `verified_image_count` ＝ front＋side＋angle_45 三欄加總（main.py:3111-3114）。
          properties:
            provider: { type: string }
            manifest_ready: { type: boolean }
            verified_item_count: { type: integer }
            verified_image_count: { type: integer }
            source_of_truth: { type: string }
        surfaces:
          type: object
          properties:
            provider: { type: string, const: local_pending_aws_manifest }
            wall_count: { type: integer }
            floor_count: { type: integer }
        doors:
          type: object
          properties:
            provider: { type: string, const: procedural_pending_aws_catalog }
            catalog_count: { type: integer, const: 0, description: 門為程序生成，型錄數恆 0（main.py:3133-3136）。 }
        style_cards:
          type: object
          properties:
            provider: { type: string, const: local_allowed }
            count: { type: integer }

    QuestionnaireOption:
      type: object
      description: 由 `_normalized_option` 組裝（`questionnaire_visuals.py:20-48`）；`visual-images/{image_id}` 回傳同一形狀。
      required: [image_id, question_id, space_type, option_id, label_zh, image_path, image_url, generation_status, watermark, prompt_contract_id, visual_brief_zh]
      properties:
        image_id: { type: string }
        question_id: { type: string }
        space_type: { type: string }
        option_id: { type: string }
        label_zh: { type: string }
        image_path: { type: string, description: '固定 `questionnaire_images/<image_id>.png`。' }
        image_url: { type: string, description: '固定 `/static/questionnaire_images/<image_id>.png`。' }
        generation_status: { type: string, enum: [planned, ready] }
        image_sha256: { type: [string, "null"] }
        watermark: { type: string, const: RoomPilot }
        prompt_contract_id: { type: string, description: '本版資料為 `roompilot-layout-neutral-v1`。' }
        visual_brief_zh: { type: string }
        rag_tags: { type: array, items: { type: string } }
        engine_effects: { type: object, additionalProperties: true, description: 選項對引擎的效果鍵值；鍵集合由題庫資料決定，未在程式碼中列舉，待確認。 }
        risk_triggers: { type: array, items: { type: string }, description: 由所屬題目繼承（`questionnaire_visuals.py:46`）。 }

    QuestionnaireQuestion:
      type: object
      required: [question_id, sequence, space_type, title_zh, purpose_zh, selection_rule, allow_both, custom_input_example_zh, risk_triggers, options]
      properties:
        question_id: { type: string }
        sequence: { type: integer, minimum: 1 }
        space_type: { type: string }
        title_zh: { type: string }
        purpose_zh: { type: string }
        selection_rule: { type: string, enum: [exclusive, compatible, weighted], description: '`questionnaire_visuals.py:12`；`exclusive` 不得同時 `allow_both`（:67-68）。' }
        allow_both: { type: boolean }
        custom_input_example_zh: { type: string }
        risk_triggers: { type: array, items: { type: string } }
        options:
          type: array
          minItems: 2
          maxItems: 2
          description: 載入期強制每題恰兩個選項（`questionnaire_visuals.py:69-70`）。
          items: { $ref: "#/components/schemas/QuestionnaireOption" }

    QuestionnaireVisualCatalog:
      type: object
      required: [version, notice_zh, question_count, image_count, ready_image_count, questions]
      properties:
        version: { type: string, description: '本版資料為 `1.0.0`（`data/questionnaire_visual_catalog.json`）。' }
        notice_zh: { type: string }
        question_count: { type: integer, description: 題庫總題數（本版 55），**非**本次篩選後的筆數。 }
        image_count: { type: integer, description: 題庫總圖數（本版 110）。 }
        ready_image_count: { type: integer, description: 全題庫 `generation_status == "ready"` 的選項數（main.py:3209-3213）。 }
        questions:
          type: array
          description: 已套用 `space_type`／`ready_only` 篩選；筆數可能小於 `question_count`。
          items: { $ref: "#/components/schemas/QuestionnaireQuestion" }

    FurnitureCard:
      type: object
      description: |
        `_furniture_card_payload` 的固定 28 鍵（main.py:873-906）。**所有鍵一律出現**，
        來源列缺值時值為 null，故 required 只列消費端實際依賴的鍵。
      required: [furniture_id, normalized_type, size_cm, has_model, model_url]
      properties:
        furniture_id: { type: [string, "null"] }
        name_en: { type: [string, "null"] }
        name_zh: { type: [string, "null"], description: 取 `name_zh`，缺則退 `name_zh_raw`。 }
        name_zh_raw: { type: [string, "null"] }
        category_label: { type: [string, "null"] }
        taxonomy_group: { type: [string, "null"] }
        taxonomy_group_zh: { type: [string, "null"] }
        taxonomy_type_zh: { type: [string, "null"] }
        catalog_scope: { type: [string, "null"] }
        normalized_type: { type: [string, "null"], description: 引擎與選件規則的型別鍵。 }
        primary_style: { type: [string, "null"] }
        style_primary: { type: [string, "null"] }
        style_secondary: { type: [string, "null"] }
        style_candidates: { type: array, items: { type: object, additionalProperties: true } }
        room_types: { type: array, items: { type: string } }
        catalog_role: { type: [string, "null"], description: 來源欄位名為 `role`（main.py:890）。 }
        description: { type: [string, "null"], description: 型錄 VLM 外觀描述；第 8 步生圖提示詞會消費（`scene_service.py:2666-2668`）。 }
        rag_text: { type: array, items: { type: string } }
        mood_tags: { type: array, items: { type: string } }
        features: { type: array, items: { type: string } }
        search_keywords: { type: array, items: { type: string } }
        color: { type: [string, "null"] }
        material: { type: [string, "null"] }
        size_cm: { $ref: "#/components/schemas/SizeCm" }
        has_model: { type: [boolean, "null"] }
        missing_model_reason: { type: [string, "null"] }
        model_url: { type: [string, "null"] }
        image_url: { type: [string, "null"] }
        thumbnail_url: { type: [string, "null"] }
        preview_url: { type: [string, "null"] }
        preview_images: { type: object, additionalProperties: true }

    SizeCm:
      type: object
      description: 公分制外框尺寸（ADR-007、NFR-017）。
      properties:
        width: { type: [number, "null"] }
        depth: { type: [number, "null"] }
        height: { type: [number, "null"] }

    FurnitureListResponse:
      type: object
      required: [items, page, page_size, total, has_next_page, styles, type_options, category_groups, filter_options, furniture, catalog_status]
      properties:
        items:
          type: array
          items:
            oneOf:
              - { $ref: "#/components/schemas/FurnitureCard" }
              - { type: object, additionalProperties: true, description: '`detail=scene` 時的型錄原始欄位全集，欄位集合隨供應者而異，待確認。' }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: 套完全部篩選條件後的筆數（分頁前）。 }
        has_next_page: { type: boolean }
        styles:
          type: array
          items:
            type: object
            properties:
              style_id: { type: [string, "null"] }
              style_name_zh: { type: [string, "null"] }
        type_options:
          type: array
          description: 依 style／group／has_model（不含 q、color、material、size）統計，count 由大到小（main.py:1455-1476）。
          items:
            type: object
            properties:
              type: { type: string }
              count: { type: integer }
              type_name_zh: { type: string }
        category_groups:
          type: array
          items:
            type: object
            properties:
              group_id: { type: string, description: 無 `taxonomy_group` 者歸入 `soft_decor`（main.py:1482）。 }
              group_name_zh: { type: string }
              types:
                type: array
                items:
                  type: object
                  properties:
                    type: { type: string }
                    type_name_zh: { type: string }
                    count: { type: integer }
        filter_options:
          type: object
          description: 濾除 `尚未整理`／`unknown`／亂碼等值；colors／materials 各取前 18 名（main.py:1429-1452）。
          properties:
            sizes:
              type: array
              items: { type: object, properties: { value: { type: string }, label: { type: string } } }
            colors: { $ref: "#/components/schemas/CountedFacet" }
            materials: { $ref: "#/components/schemas/CountedFacet" }
        furniture:
          type: array
          items: { type: string }
          description: |
            遺留 R3F viewer 用清單：CloudFront 模式回最多 24 個 https GLB URL，否則回
            本機 `SAMPLE_GLB_DIR` 檔名（main.py:3282-3296）。與 `items` 無對應關係。
        catalog_status: { $ref: "#/components/schemas/CatalogStatus" }

    CountedFacet:
      type: array
      items:
        type: object
        required: [value, label, count]
        properties:
          value: { type: string }
          label: { type: string }
          count: { type: integer }

    SceneGenerateRequest:
      type: object
      description: |
        路由簽名為 `payload: dict`（main.py:3592），**沒有 pydantic model**，因此無任何欄位
        為必填、無型別強制；下列鍵是 main.py:3595-3639 實際讀取的全集，未列鍵會被忽略。
      properties:
        space_type: { type: string, default: living_room, description: 缺值時退 `client_brief.space.type`，再退 `living_room`。 }
        style_preference: { type: string, description: '缺值時取 `client_brief.style.preferred[0]`，再退 `auto`。' }
        style_card_id: { type: [string, "null"] }
        required_furniture: { type: array, items: { type: string }, default: [] }
        selected_furniture: { type: array, items: { type: object, additionalProperties: true }, default: [] }
        selected_furniture_exact: { type: boolean, default: false, description: 僅 `is True` 才成立（main.py:3607）。 }
        custom_furniture: { type: array, items: { type: object, additionalProperties: true }, default: [] }
        preferred_colors: { type: array, items: { type: string } }
        custom_colors: { type: array, items: { type: string }, default: [] }
        personal_notes: { type: string, default: "" }
        questionnaire: { type: object, additionalProperties: true, description: '第 5 步逐房需求（`room_requirements` schema 1.0）；內部傳為 `test2_questionnaire`。欄位級定義見 `lld.md` 與 `docs/contracts/FURNITURE_ENGINE_ROOM_REQUIREMENTS_CONTRACT.md`。' }
        keep_window_clear: { type: boolean, description: 缺值時看 `client_brief.constraints` 是否含 `keep_window_clear`。 }
        keep_door_clear: { type: boolean, description: 缺值時看 `client_brief.constraints` 是否含 `keep_door_clear`。 }
        need_storage: { type: boolean, description: 缺值時看 `client_brief.needs` 是否含 `storage`。 }
        prefer_low_saturation: { type: boolean, description: 缺值時看 `client_brief.style.colors` 是否含 `low_saturation`。 }
        client_brief: { type: object, additionalProperties: true, description: 讀取 `space`／`style`／`occupants`／`constraints`／`needs` 五段；完整 schema 待確認。 }
        floorplan_filename: { type: [string, "null"] }
        floorplan_dxf_text: { type: [string, "null"] }
        layout_json: { type: [object, "null"], additionalProperties: true, description: 第 3 步辨識輸出（ADR-001）；欄位定義見 `api_spec.md` 與 `openapi-project-workflow-v1.yaml`。 }
        floorplan_editor: { type: [object, "null"], additionalProperties: true, description: '第 4 步結構編輯輸出（`coordinate_unit:"cm"`、`rooms[]`、`structures{}`；FR-018）。' }
        wall_option: { type: string, default: auto }
        floor_option: { type: string, default: auto }
        furniture_random_seed: { type: [integer, "null"], description: 唯一隨機來源的 seed（NFR-016）。 }
        placement_variant: { type: string, enum: [A, B], default: A, description: 非法值（含小寫以外的任何字串）一律退回 A（main.py:3629-3632；FR-031）。 }
        room_width_cm: { type: number, default: 420, description: 缺值時退 `client_brief.space.width_cm`，再退 420。 }
        room_depth_cm: { type: number, default: 360, description: 缺值時退 `client_brief.space.depth_cm`，再退 360。 }

    ScenePayload:
      type: object
      description: '`build_scene_payload` 的回傳（`scene_service.py:2995-3088`），即前端持久化的 `scene_json`。'
      required: [scene_id, questionnaire, requirement, plan_json, floorplan, style, design_choices, render_context, furniture_candidates, selected_furniture, scene_objects, placement]
      properties:
        scene_id: { type: string, description: '`scene_<uuid4 前 10 碼>`。' }
        llm_mode: { type: [string, "null"], description: 第 6 步場景規劃的 LLM 模式；取值集合待確認。 }
        llm_model: { type: [string, "null"] }
        questionnaire: { type: object, additionalProperties: true, description: 原樣回填的正規化問卷（見 SceneGenerateRequest）。 }
        requirement:
          type: object
          properties:
            schema_version: { type: string, const: "1.0" }
            room_type: { type: [string, "null"] }
            style: { type: [string, "null"] }
            prefer_color: { type: array, items: { type: string } }
            requirements: { type: array, items: { type: string } }
            constraints:
              type: object
              properties:
                must_keep: { type: array, items: { type: string } }
                priority_order: { type: array, items: { type: string } }
                preferred_layout_pattern: { type: string }
                style_strictness: { type: string, const: high }
                notes: { type: array, items: { type: string } }
        plan_json: { type: object, additionalProperties: true, description: 內部規劃中繼結果；欄位集合未在路由層固定，待確認（歸屬 `lld.md`）。 }
        floorplan: { $ref: "#/components/schemas/SceneFloorplan" }
        style:
          type: object
          properties:
            style_id: { type: [string, "null"] }
            style_name_zh: { type: [string, "null"] }
            scene_background: { type: object, additionalProperties: true }
            palette_hex: { type: array, items: { type: string } }
            surface_profile: { type: object, additionalProperties: true }
        style_card: { type: object, additionalProperties: true, description: '未選色卡時為 `{}`。' }
        design_choices:
          type: object
          properties:
            style_card_id: { type: [string, "null"] }
            wall_option: { type: string }
            floor_option: { type: string }
            single_room_mode: { type: boolean, description: 無 DXF 解析結果時為 true。 }
            accurate_dxf_mode: { type: boolean }
        render_context:
          type: object
          description: 第 8 步生圖上下文；家電需求只出現在這裡（ADR-006、FR-028）。
          properties:
            appliance_requirements:
              type: array
              items: { type: object, additionalProperties: true }
              description: 非 list 型別會被強制成 `[]`（`scene_service.py:3058-3062`）；元素欄位定義待確認。
        surface_catalog: { type: object, additionalProperties: true, description: 面材型錄原樣帶出，欄位見 `db_design.md`。 }
        furniture_candidates:
          type: object
          properties:
            schema_version: { type: string, const: "1.0" }
            room_type: { type: [string, "null"] }
            style: { type: [string, "null"] }
            candidates: { type: array, items: { type: object, additionalProperties: true } }
            layout_relations: { type: array, items: { type: object, additionalProperties: true }, description: 目前恆為空陣列（`scene_service.py:3069`）。 }
        selected_furniture: { type: array, items: { type: object, additionalProperties: true } }
        scene_objects: { type: array, items: { $ref: "#/components/schemas/SceneObject" } }
        placement_resolution_report:
          type: array
          items: { type: object, additionalProperties: true }
          description: 第二輪 `resolve_placements` 的換件／移除紀錄（FR-037）；元素欄位定義歸屬 `lld.md`，待確認。
        placement:
          type: object
          required: [engine, failed, unavailable_types]
          properties:
            engine: { type: string, const: furniture_engine }
            failed:
              type: array
              items:
                type: object
                required: [furniture_id, type, name, reason]
                properties:
                  furniture_id: { type: string }
                  type: { type: [string, "null"] }
                  name: { type: [string, "null"] }
                  reason: { type: string, description: 繁體中文原因（引擎七段檢查最先命中者；FR-034）。 }
            unavailable_types: { type: array, items: { type: string } }

    SceneGenerateResponse:
      allOf:
        - $ref: "#/components/schemas/ScenePayload"
        - type: object
          required: [scene_json]
          properties:
            scene_json:
              $ref: "#/components/schemas/ScenePayload"
              description: 與外層同內容的深拷貝（main.py:3641-3644）；持久化以本鍵為準。

    SceneFloorplan:
      type: object
      required: [coordinate_unit, width_cm, depth_cm, room_height_cm, source]
      properties:
        coordinate_unit: { type: string, const: cm }
        image_path: { type: [string, "null"] }
        width_cm: { type: number }
        depth_cm: { type: number }
        room_height_cm: { type: number, default: 270 }
        source: { type: string, description: 無解析結果時為 `manual`；其餘取自解析器，取值集合待確認。 }
        wall_count: { type: integer }
        door_count: { type: integer }
        window_count: { type: integer }
        raw_segment_count: { type: integer }
        layers: { type: array, items: { type: string } }
        wall_layers: { type: array, items: { type: string } }
        door_layers: { type: array, items: { type: string } }
        window_layers: { type: array, items: { type: string } }
        wall_segments: { type: array, items: { $ref: "#/components/schemas/Segment" } }
        wall_polys: { type: array, items: { type: object, additionalProperties: true } }
        plan_segments: { type: array, items: { type: object, additionalProperties: true } }
        door_segments: { type: array, items: { type: object, additionalProperties: true } }
        window_segments: { type: array, items: { type: object, additionalProperties: true } }
        beam_segments: { type: array, items: { type: object, additionalProperties: true } }
        columns: { type: array, items: { type: object, additionalProperties: true } }
        room_regions:
          type: array
          description: 逐房多邊形；`room_id` 與 `room_type` 是逐房擺位與軟裝判定的鍵（main.py:3818-3832、`scene_service.py:2017`）。其餘欄位歸屬 `lld.md`，待確認。
          items: { type: object, additionalProperties: true }

    Segment:
      type: object
      description: |
        牆段端點。`room_from_payload` 讀 `start.x/start.z/end.x/end.z`；缺 `coordinate_unit`
        的舊專案視為公尺並轉換一次（`scene_service.py:1725-1750`）。
      properties:
        start: { type: object, properties: { x: { type: number }, z: { type: number } } }
        end: { type: object, properties: { x: { type: number }, z: { type: number } } }

    SceneObject:
      type: object
      description: 引擎輸出的單件家具（`scene_service.py:2656-2690`）。座標一律由 `backend/engine/` 決定（ADR-002）。
      required: [furniture_id, instance_id, normalized_type, size_cm, footprint_cm, position_cm, rotation_y_deg, position_locked, placement_failed, placement_engine]
      properties:
        furniture_id: { type: string }
        instance_id: { type: string, description: 同型多件的區分鍵（例：床頭櫃 ×2）。 }
        catalog_furniture_id: { type: [string, "null"] }
        name_zh_raw: { type: [string, "null"] }
        normalized_type: { type: string }
        model_url: { type: [string, "null"] }
        primary_style: { type: [string, "null"] }
        material: { type: [string, "null"] }
        description: { type: [string, "null"] }
        price: { type: [number, "null"] }
        price_twd: { type: [number, "null"] }
        price_ntd: { type: [number, "null"] }
        size_cm: { $ref: "#/components/schemas/SizeCm" }
        catalog_size_cm: { type: [object, "null"], additionalProperties: true }
        footprint_cm:
          type: object
          description: 套用旋轉後的佔地外框（`scene_service.py:2655,2674`）。
          properties: { width: { type: number }, depth: { type: number } }
        position_cm:
          type: object
          description: 房間中心為原點、公分、四捨五入 2 位（`scene_service.py:2675`）。
          required: [x, z]
          properties: { x: { type: number }, z: { type: number } }
        rotation_y_deg: { type: number, minimum: 0, exclusiveMaximum: 360, description: 出口以 `% 360` 正規化（`scene_service.py:2676-2677`）。 }
        position_locked: { type: boolean, description: 使用者拖曳過並鎖定；重排時若仍合法則不動（main.py:3651-3652）。 }
        placement_failed: { type: boolean }
        placement_reason: { type: [string, "null"], description: 失敗時的繁體中文原因，成功為 null。 }
        placement_engine: { type: string, enum: [furniture_engine, boundary_rule], description: 疊層／忽略碰撞型別走 `boundary_rule`（`scene_service.py:2681-2685`）。 }
        auto_decor_role: { type: [string, "null"], enum: [rug, plant, light, curtain, null] }
        auto_decor_room_id: { type: [string, "null"] }
        placement_relation: { type: [object, "null"], description: '軟裝相對關係，`{kind: under|adjacent, target_types: [...]}`（main.py:3950-3964）。' }
        placement_room_id: { type: [string, "null"], description: 逐房擺位分組鍵；由 `ROOM_AFFINITY` 路由後會回寫（`scene_service.py:2046-2050`；FR-030）。 }

    SceneLayoutRequest:
      type: object
      description: '同樣是 `payload: dict`，無 pydantic model、無必填（main.py:3648）。'
      properties:
        scene_objects: { type: array, items: { $ref: "#/components/schemas/SceneObject" }, default: [] }
        floorplan_editor: { type: [object, "null"], additionalProperties: true, description: 非空 dict 時優先於 `floorplan`（main.py:3655-3657）。 }
        floorplan: { $ref: "#/components/schemas/SceneFloorplan" }
        placement_room_id: { type: [string, "null"], description: 指定時只重排該房，他房 passthrough（main.py:3676-3688）。 }
        placement_variant: { type: string, enum: [A, B], default: A }
        validate_only: { type: boolean, default: false, description: true 時絕不改座標，只回報合法性（main.py:3707；FR-032、ACPT-030）。 }

    SceneLayoutResponse:
      type: object
      required: [floorplan, scene_objects]
      properties:
        floorplan: { $ref: "#/components/schemas/SceneFloorplan" }
        scene_objects:
          type: array
          description: 順序為 `[...他房 passthrough, ...本次引擎輸出]`（main.py:3691）。
          items: { $ref: "#/components/schemas/SceneObject" }

    SceneDecorateRequest:
      type: object
      properties:
        scene_objects: { type: array, items: { $ref: "#/components/schemas/SceneObject" }, default: [] }
        floorplan_editor: { type: [object, "null"], additionalProperties: true }
        floorplan: { $ref: "#/components/schemas/SceneFloorplan" }
        placement_room_id: { type: [string, "null"], description: 缺值時房號視為 `default`（main.py:3834）。 }
        room: { type: [object, "null"], additionalProperties: true, description: 只讀 `type` 或 `room_type` 作為房型後備（main.py:3826-3832）。 }
        style: { type: [string, "null"], description: 軟裝候選的風格偏好；只影響排序不影響合法性（main.py:3764-3780）。 }
        dismissed_roles: { type: array, items: { type: string, enum: [rug, plant, light, curtain] }, description: 使用者刪過的角色不再自動補回（main.py:3897-3905）。 }

    SceneDecorateResponse:
      type: object
      required: [scene_objects, decor_summary]
      properties:
        scene_objects: { type: array, items: { $ref: "#/components/schemas/SceneObject" } }
        decor_summary:
          type: object
          required: [requested, placed, unavailable, engine]
          properties:
            requested: { type: array, items: { type: string, enum: [rug, plant, light, curtain] }, description: 由錨點家具與房型推導（main.py:3873-3893）。 }
            placed: { type: array, items: { type: string } }
            unavailable: { type: array, items: { type: string, enum: [rug, plant, light] }, description: 型錄中找不到有 GLB 的候選；布簾走內建常數不會進此列（main.py:3786-3796,3939-3943）。 }
            engine: { type: string, const: furniture_engine }

    SceneValidateRequest:
      type: object
      description: 三個鍵皆以 `.get()` 讀取並有預設，無必填（main.py:4001-4009）。
      properties:
        floorplan_editor: { type: [object, "null"], additionalProperties: true, description: 非空 dict 時覆蓋 `floorplan`。 }
        floorplan: { $ref: "#/components/schemas/SceneFloorplan" }
        item: { $ref: "#/components/schemas/SceneObject" }
        others:
          type: array
          items: { $ref: "#/components/schemas/SceneObject" }
          description: 同場其他家具；`placement_failed` 或忽略碰撞型別會被排除在比對外（`scene_service.py:2150-2153`）。
      required: []

    SceneValidateResponse:
      type: object
      required: [ok, reason]
      properties:
        ok: { type: boolean }
        reason: { type: [string, "null"], description: '`ok=true` 時為 null；否則為繁體中文單一原因。' }

x-open-question:
  - id: OPEN-06
    text: '`main.py:919` 的 `OFFICIAL_CATALOG_COUNT == 8675` 與健康 view 實際 active 8,076 不一致；契約承諾的 503 `postgres_catalog_unavailable` 在本分支未見實作（`/api/catalog/status` 一律 200）。承接 ADR-005、runbook-catalog-db-unavailable.md。'
  - id: 待確認（無既有 OPEN 編號）
    text: '`/api/scene/*` 四支路由完全沒有錯誤處理：`scene_service.py` 全檔無 `raise`、路由層無 try/except，畸形輸入以 500 呈現而非結構化 detail。這是刻意（Pilot 快通）還是缺口，需 owner 裁定；若列入規格，錯誤碼與 runbook 歸屬 `api_spec.md` 與 RB-007。'
  - id: 待確認（無既有 OPEN 編號）
    text: '`/api/scene/decorate` 的 409 `decor_model_missing`（main.py:3756-3762）在唯一呼叫點被完全攔截（main.py:3939-3943），HTTP 層不可達。應刪除該分支或改為可回傳，需 owner 裁定。'
  - id: 待確認（無既有 OPEN 編號）
    text: '`/api/furniture` 的 `detail` 參數未以 enum 限制，`scene` 以外任何值都退回 card；`items` 因此有兩種形狀。是否收斂為 enum 由 API owner 決定。'

