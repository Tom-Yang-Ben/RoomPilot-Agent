                  summary:
                    type: object
                    properties:
                      total_furniture: { type: integer }
                      styled_furniture: { type: integer }
                  styles: { type: array, items: { type: object, additionalProperties: true }, description: 前 6 筆 }
                  taiwan_style_cards: { type: array, items: { type: object, additionalProperties: true }, description: 前 6 張 }
                  catalog_status: { $ref: "#/components/schemas/CatalogStatus" }
  /api/styles:
    get:
      tags: [catalog]
      summary: 風格資料（18 張色卡全量；main.py:3167-3182）
      operationId: stylesData
      responses:
        "200":
          description: 風格與色卡
          content:
            application/json:
              schema:
                type: object
                properties:
                  styles: { type: array, items: { type: object, additionalProperties: true } }
                  taiwan_style_cards: { type: array, items: { type: object, additionalProperties: true } }
                  surface_catalog: { type: object, additionalProperties: true }
                  summary: { type: object, additionalProperties: true }
                  style_furniture_counts: { type: object, additionalProperties: true }
                  style_type_counts: { type: object, additionalProperties: true }
                  catalog_status: { $ref: "#/components/schemas/CatalogStatus" }
  /api/questionnaire/visual-catalog:
    get:
