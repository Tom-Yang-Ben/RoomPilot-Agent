# =============================================================================
# openapi-roompilot-v1.yaml — RoomPilot API 契約（單一 FastAPI app）
# -----------------------------------------------------------------------------
# 版本: 0.1 | 更新: 2026-08-11 | 狀態: 草稿
# Owner: Bella（backend/server/ 主要 owner，AGENTS.md:36；AI 衍生，人工核准前為 TO-BE）
# 語域: L2（橋接：契約定義，業務語意見 api_spec.md）
# 實例: 每服務一份；本專案為單一 FastAPI app（backend/server/main.py + rag_api.py）
# 定位宣告: 本檔回答「每個端點的 method/path/參數/requestBody/response schema」；
#   設計約定、錯誤語意與端點職責分群見 api_spec.md §1–§5；資料表設計見 db_design.md；
#   模組邊界論述見 ../03_architecture/adr/ADR-001-layout-json-scene-json-boundary.md。
# 生成: AI 由程式碼與文件衍生｜來源版本 git yen@8863a86c 之更正 → git yen@8863a36c
# 追溯: 上游 REQ-001~014、FR-001~015、NFR-001~005（../00-registry.md §2）；
#   證據行號基準 backend/server/main.py、backend/server/rag_api.py（yen@8863a36c）。
#   下游 ../05_qa/test_plan.md（ACPT-001~015）、../02_ux_ui/ui_spec-scene.md。
# =============================================================================
openapi: 3.1.0
info:
  title: RoomPilot API
  version: 0.1.0
  description: |
    RoomPilot（AIPE03 第四組 AI 室內設計系統）八步工作流後端 API。

    - **AI 衍生文件**：由程式碼衍生，人工核准前為 TO-BE｜來源版本 git `yen`@`8863a36c`。
    - 對應需求：FR-001~FR-015（見 `../00-registry.md` §2.2）。
    - 設計約定（命名、公分制鐵律 NFR-001、錯誤格式）見 `api_spec.md` §1–§3；本檔為端點與 schema 的 SSOT。
    - 無認證機制（Pilot 內部工具，main.py:2064 佐證金鑰不外洩即為現行安全邊界）。
    - 無 URL 版本段；以 payload 內 `schema_version` 演進（client_brief 1.1、requirement 1.0、
      design-delivery 1.1、cost estimate 1.0、rag job roompilot.rag.job.v1）。
    - 變更政策：向後相容變更遞增 minor；破壞性變更升 major 並依 api_spec.md §1 的棄用流程。
servers:
  - url: http://127.0.0.1:8000
    description: 本機開發（唯一部署形態，Pilot 階段）
tags:
  - name: pages
    description: 頁面與靜態（api_spec §5.1）
  - name: projects
    description: 專案保存 Project Store（REQ-001、FR-001；api_spec §5.2）
  - name: floorplan
    description: 平面圖辨識，產出 layout_json（REQ-002/004、FR-002/004；api_spec §5.3）
  - name: scene
    description: 場景與家具引擎 scene_json（REQ-006/007、FR-006/007、NFR-004；api_spec §5.4）
  - name: agent
    description: Agent intake／選件／並存管線（FR-005/015；api_spec §5.5）
  - name: renders
    description: 第 7/8 步生圖與交付（REQ-009~012、FR-010/011/012；api_spec §5.6)
  - name: catalog
    description: 型錄／問卷／站台（REQ-013、FR-013、NFR-003/005；api_spec §5.7）
  - name: rag
    description: RAG 檢索（只回排序，不決定幾何；rag_api.py）

paths:
  # ==========================================================================
  # 5.1 頁面與靜態
  # ==========================================================================
  /:
    get:
      tags: [pages]
      summary: 首頁 HTML（main.py:1649）
      operationId: homePage
      responses:
        "200": { $ref: "#/components/responses/HtmlPage" }
  /styles:
    get:
      tags: [pages]
      summary: 風格頁 HTML（main.py:1654）
      operationId: stylesPage
      responses:
        "200": { $ref: "#/components/responses/HtmlPage" }
  /library:
    get:
      tags: [pages]
      summary: 家具庫頁 HTML（main.py:1659）
      operationId: libraryPage
      responses:
        "200": { $ref: "#/components/responses/HtmlPage" }
  /scene:
    get:
      tags: [pages]
      summary: 八步工作流主頁 HTML（Cache-Control no-store；main.py:1664）
      operationId: scenePage
      responses:
        "200": { $ref: "#/components/responses/HtmlPage" }
  /rag:
    get:
      tags: [pages, rag]
      summary: RAG demo 頁 HTML（no-store；rag_api.py:159）
      operationId: ragPage
      responses:
        "200": { $ref: "#/components/responses/HtmlPage" }

  # ==========================================================================
  # 5.2 專案保存（Project Store）
  # ==========================================================================
  /api/projects:
    post:
      tags: [projects]
      summary: 建立專案（main.py:1784）
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, description: 專案名稱；空白回 422 project_name_required }
                notes: { type: string, description: 備註，可省略 }
      responses:
        "201":
          description: 已建立
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectEnvelope" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/projects/{project_id}:
    get:
      tags: [projects]
      summary: 讀取專案（回應帶 Cache-Control no-store；main.py:1800）
      operationId: getProject
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 專案快照（ACPT-001 恢復入口）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectEnvelope" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
  /api/projects/{project_id}/workflow:
    put:
      tags: [projects]
      summary: 保存工作流草稿（深合併＋樂觀鎖；main.py:1806-1867）
      description: |
        workflow JSON 與既有快照深合併（project_store.py:18）；單一快照 ≤2MB（NFR-002）。
        `expected_revision` 樂觀鎖：落後回 409 `project_revision_conflict` 並在 detail 附最新 `project`（ACPT-014）。
        宣告空間確認完成但辨識複核房間未逐一確認時回 422 `recognition_review_unresolved`。
      operationId: saveProjectWorkflow
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_step:
                  type: string
                  description: 目前步驟 id；須為 WORKFLOW_STEPS 合法值（main.py:1810），非法回 422 invalid_workflow_step
                workflow:
                  type: object
                  additionalProperties: true
                  description: 八步狀態快照（開放式 payload，深合併；鍵集合見 lld.md）
                expected_revision:
                  type: integer
                  minimum: 0
                  description: 樂觀鎖版本；省略則不做版本檢查
                replay_pending:
                  type: boolean
                  description: 重播離線暫存時為 true；此時 base_updated_at 必填（main.py:1836-1839）
                base_updated_at:
                  type: string
                  description: replay_pending 時的基準版本時間戳
      responses:
        "200":
          description: 已保存；回最新專案快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectEnvelope" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "409": { $ref: "#/components/responses/RevisionConflict" }
        "413":
          description: workflow JSON 快照超過 2MB（code `workflow_too_large`，main.py:1859-1866）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/projects/{project_id}/floorplan:
    post:
      tags: [projects, floorplan]
      summary: 上傳平面圖（multipart；main.py:1870）
      operationId: saveProjectFloorplan
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 只支援 .dxf/.png/.jpg/.jpeg；其他副檔名回 415 unsupported_floorplan_type
                expected_revision:
                  type: integer
                  description: 樂觀鎖版本（可省略）
      responses:
        "201":
          description: 已保存
          content:
            application/json:
              schema:
                type: object
                required: [project, upload]
                properties:
                  project: { $ref: "#/components/schemas/Project" }
                  upload: { $ref: "#/components/schemas/FloorplanUpload" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "409": { $ref: "#/components/responses/RevisionConflict" }
        "415":
          description: 不支援的副檔名（code `unsupported_floorplan_type`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: 空檔案（`empty_floorplan`）或內容不是可讀圖片（`invalid_floorplan_image`；main.py:1710-1734）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/projects/{project_id}/floorplan/source:
    get:
      tags: [projects, floorplan]
      summary: 下載原始平面圖（main.py:1919）
      operationId: getProjectFloorplanSource
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 原始檔案（image/png、image/jpeg 或 application/dxf）
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "409":
          description: 尚未上傳平面圖（code `floorplan_missing`，main.py:1690-1697）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: 紀錄存在但檔案已遺失（code `floorplan_source_missing`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/projects/{project_id}/renders:
    post:
      tags: [projects, renders]
      summary: 保存 3D 場景截圖 PNG（第 7 步鎖定視角；FR-009，main.py:1937）
      operationId: createProjectRender
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, expected_revision]
              properties:
                file: { type: string, format: binary, description: PNG（magic bytes 驗證，≤20MB） }
                expected_revision: { type: integer, minimum: 0 }
                white_model_version: { type: integer, minimum: 0, default: 0 }
                viewpoint_version: { type: integer, minimum: 0, default: 0 }
                style_version: { type: integer, minimum: 0, default: 0 }
                style_card_id: { type: string, default: unassigned }
                provider:
                  type: string
                  default: browser_capture
                  description: 目前只接受 browser_capture，其他值回 422 unsupported_render_provider
      responses:
        "201":
          description: 已保存
          content:
            application/json:
              schema:
                type: object
                required: [project, render]
                properties:
                  project: { $ref: "#/components/schemas/Project" }
                  render: { $ref: "#/components/schemas/RenderRecord" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "409": { $ref: "#/components/responses/RevisionConflict" }
        "413":
          description: PNG 超過 20MB（code `render_too_large`，main.py:1959-1963）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "415":
          description: 非 PNG（code `invalid_render_png`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [projects, renders]
      summary: 列出專案 renders（main.py:2000）
      operationId: listProjectRenders
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: render 清單
          content:
            application/json:
              schema:
                type: object
                required: [renders]
                properties:
                  renders:
                    type: array
                    items: { $ref: "#/components/schemas/RenderRecord" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
  /api/projects/{project_id}/renders/{render_id}/png:
    get:
      tags: [projects, renders]
      summary: 下載 render PNG（main.py:2011）
      operationId: downloadProjectRender
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: render_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PNG 檔案
          content:
            image/png:
              schema: { type: string, format: binary }
        "404":
          description: 紀錄不存在（code `render_not_found`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: 紀錄存在但檔案遺失（code `render_file_missing`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ==========================================================================
  # 5.3 平面圖辨識（產出 layout_json）
  # ==========================================================================
  /api/projects/{project_id}/floorplan/analyze:
    post:
      tags: [floorplan]
      summary: 專案版平面圖辨識（無 request body；main.py:2981）
      description: |
        讀取已上傳的平面圖：DXF 走 `parse_floorplan_with_engine`、PNG/JPG 走 Cody 影像辨識。
        成功後重置下游 workflow 段（calibration 之後全部標 stale）並回 `analysis`＋`layout_json`（ACPT-002）。
        floorplan 未確認回 409 `floorplan_confirmation_required`。
      operationId: analyzeProjectFloorplan
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 辨識結果
          content:
            application/json:
              schema:
                type: object
                required: [analysis, layout_json, geometry_engine]
                properties:
                  analysis:
                    type: object
                    additionalProperties: true
                    description: 完整辨識報告（開放式 payload；含 recognition_engine、floorplan、信心度等）
                  layout_json: { $ref: "#/components/schemas/LayoutJson" }
                  geometry_engine: { type: string, enum: [dxf, cody] }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "409":
          description: floorplan 未確認（`floorplan_confirmation_required`，main.py:2985-2993）或尚未上傳（`floorplan_missing`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: 原始平面圖檔案已遺失（code `floorplan_source_missing`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: 解析失敗（`dxf_parse_failed` 或 `cody_recognition_failed`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/floorplan/analyze:
    post:
      tags: [floorplan]
      summary: 無狀態平面圖辨識（multipart；FR-002，main.py:4106-4146）
      description: PNG/JPG → 尺度、幾何、房間與初步機電需求；不確定時不得進設計（handler docstring）。
      operationId: analyzeFloorplan
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 只支援 .png/.jpg/.jpeg；DXF 走專案版端點 }
                calibration_json: { type: string, description: 兩點標定結果 JSON 字串（FR-003）；解析失敗回 422 invalid_calibration_json }
                ocr_json: { type: string, description: OCR 觀察 JSON 字串（陣列） }
                geometry_json: { type: string, description: 人工幾何觀察 JSON 字串（陣列）；有值時 geometry_engine=manual }
                observed_utilities_json: { type: string, description: 機電觀察 JSON 字串（陣列） }
                brief_json: { type: string, description: 需求 brief JSON 字串（物件） }
      responses:
        "200":
          description: 辨識結果＋房間需求推論
          content:
            application/json:
              schema:
                type: object
                required: [analysis, layout_json, requirements, geometry_engine, ocr_provider]
                properties:
                  analysis: { type: object, additionalProperties: true, description: 完整辨識報告（開放式 payload） }
                  layout_json: { $ref: "#/components/schemas/LayoutJson" }
                  requirements:
                    type: object
                    additionalProperties: true
                    description: infer_room_requirements 輸出（家具引擎輸入契約 schema 1.0，見 docs/contracts/FURNITURE_ENGINE_ROOM_REQUIREMENTS_CONTRACT.md）
                  geometry_engine: { type: string, enum: [cody, manual] }
                  ocr_provider: { type: string }
        "415":
          description: 非 PNG/JPG（detail 字串 `floorplan_image_required`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/floorplan/confirm:
    post:
      tags: [floorplan]
      summary: 套用人工確認／修正，輸出鎖定 layout_json（FR-004，main.py:4149-4159）
      operationId: confirmFloorplan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [analysis]
              properties:
                analysis: { type: object, additionalProperties: true, description: analyze 端點回傳的 analysis；缺少回 422 analysis_required }
                corrections: { type: object, additionalProperties: true, description: 人工修正（開放式 payload） }
      responses:
        "200":
          description: 確認後契約（含 floorplan 與 layout_json；欄位細節由 confirm_floorplan_analysis 決定，見 api_spec §5.3）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: 開放式 payload；供既有 3D 與家具引擎使用（ACPT-004 結構鎖定入口）
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/floorplan/sample/630:
    get:
      tags: [floorplan]
      summary: 範例平面圖 PNG（main.py:3072）
      operationId: floorplanSample630
      responses:
        "200":
          description: builder_plan_630.png
          content:
            image/png:
              schema: { type: string, format: binary }
        "404":
          description: 範例檔不存在（detail 字串 `sample_floorplan_not_found`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/plans:
    get:
      tags: [floorplan]
      summary: 舊 3D 路徑：列出 DXF 平面檔（main.py:4055）
      operationId: listPlans
      responses:
        "200":
          description: 檔名清單
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans: { type: array, items: { type: string } }
  /api/plan:
    get:
      tags: [floorplan]
      summary: 舊 3D 路徑：解析 DXF（公尺制例外，api_spec §1；main.py:4060-4073）
      operationId: parsePlan
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
          description: 檔名（basename 化防路徑跳脫）
        - name: scale_m
          in: query
          schema: { type: number, exclusiveMinimum: 0, maximum: 500 }
          description: 公尺制縮放（NFR-001 公分制鐵律的既載例外）
        - name: thickness
          in: query
          schema: { type: number, exclusiveMinimum: 0, maximum: 2, default: 0.18 }
          description: 牆厚（公尺）
        - name: height
          in: query
          schema: { type: number, exclusiveMinimum: 0, maximum: 10, default: 2.7 }
          description: 牆高（公尺）
      responses:
        "200":
          description: 解析結果（開放式 payload，frontend3d 原型專用）
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404":
          description: 檔案不存在（detail 字串）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/upload:
    post:
      tags: [floorplan]
      summary: 舊 3D 路徑：上傳並解析 DXF（公尺制例外；main.py:4076-4087）
      operationId: uploadPlan
      parameters:
        - name: scale_m
          in: query
          schema: { type: number, exclusiveMinimum: 0, maximum: 500 }
        - name: thickness
          in: query
          schema: { type: number, exclusiveMinimum: 0, maximum: 2, default: 0.18 }
        - name: height
          in: query
          schema: { type: number, exclusiveMinimum: 0, maximum: 10, default: 2.7 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: 解析結果（開放式 payload）
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ==========================================================================
  # 5.4 場景與家具引擎（scene_json）
  # ==========================================================================
  /api/scene/generate:
    post:
      tags: [scene]
      summary: 產生設計方案 scene_json（FR-006，main.py:3591-3644）
      description: |
        `layout_json` 為 canonical 空間輸入；`placement_variant` A/B 各自生成白模擺設
        （B 反轉錨點嘗試順序，scene_service.py:2539-2545；ACPT-006）。
        回應為 legacy 頂層 payload ＋ `scene_json`（deepcopy）；前端讀 `response.scene_json || response`。
      operationId: generateScene
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SceneGenerateRequest" }
      responses:
        "200":
          description: 設計方案（頂層即 SceneJson 欄位，另附 scene_json 副本）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SceneJson"
                  - type: object
                    required: [scene_json]
                    properties:
                      scene_json: { $ref: "#/components/schemas/SceneJson" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/scene/layout:
    post:
      tags: [scene]
      summary: 引擎重排全場座標／validate_only 只驗不排（FR-007，main.py:3647-3709）
      description: |
        `placement_room_id` 指定單房重排；標了別房 id 的物件原樣通過不進重排。
        `validate_only=true` 時每件座標照舊、絕不重排，只回報合法與否（ACPT-008、SCN-005）。
        幾何合法性只由 backend/engine 裁決（NFR-004）。
      operationId: sceneLayout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scene_objects:
                  type: array
                  items: { $ref: "#/components/schemas/SceneObject" }
                  description: 現有物件；position_locked=true 且位置仍合法者不重排
                floorplan: { $ref: "#/components/schemas/LayoutJson" }
                floorplan_editor:
                  type: object
                  additionalProperties: true
                  description: 前端編輯器格式平面圖（有值時優先於 floorplan；floorplan_from_editor_payload 轉換）
                placement_room_id: { type: string, description: 單房重排目標房 id；省略為整屋（所有房聯集邊界） }
                placement_variant: { type: string, enum: [A, B], default: A }
                validate_only: { type: boolean, default: false }
      responses:
        "200":
          description: 重排（或驗證）結果
          content:
            application/json:
              schema:
                type: object
                required: [floorplan, scene_objects]
                properties:
                  floorplan: { $ref: "#/components/schemas/LayoutJson" }
                  scene_objects:
                    type: array
                    items: { $ref: "#/components/schemas/SceneObject" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/scene/decorate:
    post:
      tags: [scene]
      summary: 依風格加軟裝（座標仍由引擎決定；FR-008，main.py:3799-3995）
      description: |
        依房型與錨點家具推導 rug/plant/light/curtain 角色並補件；`dismissed_roles`
        內的角色不再自動補回。放不下的軟裝不硬塞（unavailable 回報於 decor_summary）。
      operationId: sceneDecorate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scene_objects:
                  type: array
                  items: { $ref: "#/components/schemas/SceneObject" }
                floorplan: { $ref: "#/components/schemas/LayoutJson" }
                floorplan_editor: { type: object, additionalProperties: true }
                placement_room_id: { type: string }
                room: { type: object, additionalProperties: true, description: 已確認房間資訊（room_type 推導備援） }
                style: { type: string, description: style_id，軟裝選件風格偏好 }
                dismissed_roles:
                  type: array
                  items: { type: string, enum: [rug, plant, light, curtain] }
                  description: 使用者刪過、不得自動復活的軟裝角色（main.py:3895-3905）
      responses:
        "200":
          description: 補軟裝後場景
          content:
            application/json:
              schema:
                type: object
                required: [scene_objects, decor_summary]
                properties:
                  scene_objects:
                    type: array
                    items: { $ref: "#/components/schemas/SceneObject" }
                  decor_summary:
                    type: object
                    properties:
                      requested: { type: array, items: { type: string } }
                      placed: { type: array, items: { type: string } }
                      unavailable: { type: array, items: { type: string }, description: 型錄無可用 GLB 的角色（內部 409 decor_model_missing 轉列於此，不外拋） }
                      engine: { type: string, const: furniture_engine }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/scene/validate:
    post:
      tags: [scene]
      summary: 第 6 步拖曳落點單件合法性驗證（FR-007，main.py:3998-4009）
      description: 引擎檢查單件家具在指定位置/角度是否合法；門前 75cm 淨空、窗前採光帶、房外皆拒絕並分流訊息（ACPT-007、SCN-004）。
      operationId: sceneValidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item]
              properties:
                floorplan: { $ref: "#/components/schemas/LayoutJson" }
                floorplan_editor: { type: object, additionalProperties: true }
                item: { $ref: "#/components/schemas/SceneObject" }
                others:
                  type: array
                  items: { $ref: "#/components/schemas/SceneObject" }
                  description: 場上其他家具（碰撞對象）
      responses:
        "200":
          description: 驗證結果（validate_single_placement 輸出；含合法與否與拒絕原因分流。欄位細節待確認）
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/scene/bootstrap:
    get:
      tags: [scene, catalog]
      summary: 場景初始化資料包（styles/色卡/surface catalog；main.py:3185）
      operationId: sceneBootstrap
      responses:
        "200":
          description: 初始化資料
          content:
            application/json:
              schema:
                type: object
                required: [styles, taiwan_style_cards, surface_catalog, catalog_status]
                properties:
                  styles: { type: array, items: { type: object, additionalProperties: true } }
                  taiwan_style_cards:
                    type: array
                    items: { type: object, additionalProperties: true }
                    description: 6 風格 × 3 色卡共 18 張（taiwan_style_cards.json）
                  surface_catalog: { type: object, additionalProperties: true }
                  catalog_status: { $ref: "#/components/schemas/CatalogStatus" }
  /api/scene/provider-status:
    get:
      tags: [scene]
      summary: OpenRouter 供應商狀態（main.py:3331）
      operationId: sceneProviderStatus
      responses:
        "200":
          description: get_openrouter_status 輸出（開放式 payload；不外洩 token）
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  # ==========================================================================
  # 5.5 Agent（intake／選件／並存管線）
  # ==========================================================================
  /api/agent/intake/start:
    post:
      tags: [agent]
      summary: 啟動需求訪談（伺服器無狀態；FR-005，main.py:3336）
      operationId: agentIntakeStart
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id: { type: string, default: roompilot-local }
      responses:
        "200":
          description: 首個訪談回合（含空白 client_brief schema 1.1）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntakeTurn" }
  /api/agent/intake/answer:
    post:
      tags: [agent]
      summary: 推進一個訪談回合（brief 原樣帶回再合併；main.py:3343-3355）
      operationId: agentIntakeAnswer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step, answer]
              properties:
                session_id: { type: string, default: roompilot-local }
                step: { type: string, description: 目前訪談步驟 key }
                answer: { type: string, minLength: 1 }
                client_brief: { $ref: "#/components/schemas/ClientBrief" }
      responses:
        "200":
          description: 下一回合（step=null 且 ready_for_confirmation=true 表訪談完成；ACPT-005）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntakeTurn" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/agent/furniture/select:
    post:
      tags: [agent]
      summary: 伺服器端選件閘門（offers 白名單、count 1–6；main.py:3440-3501）
      description: |
        `llm_selection` 有值時先驗 LLM 選擇，未通過規則驗證即降級本地規則並附 warning；
        本地規則也失敗時回 `local_rules_unvalidated`（每房保留前 8 件候選）。
      operationId: agentFurnitureSelect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rooms]
              properties:
                rooms:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                    properties:
                      room_id: { type: string }
                      room_type: { type: string }
                offers:
                  type: object
                  additionalProperties:
                    type: array
                    items: { type: object, additionalProperties: true }
                  description: room_id → 候選家具白名單（每件須有 furniture_id 與 normalized_type/type）
                style_id: { type: string }
                context: { type: object, additionalProperties: true }
                llm_selection: { type: object, additionalProperties: true, description: 前端代呼叫 LLM 的選件結果（可省略） }
      responses:
        "200":
          description: 選件結果
          content:
            application/json:
              schema:
                type: object
                required: [source, warnings, rooms]
                properties:
                  source: { type: string, enum: [openrouter, local_rules, local_rules_unvalidated] }
                  model: { type: [string, "null"] }
                  warnings: { type: array, items: { type: string } }
                  rooms:
                    type: array
                    items:
                      type: object
                      properties:
                        room_id: { type: string }
                        items:
                          type: array
                          items:
                            type: object
                            additionalProperties: true
                            properties:
                              furniture_id: { type: string }
                              count: { type: integer, minimum: 1, maximum: 6 }
                              selection_source: { type: string }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/agent/pipeline/status:
    get:
      tags: [agent]
      summary: 並存管線開關與 gateway 狀態（永遠可查；ACPT-015，main.py:3504）
      operationId: agentPipelineStatus
      responses:
        "200":
          description: pipeline_status 輸出（開放式 payload，含 enabled flag）
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/agent/pipeline/{project_id}/start:
    post:
      tags: [agent]
      summary: 啟動並存管線（需 ROOMPILOT_AGENT_PIPELINE=1；FR-015，main.py:3518-3534）
      operationId: agentPipelineStart
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [layout_json]
              properties:
                layout_json: { $ref: "#/components/schemas/LayoutJson" }
                rules_json: { type: object, additionalProperties: true, description: 擺位規則（可省略） }
      responses:
        "200":
          description: 管線狀態（HITL 暫停點；開放式 payload）
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/PipelineDisabled" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/agent/pipeline/{project_id}/submit:
    post:
      tags: [agent]
      summary: 在目前 HITL 決策點提交輸入並推進（main.py:3537-3546）
      operationId: agentPipelineSubmit
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: 各決策點期望輸入不同（問卷→A/B 擺放＋驗證→…）；開放式 payload
      responses:
        "200":
          description: 推進後管線狀態（開放式 payload）
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/PipelineDisabled" }
        "409":
          description: 管線尚未 start（PipelineNotStarted，detail 字串）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/agent/pipeline/{project_id}/undo:
    post:
      tags: [agent]
      summary: 回復上一次 submit 之前的完整狀態（main.py:3549-3556）
      operationId: agentPipelineUndo
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 回復後管線狀態（開放式 payload）
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/PipelineDisabled" }
        "409":
          description: 管線尚未 start（detail 字串）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/agent/pipeline/{project_id}:
    get:
      tags: [agent]
      summary: 查詢管線目前暫停點、期望輸入與最近階段產物（main.py:3559-3566）
      operationId: agentPipelineGet
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 管線狀態（開放式 payload）
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404":
          description: 管線未啟用（flag 未設）或此專案尚未 start（兩者皆 404，detail 字串）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/agent/pipeline/reconcile:
    post:
      tags: [agent]
      summary: step6 擺放 vs 管線擺放對帳（SCN-010，main.py:3569-3588）
      operationId: agentPipelineReconcile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [width_cm, depth_cm, items]
              properties:
                room_id: { type: string, default: room }
                width_cm: { type: number, description: 房寬（公分，NFR-001） }
                depth_cm: { type: number, description: 房深（公分） }
                items:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/SceneObject" }
                  description: step6 選定家具清單（server 物件格式）
      responses:
        "200":
          description: 覆蓋率＋合法性對帳報告（reconcile_room 輸出，開放式 payload）
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/PipelineDisabled" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ==========================================================================
  # 5.6 第 7/8 步生圖與交付
  # ==========================================================================
  /api/ai-render/status:
    get:
      tags: [renders]
      summary: AI 生圖服務（OpenRouter nano banana）可用性；不外洩 token（main.py:2064）
      operationId: aiRenderStatus
      responses:
        "200":
          description: ai_render_status 輸出（開放式 payload）
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/render-provider/status:
    get:
      tags: [renders]
      summary: 遠端渲染商可用性（main.py:2028）
      operationId: renderProviderStatus
      responses:
        "200":
          description: render_provider_status 輸出（開放式 payload）
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/projects/{project_id}/render-jobs:
    post:
      tags: [renders]
      summary: 泛用遠端渲染 job（202；契約見 docs/contracts/REMOTE_Render_CONTRACT.md 的正名 REMOTE_RENDER_CONTRACT.md；main.py:2033-2057）
      operationId: createProjectRenderJobs
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              additionalProperties: true
              properties:
                project_id: { type: string, description: 必須與路徑一致，否則 422 render_project_mismatch }
      responses:
        "202":
          description: 已受理（submit_render_jobs 輸出，開放式 payload）
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502":
          description: 遠端渲染服務拒絕任務（RenderProviderRejected；code 為例外字串）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: 遠端渲染服務未設定或無法連線（RenderProviderUnavailable）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/projects/{project_id}/ai-renders:
    post:
      tags: [renders]
      summary: 逐房寫實生圖（第 7 步鎖定視角截圖為 img2img 參考；FR-011，main.py:2070-2132）
      description: |
        伺服器補充需求/材質/家電/色卡資訊、逐房呼叫 Gen_Pic Agent；家電資訊只來自
        `scene_json.render_context.appliance_requirements`（ADR-004）。每房鎖定清單存進
        workflow 供整批一次改圖；成功後每房 edit_used 歸零、edit_remaining=1（ACPT-010 前置）。
      operationId: createProjectAiRenders
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scene, rooms]
              properties:
                project_id: { type: string, description: 可省略；有值須與路徑一致 }
                scene:
                  $ref: "#/components/schemas/SceneJson"
                  description: state.sceneData；必須含非空 scene_objects
                rooms:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: true
                    required: [room_id, reference_png_data_url]
                    properties:
                      room_id: { type: string }
                      reference_png_data_url: { type: string, description: "第 7 步鎖定視角 3D 截圖（data:image/* data URL）" }
      responses:
        "201":
          description: 逐房生圖結果
          content:
            application/json:
              schema:
                type: object
                required: [results, edit_remaining, revision, updated_at]
                properties:
                  results:
                    type: array
                    items: { type: object, additionalProperties: true }
                    description: 每房生成結果（含影像 data URL 與狀態；欄位由 Gen_Pic Agent 決定）
                  edit_remaining: { type: integer, const: 1 }
                  revision: { type: integer }
                  updated_at: { type: string }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/AiRenderNotConfigured" }
  /api/projects/{project_id}/palette-renders:
    post:
      tags: [renders]
      summary: 第 7 步代表房色卡比較圖；每專案僅一次（FR-010，main.py:2135-2221）
      description: |
        同一代表房 × 多張色卡一次併發生成。已生成過回 409 `palette_already_generated`（ACPT-009）；
        全部失敗則不鎖定、允許重試（回應 revision/updated_at 缺席）。base64 不入 workflow。
      operationId: createProjectPaletteRenders
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scene, room, style_card_ids]
              properties:
                project_id: { type: string }
                scene: { $ref: "#/components/schemas/SceneJson" }
                room:
                  type: object
                  additionalProperties: true
                  required: [room_id, reference_png_data_url]
                  properties:
                    room_id: { type: string }
                    reference_png_data_url: { type: string }
                style_card_ids:
                  type: array
                  minItems: 1
                  items: { type: string }
      responses:
        "201":
          description: 色卡比較結果（任一成功即鎖定 generated 旗標）
          content:
            application/json:
              schema:
                type: object
                required: [results, already_generated, room_id]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        style_card_id: { type: string }
                        status: { type: string, description: completed／failed 等 }
                  already_generated: { type: boolean, const: false }
                  room_id: { type: string }
                  revision: { type: integer, description: 全部失敗時缺席 }
                  updated_at: { type: string, description: 全部失敗時缺席 }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "409":
          description: 已生成過（code `palette_already_generated`，ACPT-009）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/AiRenderNotConfigured" }
  /api/projects/{project_id}/ai-renders/{room_id}/edit:
    post:
      tags: [renders]
      summary: 整批一次改圖；每房一次額度（FR-011，main.py:2224-2287）
      description: 只改使用者指定內容、其餘依 lock_manifest 鎖定不動；該房額度用完回 409（ACPT-010）。
      operationId: editProjectAiRender
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: room_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedback, image_data_url]
              properties:
                feedback: { type: string, minLength: 1, description: 想修改的內容描述 }
                image_data_url: { type: string, description: "要修改的原圖（data:image/* data URL）" }
      responses:
        "201":
          description: 改圖結果
          content:
            application/json:
              schema:
                type: object
                required: [result, edit_remaining, revision, updated_at]
                properties:
                  result: { type: object, additionalProperties: true }
                  edit_remaining: { type: integer, const: 0 }
                  revision: { type: integer }
                  updated_at: { type: string }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "409":
          description: 該房尚未生圖（`room_not_generated`）或額度用完（`ai_edit_budget_exhausted`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502":
          description: 改圖失敗（code `ai_edit_failed`，GenPicFailure notices 併入 message）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503": { $ref: "#/components/responses/AiRenderNotConfigured" }
  /api/delivery-proposal/status:
    get:
      tags: [renders]
      summary: 交付提案排版引擎（Playwright Chromium）可用性；未安裝回報安裝指引（main.py:2378）
      operationId: deliveryProposalStatus
      responses:
        "200":
          description: delivery_proposal_status 輸出（開放式 payload）
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/projects/{project_id}/delivery-proposal:
    post:
      tags: [renders]
      summary: 產出正式交付提案 PDF（FR-012，main.py:2384-2418）
      description: 缺 Playwright Chromium 回 503 `delivery_engine_not_configured` 並附安裝指引，不產出殘缺 PDF（ACPT-011）。
      operationId: createProjectDeliveryProposal
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportPayload" }
      responses:
        "201":
          description: 已產出
          content:
            application/json:
              schema:
                type: object
                required: [proposal, revision, updated_at]
                properties:
                  proposal:
                    type: object
                    additionalProperties: true
                    properties:
                      download_url: { type: string, description: /api/projects/{project_id}/delivery-proposal/pdf }
                  revision: { type: integer }
                  updated_at: { type: string }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502":
          description: 排版失敗（code `delivery_proposal_failed`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: 缺 Playwright Chromium（code `delivery_engine_not_configured`，ACPT-011）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/projects/{project_id}/delivery-proposal/pdf:
    get:
      tags: [renders]
      summary: 下載交付提案 PDF（main.py:2421-2437）
      operationId: downloadProjectDeliveryProposal
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: PDF 檔案
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404":
          description: 尚未產出（code `delivery_proposal_not_found`）或專案不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: 紀錄存在但檔案遺失（code `delivery_proposal_file_missing`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/projects/{project_id}/design-manual:
    post:
      tags: [renders]
      summary: 八章設計手冊 PDF（非正式版，UI 不觸發；main.py:2300-2331）
      description: LLM 只潤飾前言與設計理念；未設 OPENROUTER_API_KEY 走 deterministic 底稿照樣輸出。重新產出覆蓋 workflow 紀錄並提高 revision。
      operationId: createProjectDesignManual
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportPayload" }
      responses:
        "201":
          description: 已產出
          content:
            application/json:
              schema:
                type: object
                required: [manual, revision, updated_at]
                properties:
                  manual:
                    type: object
                    additionalProperties: true
                    properties:
                      download_url: { type: string, description: /api/projects/{project_id}/design-manual/pdf }
                  revision: { type: integer }
                  updated_at: { type: string }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502":
          description: 產出失敗（code `design_manual_failed`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/projects/{project_id}/design-manual/pdf:
    get:
      tags: [renders]
      summary: 下載設計手冊 PDF（main.py:2334-2350）
      operationId: downloadProjectDesignManual
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: PDF 檔案
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404":
          description: 尚未產出（code `design_manual_not_found`）或專案不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: 紀錄存在但檔案遺失（code `design_manual_file_missing`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/projects/{project_id}/design-delivery:
    post:
      tags: [renders]
      summary: 第 8 步成果包五章 JSON（schema 1.1；FR-012，main.py:2947-2964）
      description: 打包全屋簡報、逐房成果、工程報告、資安審核與預算書，並併入 delivery-proposal 產出紀錄與下載位置。
      operationId: createProjectDesignDelivery
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                project_id: { type: string, description: 有值須與路徑一致，否則 422 delivery_project_mismatch }
                generated_at: { type: string, description: 可省略；預設伺服器 UTC 時間 }
              description: 其餘欄位為保存快照組稿輸入（開放式 payload；報告組稿不重新產生座標）
      responses:
        "200":
          description: 成果包
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesignDeliveryPackage" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/cost/estimate:
    post:
      tags: [renders]
      summary: 台灣公開行情工程概算（schema 1.0；FR-012，main.py:4162-4171）
      description: 以版控內已人工核對的行情種子（taiwan_renovation_price_seed.json）計算低/基準/高區間；缺數量證據或費率時保留待詢價。
      operationId: costEstimate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/CostWorkItem" }
      responses:
        "200":
          description: 概算結果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostEstimate" }
        "422":
          description: items 缺失（`cost_items_required`）或數量/證據不合法（`cost_quantity_evidence_required`、`cost_quantity_invalid` 等，detail 字串）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ==========================================================================
  # 5.7 型錄／問卷／站台
  # ==========================================================================
  /api/furniture:
    get:
      tags: [catalog]
      summary: 家具型錄查詢（PostgreSQL view 優先；FR-013、NFR-003，main.py:3229-3279）
      operationId: listFurniture
      parameters:
        - name: style
          in: query
          schema: { type: string }
        - name: group
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string }
          description: 家具型別（handler 參數名 item_type，alias type）
        - name: q
          in: query
          schema: { type: string }
          description: 關鍵字搜尋
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 80, default: 24 }
        - name: has_model
          in: query
          schema: { type: boolean }
        - name: detail
          in: query
          schema: { type: string, enum: [card, scene], default: card }
          description: card 回卡片欄位；scene 回完整 item
        - name: color
          in: query
          schema: { type: string }
        - name: material
          in: query
          schema: { type: string }
        - name: size
          in: query
          schema: { type: string }
      responses:
        "200":
          description: 分頁結果＋過濾選項
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FurnitureCatalogResponse" }
  /api/furniture/{furniture_id}/model:
    get:
      tags: [catalog]
      summary: 家具 GLB：CloudFront 307 redirect（main.py:4012-4018）
      operationId: furnitureModel
      parameters:
        - $ref: "#/components/parameters/FurnitureId"
      responses:
        "307":
          description: 轉導至 CloudFront model_url（REQ-013）
          headers:
            Location: { schema: { type: string } }
        "200":
          description: 無外部 URL 時回本機 model 回應（_model_response_for_merged_furniture；形狀待確認）
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          description: 家具不存在
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/furniture/{furniture_id}/model.gltf:
    get:
      tags: [catalog]
      summary: 本機 glTF 拆解（CloudFront 模式回 410；main.py:4021-4027）
      operationId: furnitureModelGltf
      parameters:
        - $ref: "#/components/parameters/FurnitureId"
      responses:
        "200":
          description: glTF JSON（僅本機離線模式）
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "410":
          description: CloudFront 模式不提供本機拆解端點（detail 字串）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/furniture/{furniture_id}/buffer.bin:
    get:
      tags: [catalog]
      summary: 本機 GLB buffer（CloudFront 模式回 410；main.py:4030-4037）
      operationId: furnitureModelBuffer
      parameters:
        - $ref: "#/components/parameters/FurnitureId"
      responses:
        "200":
          description: 二進位 buffer
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "410":
          description: CloudFront 模式不提供（detail 字串）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/furniture/{furniture_id}/images/{image_index}:
    get:
      tags: [catalog]
      summary: GLB 內嵌圖片（CloudFront 模式回 410；main.py:4040-4047）
      operationId: furnitureModelImage
      parameters:
        - $ref: "#/components/parameters/FurnitureId"
        - name: image_index
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: 圖片位元組（media type 依 GLB 內容）
          content:
            image/*:
              schema: { type: string, format: binary }
        "410":
          description: CloudFront 模式不提供（detail 字串）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/furniture/{name}:
    get:
      tags: [catalog]
      summary: 家具詳情（非 .glb 名）或範例 GLB 檔（.glb 名；main.py:4190-4199）
      description: |
        name 以 .glb 結尾 → 回本機範例 GLB（CloudFront 模式 410；不存在 404）；
        否則視為 furniture_id 回卡片詳情 payload（含 merged_furniture_ids 等合併欄位）。
      operationId: furnitureDetailOrSample
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 詳情 JSON 或 model/gltf-binary 檔案
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FurnitureCard" }
            model/gltf-binary:
              schema: { type: string, format: binary }
        "404":
          description: 檔案不存在（detail 字串）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: CloudFront 模式不提供本機範例 GLB（detail 字串）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/sample-furniture:
    get:
      tags: [catalog]
      summary: 本機範例 GLB 清單（CloudFront 模式回空清單＋導引；main.py:4174-4187）
      operationId: sampleFurniture
      responses:
        "200":
          description: 檔名清單
          content:
            application/json:
              schema:
                type: object
                properties:
                  furniture: { type: array, items: { type: string } }
                  provider: { type: string, description: CloudFront 模式時為 aws_cloudfront }
                  message: { type: string }
  /api/catalog/status:
    get:
      tags: [catalog]
      summary: 型錄 provider 狀態（ACPT-012 可見失敗；main.py:3144）
      operationId: catalogStatus
      responses:
        "200":
          description: provider 狀態
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogStatus" }
  /api/site-data:
    get:
      tags: [catalog]
      summary: 站台資料（furniture 清單改由 /api/furniture 分頁提供；main.py:3083-3092）
      operationId: siteData
      responses:
        "200":
          description: build_site_payload 輸出（開放式 payload；furniture 與 featured_models 固定為空陣列）
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/home-data:
    get:
      tags: [catalog]
      summary: 首頁資料（main.py:3149-3164）
      operationId: homeData
      responses:
        "200":
          description: 首頁摘要
