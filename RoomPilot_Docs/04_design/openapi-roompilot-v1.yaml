  /api/questionnaire/visual-images/{image_id}:
    get:
      tags: [catalog]
      summary: 問卷視覺題庫圖片（main.py:3218-3226）
      operationId: questionnaireVisualImage
      parameters:
        - name: image_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 圖片 payload（開放式 payload）
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404":
          description: 圖片不存在（detail 字串 `questionnaire_image_not_found`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ==========================================================================
  # RAG（rag_api.py；只回排序，不決定幾何 — NFR-004）
  # ==========================================================================
  /api/rag/status:
    get:
      tags: [rag]
      summary: RAG 服務狀態與 blockers（rag_api.py:164）
      operationId: ragStatus
      responses:
        "200":
          description: FurnitureRagService.status 輸出（開放式 payload）
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/rag/search:
    post:
      tags: [rag]
      summary: 同步 RAG 檢索（rag_api.py:169-175）
      operationId: ragSearch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RagSearchRequest" }
      responses:
        "200":
          description: 檢索結果（開放式 payload；只回排序）
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "502":
          description: 上游解析服務失敗（RagUpstreamError；detail.retryable=true）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: RAG 未啟用／依賴未就緒／PostgreSQL 向量不可用（RagDisabledError／RagDependencyError／RagDatabaseError；detail.retryable=true）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/rag/search/jobs:
    post:
      tags: [rag]
      summary: 建立非同步 RAG 檢索 job（202；rag_api.py:178-208）
      operationId: createRagSearchJob
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RagSearchRequest" }
      responses:
        "202":
          description: 已排入佇列（初始 snapshot，status=queued）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RagJobSnapshot" }
        "429":
          description: 佇列滿載（code `rag_job_capacity_reached`，上限 24 個 active job）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/rag/search/jobs/{job_id}:
    get:
      tags: [rag]
      summary: 查詢 RAG job 進度（TTL 1 小時；rag_api.py:211-221）
      operationId: getRagSearchJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: job 快照（completed 時含 result、failed 時含 error）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RagJobSnapshot" }
        "404":
          description: job 不存在或已過期（code `rag_job_not_found`）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: { type: string }
      description: 專案 id（uuid4 hex，project_store.py:166）
    FurnitureId:
      name: furniture_id
      in: path
      required: true
      schema: { type: string }
      description: 型錄家具 id（合併後主 id）

  responses:
    HtmlPage:
      description: 靜態 HTML 頁面
      content:
        text/html:
          schema: { type: string }
    ProjectNotFound:
      description: 專案不存在（code `project_not_found`，main.py:1672-1682）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RevisionConflict:
      description: revision 落後（code `project_revision_conflict`，detail 附最新 project；NFR-002、ACPT-014）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationError:
      description: 欄位驗證失敗（detail 為字串或 {code, message, ...} 物件；api_spec §3）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    PipelineDisabled:
      description: Agent 管線未啟用（未設 ROOMPILOT_AGENT_PIPELINE=1；detail 字串，main.py:3510-3515；ACPT-015）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    AiRenderNotConfigured:
      description: 未設定 OPENROUTER_API_KEY，生圖服務不可用（api_spec §3）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    # ---- 錯誤 ----
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: 機器可判讀錯誤碼；清單見 api_spec.md §3 }
        message: { type: string, description: 面向使用者的繁中訊息 }
        focus: { type: string, description: 前端聚焦欄位提示（部分端點） }
        project: { $ref: "#/components/schemas/Project", description: 409 project_revision_conflict 時附最新專案 }
        rooms: { type: array, items: { type: object, additionalProperties: true }, description: 422 recognition_review_unresolved 時附未確認房間 }
        retryable: { type: boolean, description: RAG 錯誤附註（502/503 為 true） }
      additionalProperties: true
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          oneOf:
            - type: string
              description: 舊路徑錯誤（純字串 code 或訊息）
            - $ref: "#/components/schemas/ErrorDetail"
      description: FastAPI HTTPException 標準包裝；detail 字串／物件兩形狀並存（api_spec §7 待確認第 5 項）

    # ---- 專案保存 ----
    Project:
      type: object
      required: [project_id, name, current_step, workflow, revision, created_at, updated_at]
      properties:
        project_id: { type: string, description: uuid4 hex }
        name: { type: string }
        notes: { type: string }
        current_step: { type: string, description: 八步工作流目前步驟 id }
        workflow:
          type: object
          additionalProperties: true
          description: 八步狀態單一快照（≤2MB，深合併；NFR-002、ADR-007）
        revision: { type: integer, description: 樂觀鎖版本（每次寫入遞增） }
        created_at: { type: string, description: UTC ISO 8601 }
        updated_at: { type: string, description: UTC ISO 8601 }
      description: 專案紀錄（project_store.py:145-155）
    ProjectEnvelope:
      type: object
      required: [project]
      properties:
        project: { $ref: "#/components/schemas/Project" }
    FloorplanUpload:
      type: object
      required: [filename, extension, mime_type, source_url]
      properties:
        filename: { type: string }
        extension: { type: string, enum: [.dxf, .png, .jpg, .jpeg] }
        mime_type: { type: string, enum: [application/dxf, image/png, image/jpeg] }
        source_url: { type: string, description: /api/projects/{project_id}/floorplan/source }
    RenderRecord:
      type: object
      required: [render_id, project_id, download_url]
      properties:
        render_id: { type: string }
        project_id: { type: string }
        download_url: { type: string, description: /api/projects/{project_id}/renders/{render_id}/png }
        white_model_version: { type: integer }
        viewpoint_version: { type: integer }
        style_version: { type: integer }
        style_card_id: { type: string }
        provider: { type: string, const: browser_capture }
      additionalProperties: true
      description: 公開 render 紀錄（save_render 紀錄去除 path 加 download_url，main.py:1929-1934；其餘欄位待確認）

    # ---- 核心契約：layout_json / scene_json ----
    LayoutJson:
      type: object
      description: |
        平面圖辨識邊界產物（ADR-001）：只描述空間本身——牆/門/窗/樑/柱/房間區域/尺度/信心度。
        **禁止**出現家具、材質、相機、風格欄位（LAYOUT_SCENE_BOUNDARY_CONTRACT.md:16-34；ACPT-002）。
        幾何欄位一律公分（NFR-001）。完整欄位集依辨識引擎輸出（開放式）；以下為 scene_json.floorplan
        重建時消費的關鍵欄位（scene_service.py:3019-3042）。
      properties:
        coordinate_unit: { type: string, const: cm }
        width_cm: { type: number }
        depth_cm: { type: number }
        room_height_cm: { type: number, description: 預設 270 }
        source: { type: string, description: dxf／cody／manual }
        wall_segments: { type: array, items: { type: object, additionalProperties: true } }
        door_segments: { type: array, items: { type: object, additionalProperties: true } }
        window_segments: { type: array, items: { type: object, additionalProperties: true } }
        beam_segments: { type: array, items: { type: object, additionalProperties: true } }
        columns: { type: array, items: { type: object, additionalProperties: true } }
        room_regions:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              room_id: { type: string }
              room_type: { type: string }
      additionalProperties: true
    SceneObject:
      type: object
      description: 引擎輸出的單件家具（座標公分、房間中心原點；scene_service.py:2656-2690）
      required: [furniture_id, normalized_type, size_cm, position_cm, rotation_y_deg]
      properties:
        furniture_id: { type: string }
        catalog_furniture_id: { type: string }
        name_zh_raw: { type: string }
        normalized_type: { type: string }
        model_url: { type: string }
        primary_style: { type: string }
        material: { type: string }
        description: { type: string, description: 型錄 VLM 外觀描述（第 8 步生圖提示詞證據） }
        price_twd: { type: [number, "null"] }
        size_cm:
          type: object
          properties:
            width: { type: number }
            depth: { type: number }
            height: { type: number }
        footprint_cm:
          type: object
          properties:
            width: { type: number }
            depth: { type: number }
        position_cm:
          type: object
          required: [x, z]
          properties:
            x: { type: number }
            z: { type: number }
        rotation_y_deg: { type: number, minimum: 0, exclusiveMaximum: 360, description: 出口正規化為 0 ≤ deg < 360 }
        position_locked: { type: boolean, description: 使用者拖曳鎖定；位置仍合法就不重排 }
        placement_failed: { type: boolean }
        placement_reason: { type: [string, "null"] }
        placement_engine: { type: string, enum: [furniture_engine, boundary_rule] }
        placement_room_id: { type: [string, "null"] }
        auto_decor_role: { type: [string, "null"], description: rug／plant／light／curtain }
        auto_decor_room_id: { type: [string, "null"] }
        placement_relation: { type: [object, "null"], additionalProperties: true }
      additionalProperties: true
    SceneJson:
      type: object
      description: |
        設計方案（build_scene_payload 頂層，scene_service.py:2995-3088）。
        家電需求只存在 render_context.appliance_requirements，scene_objects 不含任何家電
        （ADR-004、ACPT-013）。舊資料無 coordinate_unit 視為公尺、讀取時轉換一次（api_spec §6）。
      properties:
        scene_id: { type: string }
        llm_mode: { type: string }
        llm_model: { type: [string, "null"] }
        questionnaire: { type: object, additionalProperties: true }
        requirement:
          type: object
          description: 家具需求契約（schema 1.0）
          properties:
            schema_version: { type: string, const: "1.0" }
            room_type: { type: string }
            style: { type: string }
            prefer_color: { type: array, items: { type: string } }
            requirements: { type: array, items: { type: string } }
            constraints:
              type: object
              properties:
                must_keep: { type: array, items: { type: string } }
                priority_order: { type: array, items: { type: string } }
                preferred_layout_pattern: { type: string }
                style_strictness: { type: string }
                notes: { type: array, items: { type: string } }
        plan_json: { type: object, additionalProperties: true }
        floorplan:
          allOf:
            - $ref: "#/components/schemas/LayoutJson"
          description: coordinate_unit 固定 "cm"（scene_service.py:3020；NFR-001）
        style: { type: object, additionalProperties: true }
        style_card: { type: object, additionalProperties: true, description: 選定色卡（可為空物件） }
        design_choices:
          type: object
          properties:
            style_card_id: { type: [string, "null"] }
            wall_option: { type: string }
            floor_option: { type: string }
            single_room_mode: { type: boolean }
            accurate_dxf_mode: { type: boolean }
        render_context:
          type: object
          properties:
            appliance_requirements:
              type: array
              items: { type: object, additionalProperties: true }
              description: 家電唯一合法去處；只供第 8 步生圖 prompt（ADR-004、REQ-014）
        surface_catalog: { type: object, additionalProperties: true }
        furniture_candidates:
          type: object
          properties:
            schema_version: { type: string, const: "1.0" }
            room_type: { type: string }
            style: { type: string }
            candidates: { type: array, items: { type: object, additionalProperties: true } }
            layout_relations: { type: array, items: { type: object, additionalProperties: true } }
        selected_furniture: { type: array, items: { type: object, additionalProperties: true } }
        scene_objects:
          type: array
          items: { $ref: "#/components/schemas/SceneObject" }
        placement_resolution_report: { type: object, additionalProperties: true }
        placement:
          type: object
          properties:
            engine: { type: string, const: furniture_engine, description: 幾何合法性單一權威（NFR-004、ADR-002） }
            failed:
              type: array
              items:
                type: object
                properties:
                  furniture_id: { type: string }
                  type: { type: string }
                  name: { type: string }
                  reason: { type: string }
            unavailable_types: { type: array, items: { type: string } }
      additionalProperties: true
    SceneGenerateRequest:
      type: object
      description: 產生方案輸入（main.py:3595-3640 組裝）；layout_json 為 canonical 空間輸入
      properties:
        layout_json: { $ref: "#/components/schemas/LayoutJson" }
        client_brief: { $ref: "#/components/schemas/ClientBrief" }
        questionnaire: { type: object, additionalProperties: true, description: 逐房問卷（test2_questionnaire） }
        placement_variant: { type: string, enum: [A, B], default: A, description: 方案 A/B；B 反轉錨點嘗試順序（FR-006、ACPT-006） }
        space_type: { type: string, description: 預設取 client_brief.space.type，再退 living_room }
        style_preference: { type: string }
        style_card_id: { type: [string, "null"] }
        required_furniture: { type: array, items: { type: string } }
        selected_furniture: { type: array, items: { type: object, additionalProperties: true } }
        selected_furniture_exact: { type: boolean }
        custom_furniture: { type: array, items: { type: object, additionalProperties: true } }
        preferred_colors: { type: array, items: { type: string } }
        custom_colors: { type: array, items: { type: string } }
        personal_notes: { type: string }
        keep_window_clear: { type: boolean }
        keep_door_clear: { type: boolean }
        need_storage: { type: boolean }
        prefer_low_saturation: { type: boolean }
        floorplan_filename: { type: [string, "null"] }
        floorplan_dxf_text: { type: [string, "null"] }
        floorplan_editor: { type: object, additionalProperties: true }
        wall_option: { type: string, default: auto }
        floor_option: { type: string, default: auto }
        furniture_random_seed: { type: [integer, "null"] }
        room_width_cm: { type: number, default: 420, description: 無 layout_json 時的手動矩形模式（公分） }
        room_depth_cm: { type: number, default: 360 }
      additionalProperties: true

    # ---- Agent ----
    ClientBrief:
      type: object
      description: 需求訪談 brief（schema 1.1；intake_service.py:56；ACPT-005）
      properties:
        schema_version: { type: string, const: "1.1" }
        created_at: { type: string }
        space:
          type: object
          properties:
            type: { type: [string, "null"] }
            width_cm: { type: number, default: 420 }
            depth_cm: { type: number, default: 360 }
            floorplan_filename: { type: [string, "null"] }
        occupants:
          type: object
          properties:
            adults: { type: integer }
            children: { type: integer }
            elderly: { type: integer }
            pets: { type: integer }
        needs: { type: array, items: { type: string } }
        style:
          type: object
          properties:
            preferred: { type: array, items: { type: string } }
            colors: { type: array, items: { type: string } }
            materials: { type: array, items: { type: string } }
            selected_card_id: { type: [string, "null"] }
        constraints: { type: array, items: { type: string } }
        notes: { type: string }
        confirmation:
          type: object
          properties:
            status: { type: string, description: draft 等 }
            confirmed_at: { type: [string, "null"] }
        evidence: { type: array, items: { type: object, additionalProperties: true } }
      additionalProperties: true
    IntakeTurn:
      type: object
      description: 訪談回合（intake_service.py:155-171；伺服器無狀態，brief 由前端原樣帶回）
      required: [session_id, mode, client_brief, ready_for_confirmation]
      properties:
        session_id: { type: string }
        mode: { type: string, enum: [guided_llm, guided_fallback] }
        step: { type: [string, "null"], description: 下一步驟 key；null 表訪談完成 }
        question: { type: [string, "null"] }
        reply: { type: string, description: 只在 answer 回應出現 }
        client_brief: { $ref: "#/components/schemas/ClientBrief" }
        ready_for_confirmation: { type: boolean }
        llm_model: { type: [string, "null"], description: 只在 answer 回應出現 }

    # ---- 報告與估價 ----
    ReportPayload:
      type: object
      description: 設計手冊與交付提案共用輸入（main.py:2353-2375 驗證）
      required: [scene, rooms]
      properties:
        project_id: { type: string, description: 有值須與路徑一致，否則 422 manual_project_mismatch }
        scene:
          $ref: "#/components/schemas/SceneJson"
          description: state.sceneData；必須含非空 scene_objects
        rooms:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
            required: [room_id]
            properties:
              room_id: { type: string }
          description: 逐房資料（含房間尺寸與目前最新生圖 data URL）
    DesignDeliveryPackage:
      type: object
      description: 第 8 步成果包（schema 1.1；main.py:2920-2944）
      required: [schema_version, artifact_type, project_id, presentation, engineering_report, security_review, budget_report, web_report]
      properties:
        schema_version: { type: string, const: "1.1" }
        artifact_type: { type: string, const: roompilot.web_design_delivery.v1 }
        project_id: { type: string }
        snapshot_id: { type: [string, "null"] }
        generated_at: { type: string }
        presentation:
          type: object
          additionalProperties: true
          properties:
            title: { type: string }
            subtitle: { type: string }
            style_card: { type: object, additionalProperties: true }
            rooms: { type: array, items: { type: object, additionalProperties: true } }
            security_review: { type: object, additionalProperties: true }
        engineering_report:
          type: object
          additionalProperties: true
          properties:
            rooms: { type: array, items: { type: object, additionalProperties: true } }
            completion:
              type: object
              properties:
                room_count: { type: integer }
                rendered_room_count: { type: integer }
                revised_room_count: { type: integer }
            notes: { type: array, items: { type: string } }
        security_review: { type: object, additionalProperties: true }
        budget: { type: object, additionalProperties: true, description: 與 budget_report 同值（相容欄位） }
        budget_report: { type: object, additionalProperties: true }
        delivery_proposal:
          type: object
          additionalProperties: true
          properties:
            status: { type: string, enum: [generated, not_generated] }
            download_url: { type: string }
            hint: { type: string }
        web_report:
          type: object
          properties:
            title: { type: string }
            format: { type: string, const: web_package }
            sections:
              type: array
              items:
                type: object
                properties:
                  heading: { type: string }
                  data_key: { type: string }
    CostWorkItem:
      type: object
      description: 工程概算輸入項（cost_estimation.py:46-58）
      required: [work_code, quantity, quantity_evidence]
      properties:
        id: { type: string }
        work_code: { type: string, description: 須對得上行情種子的費率 work_code，否則列入 needs_quote }
        description: { type: string }
        quantity:
          type: object
          required: [value, unit]
          properties:
            value: { type: number, exclusiveMinimum: 0 }
            unit: { type: string, description: 須與費率 unit 相符，否則列入 needs_quote（unit_mismatch） }
        quantity_evidence:
          type: array
          minItems: 1
          items: { type: object, additionalProperties: true }
          description: 數量證據；缺席回 422 cost_quantity_evidence_required
        assumptions: { type: array, items: { type: string } }
    CostEstimate:
      type: object
      description: 工程概算輸出（schema 1.0；cost_estimation.py:97-107）
      required: [schema_version, currency, items, needs_quote, totals_twd, status]
      properties:
        schema_version: { type: string, const: "1.0" }
        catalog_version: { type: [string, "null"] }
        currency: { type: string, default: TWD }
        region: { type: string, default: 台灣 }
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id: { type: string }
              work_code: { type: string }
              description: { type: string }
              quantity: { type: object, additionalProperties: true }
              quantity_evidence: { type: array, items: { type: object, additionalProperties: true } }
              rate_twd: { type: object, additionalProperties: true }
              estimate_twd:
                type: object
                properties:
                  low: { type: integer }
                  base: { type: integer }
                  high: { type: integer }
              source_ids: { type: array, items: { type: string } }
              sources: { type: array, items: { type: object, additionalProperties: true }, description: 每筆含 url 與 retrieved_on（可追溯來源） }
              price_date: { type: [string, "null"] }
              inclusions: { type: array, items: { type: string } }
              exclusions: { type: array, items: { type: string } }
              assumptions: { type: array, items: { type: string } }
              status: { type: string, const: concept_estimate }
        needs_quote:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              work_code: { type: string }
              description: { type: string }
              reason: { type: string, enum: [rate_missing, unit_mismatch] }
        totals_twd:
          type: object
          properties:
            low: { type: integer }
            base: { type: integer }
            high: { type: integer }
        status: { type: string, const: concept_estimate }
        disclaimer_zh: { type: string }

    # ---- 型錄 ----
    FurnitureCard:
      type: object
      description: 家具卡片欄位（detail=card；main.py:873-906）。家具只來自 8,675 件已驗證官方 catalog（REQ-013）；quarantine/inactive 不出現（NFR-005）
      required: [furniture_id]
      properties:
        furniture_id: { type: string }
        name_en: { type: [string, "null"] }
        name_zh: { type: [string, "null"] }
        name_zh_raw: { type: [string, "null"] }
        category_label: { type: [string, "null"] }
        taxonomy_group: { type: [string, "null"] }
        taxonomy_group_zh: { type: [string, "null"] }
        taxonomy_type_zh: { type: [string, "null"] }
        catalog_scope: { type: [string, "null"] }
        normalized_type: { type: [string, "null"] }
        primary_style: { type: [string, "null"] }
        style_primary: { type: [string, "null"] }
        style_secondary: { type: [string, "null"] }
        style_candidates: { type: array, items: { type: object, additionalProperties: true } }
        room_types: { type: array, items: { type: string } }
        catalog_role: { type: [string, "null"] }
        description: { type: [string, "null"] }
        rag_text: { type: array, items: { type: string } }
        mood_tags: { type: array, items: { type: string } }
        features: { type: array, items: { type: string } }
        search_keywords: { type: array, items: { type: string } }
        color: { type: [string, "null"] }
        material: { type: [string, "null"] }
        size_cm:
          type: [object, "null"]
          properties:
            width: { type: number }
            depth: { type: number }
            height: { type: number }
        has_model: { type: [boolean, "null"] }
        missing_model_reason: { type: [string, "null"] }
        model_url: { type: [string, "null"], description: CloudFront GLB URL（REQ-013） }
        image_url: { type: [string, "null"] }
        thumbnail_url: { type: [string, "null"] }
        preview_url: { type: [string, "null"] }
        preview_images: { type: object, additionalProperties: true, description: 三視角圖 }
      additionalProperties: true
    FurnitureCatalogResponse:
      type: object
      description: 型錄分頁回應（main.py:3264-3279）
      required: [items, page, page_size, total, has_next_page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FurnitureCard" }
          description: detail=scene 時為完整 item（開放式欄位）
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        has_next_page: { type: boolean }
        styles: { type: array, items: { type: object, additionalProperties: true } }
        type_options: { type: array, items: { type: object, additionalProperties: true } }
        category_groups: { type: array, items: { type: object, additionalProperties: true } }
        filter_options: { type: object, additionalProperties: true }
        furniture: { type: array, items: { type: string }, description: 舊 R3F viewer 相容清單 }
        catalog_status: { $ref: "#/components/schemas/CatalogStatus" }
    CatalogStatus:
      type: object
      description: 型錄 provider 狀態（main.py:3095-3141）；postgres 模式須回滿 8,675 筆才採用，失敗必須可見（NFR-003、ACPT-012）
      properties:
        catalog_provider:
          type: object
          additionalProperties: true
          properties:
            provider: { type: string, description: kai_postgresql／json_fallback }
            available: { type: boolean }
            count: { type: integer }
        furniture: { type: object, additionalProperties: true }
        furniture_images: { type: object, additionalProperties: true }
        surfaces:
          type: object
          properties:
            provider: { type: string }
            wall_count: { type: integer }
            floor_count: { type: integer }
        doors: { type: object, additionalProperties: true }
        style_cards:
          type: object
          properties:
            provider: { type: string }
            count: { type: integer, description: 18（6 風格 × 3 色卡） }
      additionalProperties: true

    # ---- RAG ----
    RagSearchRequest:
      type: object
      description: RAG 檢索請求（models.py:80-87；extra=forbid，未知欄位回 422）
      required: [query]
      additionalProperties: false
      properties:
        query: { type: string, minLength: 1, maxLength: 1000 }
        top_k: { type: integer, minimum: 1, maximum: 8, default: 8 }
        fast: { type: boolean, default: false, description: 跳過外部 LLM 佇列，走本地意圖正規化＋pgvector＋reranker }
    RagJobSnapshot:
      type: object
      description: RAG job 快照（schema roompilot.rag.job.v1；rag_api.py:140-156）
      required: [schema_version, job_id, status, progress, stage, message, elapsed_ms]
      properties:
        schema_version: { type: string, const: roompilot.rag.job.v1 }
        job_id: { type: string }
        status: { type: string, enum: [queued, running, completed, failed] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        stage: { type: string }
        message: { type: string }
        elapsed_ms: { type: number }
        result: { type: object, additionalProperties: true, description: 只在 completed 出現 }
        error:
          type: object
          description: 只在 failed 出現
          properties:
            code: { type: string }
            message: { type: string }
            http_status: { type: integer }
