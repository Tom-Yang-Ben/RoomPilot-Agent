openapi: 3.1.0
info:
  title: RoomPilot Agent & RAG API
  version: 1.0.0
  summary: Agent 選件／並存管線與家具語意檢索的端點契約
  description: |
    本檔涵蓋 RoomPilot 單一 FastAPI app 中的**兩個家族**：

    - `/api/agent/*` —— 引導式 intake、伺服器端選件閘門、以 `ROOMPILOT_AGENT_PIPELINE`
      旗標保護的 MasterAgent 並存管線與對帳端點（`backend/server/main.py:3336-3588`）。
    - `/api/rag/*` —— 家具語意檢索的就緒查詢、同步檢索與非同步工作佇列
      （`backend/server/rag_api.py` 全檔，掛載於 `main.py:105,197`）。

    **不含**：專案／工作流、辨識、場景、生圖與交付端點，見同目錄
    `openapi-project-workflow-v1.yaml`、`openapi-scene-v1.yaml`、
    `openapi-render-delivery-v1.yaml`；設計約定與錯誤語意見 `api_spec.md`；
    資料表與向量表見 `db_design.md`；模組邊界論述見
    `../03_architecture/adr/ADR-008-rag-retrieval-only-offline-models.md` 與
    `../03_architecture/adr/ADR-011-agent-pipeline-flag-isolation.md`。
    `GET /rag`（`rag_api.py:159-161`）雖與本家族同檔，但屬靜態頁面，不在本檔範圍。

    **本檔由程式碼反推，非手寫契約先行**：所有 schema 欄位以實際 pydantic model 或
    dict 組裝為準，程式碼看不出來的欄位一律標 `待確認`，不猜型別。

    **佐證基準**：分支 `yen`、HEAD `8f378b24`、工作樹日期 2026-08-12。
    **狀態**：草稿（待 owner 核准）。
    **Owner**：`/api/agent/*` 為 Yen（MOD-AGT）；`/api/rag/*` 為 Django（MOD-RAG）。
    **語域**：L3（工程契約）。

    **認證**：本 repo 無任何認證或授權機制（NFR-019），端點皆為 loopback 內部工具。
    **單位鐵律**：所有長度欄位一律公分（`ADR-007`）。

    **狀態端點只宣告 200，是刻意的**：`GET /api/agent/pipeline/status`
    （`main.py:3504-3507`）、`GET /api/rag/status`（`rag_api.py:164-166`）與
    `POST /api/agent/intake/start`（`main.py:3336-3340`）三支在原始碼中**沒有任何
    `raise` 或 try/except**，可用性一律以 200 回應主體承載（`ready`／`enabled`／
    `blockers`）。對照組是同族的 `POST /api/rag/search`（`rag_api.py:171-175` 捕捉
    四類例外）與 `_require_pipeline_enabled()`（`main.py:3510-3515` 回 404）——
    status 端點刻意不呼叫它，docstring 明寫「永遠可查，即使未啟用」。
    因此本檔不為這三支宣告錯誤 response；未捕捉例外會落到 FastAPI 預設 500，
    那是框架行為而非本契約承諾。
  contact:
    name: RoomPilot Pilot 團隊
  x-evidence-baseline:
    branch: yen
    head: 8f378b24
    worktree_date: "2026-08-12"
  x-traceability:
    upstream_srs: ../01_requirements/srs.md
    upstream_prd: ../01_requirements/prd.md
    registry: ../00-registry.md
    design: api_spec.md
    qa: ../05_qa/test_plan.md

servers:
  - url: http://127.0.0.1:8002
    description: 本機 loopback（唯一部署形態；啟動指令見 `README.md:49`，`ADR-012`）

tags:
  - name: agent-intake
    description: 引導式需求 intake（`intake_service.py`）。無對應 FR，正式前端未使用，見本檔 x-open-questions。
  - name: agent-selection
    description: 伺服器端選件閘門（FR-050～FR-052），第 6 步唯一實際呼叫的 agent 端點。
  - name: agent-pipeline
    description: MasterAgent 並存管線與對帳（FR-053、FR-054），旗標關閉時除 status 外全回 404。
  - name: rag
    description: 家具語意檢索（FR-046～FR-049），只回排序，不決定任何幾何合法性。

paths:
  /api/agent/intake/start:
    post:
      tags: [agent-intake]
      operationId: startAgentIntake
      summary: 開啟一輪引導式 intake，回傳空白 client_brief 與第一題
      description: |
        不呼叫 LLM。`mode` 依 `OPENROUTER_API_KEY` 與 `OPENROUTER_INTAKE_ENABLED=1`
        決定為 `guided_llm` 或 `guided_fallback`（`intake_service.py:155-158`）。
      x-requirement: ["待確認：srs.md §2.7 未涵蓋 intake 路由"]
      x-evidence: ["main.py:3336-3341", "intake_service.py:155-158"]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                  default: roompilot-local
              additionalProperties: true
      responses:
        "200":
          description: 已建立 intake 會話
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntakeTurn" }

  /api/agent/intake/answer:
    post:
      tags: [agent-intake]
      operationId: answerAgentIntake
      summary: 提交一題答案並推進 intake，回傳合併後的 client_brief
      description: |
        優先呼叫 OpenRouter 抽取；失敗或未啟用時走本地正規表示式 fallback
        （`intake_service.py:83-95,136-153,160-171`）。伺服器**不保存** session，
        `client_brief` 由呼叫端逐輪回傳。
      x-requirement: ["待確認：srs.md §2.7 未涵蓋 intake 路由"]
      x-evidence: ["main.py:3343-3356", "intake_service.py:160-171"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntakeAnswerRequest" }
      responses:
        "200":
          description: 已推進一輪
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntakeTurn" }
        "422":
          description: "`step` 或 `answer` 為空"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlainDetailError" }
              example: { detail: "step 與 answer 皆為必要欄位。" }

  /api/agent/furniture/select:
    post:
      tags: [agent-selection]
      operationId: selectFurniture
      summary: 伺服器端選件閘門，LLM 選擇未通過本地白名單即整批降級為規則選件
      description: |
        `llm_selection` 存在時走 `request_selections` 驗證；`SelectionParseError` 或
        `SelectionUnavailableError` 皆不回錯，改附 `warnings` 並降級。降級仍失敗時
        回 `source: local_rules_unvalidated` 並保留每房前 8 筆候選
        （`main.py:3440-3501`、`agent/select.py:42-52,352-376`）。
      x-requirement: ["FR-050", "FR-051", "FR-052", "ACPT-044", "ACPT-045"]
      x-evidence: ["main.py:3440-3501", "agent/select.py:352-376", "scene_v2.js:10606-10625"]
      x-open-question: "FR-052 餐椅數量兩套邏輯並存，見 OPEN-39"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FurnitureSelectRequest" }
      responses:
        "200":
          description: 已回傳選件結果（含降級情形）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FurnitureSelectResponse" }
        "422":
          description: "`rooms` 非陣列"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlainDetailError" }
              example: { detail: "rooms must be a list" }

  /api/agent/pipeline/status:
    get:
      tags: [agent-pipeline]
      operationId: getAgentPipelineStatus
      summary: 查詢並存管線旗標與 gateway 設定狀態（旗標關閉時仍可查）
      description: |
        唯一不受旗標保護的管線端點。只回布林與旗標名稱，不外洩金鑰
        （`main.py:3504-3506`、`agent_pipeline_service.py:46-51`）。
        環境變數未設或為 `0/false/no/off` 一律視為關閉（`agent_pipeline_service.py:32,42-43`）。
      x-requirement: ["FR-053", "FR-067", "ACPT-046", "ACPT-056"]
      x-evidence: ["main.py:3504-3506", "agent_pipeline_service.py:32-51"]
      responses:
        "200":
          description: 旗標狀態
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineStatus" }

  /api/agent/pipeline/{project_id}/start:
    post:
      tags: [agent-pipeline]
      operationId: startAgentPipeline
      summary: 載入 layout_json 與規則並進入 await_questionnaire 暫停點
      description: |
        不影響正式第 6 步（`ADR-011`）。狀態序列化到
        `.runtime/agent_pipeline/<project_id>.json`（`agent_pipeline_service.py:54-60,83-91`）。
      x-requirement: ["FR-053", "ACPT-046"]
      x-evidence: ["main.py:3518-3535", "agent_pipeline_service.py:83-91", "agent/master.py:117-121"]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PipelineStartRequest" }
      responses:
        "200":
          description: 已啟動並停在 `await_questionnaire`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PauseInfo" }
        "404": { $ref: "#/components/responses/PipelineDisabled" }
        "422":
          description: |
            `layout_json` 缺漏或非物件；或 `ToolError` 轉譯（例如 layout 缺 `rooms`）。
            detail 為中文字串，**無** code 欄位。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlainDetailError" }
              example: { detail: "layout_json 為必要欄位（辨識步驟輸出的室內架構）。" }

  /api/agent/pipeline/{project_id}/submit:
    post:
      tags: [agent-pipeline]
      operationId: submitAgentPipeline
      summary: 在目前 HITL 決策點提交輸入並推進至下一個暫停點
      description: |
        payload 形狀依上一次回應的 `expects` 而定（問卷→A/B 擺放＋驗證→色卡→回饋）。
        每次提交前自動建立 checkpoint（`agent/master.py:123-156`）。
      x-requirement: ["FR-053", "ACPT-046"]
      x-evidence: ["main.py:3537-3547", "agent_pipeline_service.py:94-101", "agent/master.py:189-199"]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: 由前一個 `PauseInfo.expects` 決定的動態物件，無固定 schema。
              additionalProperties: true
      responses:
        "200":
          description: 已推進，回傳新的暫停點
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PauseInfo" }
        "404": { $ref: "#/components/responses/PipelineDisabled" }
        "409":
          description: 該專案尚未 start 過管線
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlainDetailError" }
              example: { detail: "專案 demo-001 尚未啟動 Agent 管線，請先呼叫 start。" }

  /api/agent/pipeline/{project_id}/undo:
    post:
      tags: [agent-pipeline]
      operationId: undoAgentPipeline
      summary: 回復上一次 submit 之前的完整狀態
      x-requirement: ["FR-053", "ACPT-046"]
      x-evidence: ["main.py:3549-3557", "agent_pipeline_service.py:104-111"]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 回復結果加上目前暫停點（`undone` 為 false 表示無可回復的 checkpoint）
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [undone]
                    properties:
                      undone: { type: boolean }
                  - $ref: "#/components/schemas/PauseInfo"
        "404": { $ref: "#/components/responses/PipelineDisabled" }
        "409":
          description: 該專案尚未 start 過管線
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlainDetailError" }

  /api/agent/pipeline/{project_id}:
    get:
      tags: [agent-pipeline]
      operationId: getAgentPipeline
      summary: 查詢目前暫停點、期望輸入與最近一次階段產物
      description: |
        路由宣告順序上 `GET /api/agent/pipeline/status`（`main.py:3504`）先於本路由
        （`main.py:3559`），因此 `status` 不會被 `{project_id}` 吃掉。
      x-requirement: ["FR-053", "ACPT-046"]
      x-evidence: ["main.py:3559-3567", "agent_pipeline_service.py:114-119"]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 目前暫停點
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PauseInfo" }
        "404":
          description: |
            旗標未啟用，或該專案尚未 start（兩種情況皆為 404，detail 字串不同、皆無 code 欄位）。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlainDetailError" }

  /api/agent/pipeline/reconcile:
    post:
      tags: [agent-pipeline]
      operationId: reconcileAgentPipeline
      summary: 同一批第 6 步選定家具跑兩條路徑，比對家族覆蓋與合法性
      description: |
        Path A 為正式第 6 步 `scene_service.generate_layout`，Path B 為 agent 的
        `PlaceFurnitureTool` ＋ `EngineValidateTool`。**刻意不比座標**（兩路徑座標系不同、
        且合法性檢查同源），只比家族覆蓋與硬違規（`agent_reconcile_service.py:1-25,102-104`）。
        本端點同樣受旗標保護。
      x-requirement: ["FR-054", "ACPT-046"]
      x-evidence: ["main.py:3569-3588", "agent_reconcile_service.py:77-141"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconcileRequest" }
      responses:
        "200":
          description: 對帳報告
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconcileReport" }
        "404": { $ref: "#/components/responses/PipelineDisabled" }
        "422":
          description: |
            `width_cm`／`depth_cm` 非數值，或 `items` 缺漏／為空；或 `reconcile_room` 拋 ValueError。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlainDetailError" }
              example: { detail: "width_cm 與 depth_cm 為必要數值（公分）。" }

  /api/rag/status:
    get:
      tags: [rag]
      operationId: getRagStatus
      summary: 回報檢索就緒狀態與具名 blocker，不載模型也不呼叫 LLM
      description: |
        回應會主動移除模型狀態中的 `cache_dir`，不外洩伺服器檔案佈局
        （`rag/service.py:64-66`，NFR-020）。任何 blocker 存在時 `ready` 為 false。
      x-requirement: ["FR-046", "FR-067", "ACPT-041", "ACPT-056"]
      x-evidence: ["rag_api.py:164-166", "rag/service.py:62-130"]
      responses:
        "200":
          description: 就緒狀態（未就緒也回 200，以 `blockers` 表達原因）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RagStatus" }

  /api/rag/search:
    post:
      tags: [rag]
      operationId: searchRagSync
      summary: 同步語意檢索，回傳分組候選與檢索證據
      description: |
        同步路徑會阻塞至檢索完成；正式第 5 步問卷改用非同步 jobs 路徑
        （`scene_v2.js:869-875`）。檢索只影響排序，不決定任何幾何合法性
        （回應固定帶 `boundary: retrieval_only_no_geometry_legality`）。
      x-requirement: ["FR-047", "ACPT-042"]
      x-evidence: ["rag_api.py:169-175", "rag/service.py:355-497"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RagSearchRequest" }
      responses:
        "200":
          description: 檢索完成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RagSearchResult" }
        "422": { $ref: "#/components/responses/PydanticValidationError" }
        "502":
          description: "上游查詢解析服務失敗；detail.code 為 `rag_parser_unavailable`，`retryable` 為 true"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RagServiceError" }
        "503":
          description: |
            依例外型別對應三種 code（`rag_api.py:48-57`、`rag/errors.py:8-18`）：
            `rag_disabled`（功能未啟用）、`rag_dependency_unavailable`（套件／模型快取／設定未就緒）、
            `rag_database_unavailable`（pgvector 不可用）。三者 `retryable` 皆為 true。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RagServiceError" }
              example:
                detail:
                  code: rag_dependency_unavailable
                  message: RAG 必要套件、模型或設定尚未就緒。
                  retryable: true
        "500":
          description: "未預期錯誤；code 為 `rag_internal_error`（`rag_api.py:57`）。注意：同步路徑僅捕捉四種具名例外（`rag_api.py:173`），其餘例外走 FastAPI 預設 500，未必帶 code 結構——待確認。"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RagServiceError" }

  /api/rag/search/jobs:
    post:
      tags: [rag]
      operationId: createRagSearchJob
      summary: 建立非同步檢索工作並立即回 202 工作快照
      description: |
        單一 daemon worker 序列化執行以避免本機嵌入模型並行（`rag_api.py:121-137`，NFR-018）。
        佇列與同時進行中的工作上限 24（`rag_api.py:31,186`）。完成／失敗的工作保留
        3600 秒後由下一次建立請求清除（`rag_api.py:30,60-69`）。工作狀態存於行程記憶體，
        重啟即失（NFR-009）。
      x-requirement: ["FR-048", "FR-049", "ACPT-043"]
      x-evidence: ["rag_api.py:178-208", "rag_api.py:28-34", "scene_v2.js:869-875"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RagSearchRequest" }
      responses:
        "202":
          description: 已排入佇列，狀態為 `queued`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RagJobSnapshot" }
        "422": { $ref: "#/components/responses/PydanticValidationError" }
        "429":
          description: "佇列已滿（>= 24 個 queued/running）；detail.code 為 `rag_job_capacity_reached`，`retryable` 為 false"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RagServiceError" }
              example:
                detail:
                  code: rag_job_capacity_reached
                  message: 已有 RAG 搜尋正在執行，請等待目前工作完成。
                  retryable: false

  /api/rag/search/jobs/{job_id}:
    get:
      tags: [rag]
      operationId: getRagSearchJob
      summary: 輪詢檢索工作進度；完成時附結果，失敗時附錯誤 code
      description: |
        失敗**不以 HTTP 錯誤碼表達**：工作本身回 200，錯誤放進 `error.code`／`error.http_status`
        （`rag_api.py:100-108`）。第 5 步據此降級為 `unavailable` 並保留原推薦順序，不阻塞問卷
        （`scene_v2.js:894-901`，ACPT-042）。
      x-requirement: ["FR-048", "FR-049", "ACPT-042", "ACPT-043"]
      x-evidence: ["rag_api.py:211-221", "rag_api.py:140-156", "scene_v2.js:876-910"]
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string, description: "`uuid4().hex`（32 字元十六進位）" }
      responses:
        "200":
          description: 工作快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RagJobSnapshot" }
        "404":
          description: "工作不存在，或已完成／失敗超過 3600 秒被清除；detail.code 為 `rag_job_not_found`，`retryable` 為 false"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RagServiceError" }
              example:
                detail:
                  code: rag_job_not_found
                  message: RAG 搜尋工作不存在或已過期。
                  retryable: false

components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      description: 專案識別碼；寫檔前只保留英數與 `-`／`_`，清洗後為空即拋錯（`agent_pipeline_service.py:54-60`）。
      schema: { type: string, minLength: 1 }

  responses:
    PipelineDisabled:
      description: |
        並存管線旗標未啟用（`ROOMPILOT_AGENT_PIPELINE` 未設或為 `0/false/no/off`）。
        detail 為中文字串，無 code 欄位（`main.py:3510-3516`）。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlainDetailError" }
          example: { detail: "Agent 管線未啟用；設定環境變數 ROOMPILOT_AGENT_PIPELINE=1 後重啟服務。" }
    PydanticValidationError:
      description: pydantic 驗證失敗（`RagSearchRequest` 設 `extra=forbid`，未知欄位亦拒）。FastAPI 預設格式。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HTTPValidationError" }

  schemas:
    PlainDetailError:
      type: object
      description: "`/api/agent/*` 的錯誤格式：detail 為人類可讀中文字串，**沒有**機器可判讀的 code。"
      required: [detail]
      properties:
        detail: { type: string }

    RagServiceError:
      type: object
      description: "`/api/rag/*` 的錯誤格式：detail 為結構化物件（`rag_api.py:37-45`）。"
      required: [detail]
      properties:
        detail:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              enum:
                - rag_disabled
                - rag_dependency_unavailable
                - rag_database_unavailable
                - rag_parser_unavailable
                - rag_internal_error
                - rag_job_capacity_reached
                - rag_job_not_found
            message: { type: string }
            retryable:
              type: boolean
              description: 由 HTTP 狀態碼推導，僅 502／503 為 true（`rag_api.py:43`）。

    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items: { anyOf: [{ type: string }, { type: integer }] }
              msg: { type: string }
              type: { type: string }

    ClientBrief:
      type: object
      description: 引導式 intake 的累積結果（`intake_service.py:56`）。伺服器不保存，由呼叫端逐輪回傳。
      required: [schema_version, created_at, space, occupants, needs, style, constraints, notes, confirmation, evidence]
      properties:
        schema_version: { type: string, const: "1.1" }
        created_at: { type: string, format: date-time }
        space:
          type: object
          properties:
            type: { type: [string, "null"] }
            width_cm: { type: number, default: 420 }
            depth_cm: { type: number, default: 360 }
            floorplan_filename: { type: [string, "null"] }
        occupants:
          type: object
          properties:
            adults: { type: integer, minimum: 0 }
            children: { type: integer, minimum: 0 }
            elderly: { type: integer, minimum: 0 }
            pets: { type: integer, minimum: 0 }
        needs: { type: array, items: { type: string } }
        style:
          type: object
          properties:
            preferred: { type: array, items: { type: string } }
            colors: { type: array, items: { type: string } }
            materials: { type: array, items: { type: string } }
            selected_card_id: { type: [string, "null"] }
        constraints: { type: array, items: { type: string } }
        notes: { type: string }
        confirmation:
          type: object
          properties:
            status: { type: string, enum: [draft] }
            confirmed_at: { type: [string, "null"] }
        evidence: { type: array, items: { type: string } }

    IntakeAnswerRequest:
      type: object
      required: [step, answer]
      properties:
        session_id: { type: string, default: roompilot-local }
        step:
          type: string
          enum: [space_type, occupants, needs, style, materials, constraints]
          description: 六個 intake 步驟鍵（`intake_service.py:13-20`）。
        answer: { type: string, minLength: 1 }
        client_brief: { $ref: "#/components/schemas/ClientBrief" }
      additionalProperties: true

    IntakeTurn:
      type: object
      required: [session_id, mode, step, question, client_brief, ready_for_confirmation]
      properties:
        session_id: { type: string }
        mode: { type: string, enum: [guided_llm, guided_fallback] }
        step:
          type: [string, "null"]
          description: 下一個待答步驟；`null` 表示六段皆齊（`intake_service.py:122-129`）。
        question: { type: [string, "null"] }
        reply:
          type: string
          description: 僅 answer 端點回傳（`intake_service.py:171`）。
        client_brief: { $ref: "#/components/schemas/ClientBrief" }
        ready_for_confirmation: { type: boolean }
        llm_model:
          type: [string, "null"]
          description: 僅 answer 端點回傳；fallback 時為 null。

    FurnitureSelectRequest:
      type: object
      required: [rooms]
      properties:
        rooms:
          type: array
          description: 房間清單；`room_type` 為 `default`／`unknown`／`other` 時會被清空（`main.py:3446-3457`）。
          items:
            type: object
            properties:
              room_id: { type: string }
              id: { type: string, description: "`room_id` 缺漏時的別名" }
              room_type: { type: string }
              type: { type: string, description: "`room_type` 缺漏時的別名" }
              label: { type: string }
            additionalProperties: true
        offers:
          type: object
          description: "候選白名單，`room_id` -> 候選品項陣列。非 dict 直接視為空（`main.py:3358-3383`）。"
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/FurnitureOffer" }
        style_id: { type: [string, "null"] }
        context:
          type: object
          description: 問卷／基本題／逐房需求／視覺偏好等 LLM 提示脈絡；非 dict 即忽略（`main.py:3462`）。
          additionalProperties: true
        llm_selection:
          type: object
          description: 呼叫端預先取得的 LLM 選件輸出；提供時走白名單驗證路徑（`main.py:3467-3477`）。
          additionalProperties: true

    FurnitureOffer:
      type: object
      description: |
        候選品項。正規化後**必定**帶 `furniture_id`／`normalized_type`／`variant_id`／`selection_source`；
        其餘欄位原樣保留（`main.py:3358-3383`）。
      properties:
        furniture_id: { type: string }
        normalized_type: { type: string }
        variant_id: { type: string, default: standard }
        selection_source: { type: string, default: local_rules }
        count: { type: integer, minimum: 1, maximum: 6 }
      additionalProperties: true

    FurnitureSelectResponse:
      type: object
      required: [source, model, warnings, rooms]
      properties:
        source:
          type: string
          enum: [openrouter, local_rules, local_rules_unvalidated]
          description: |
            `openrouter` ＝ LLM 選擇通過白名單驗證；`local_rules` ＝ 本地規則選件；
            `local_rules_unvalidated` ＝ 連本地規則都無法驗證，保留每房前 8 筆候選（`main.py:3487-3501`）。
        model: { type: [string, "null"] }
        warnings:
          type: array
          items: { type: string }
          description: 降級原因（中文），非空即代表發生降級。
        rooms:
          type: array
          items:
            type: object
            required: [room_id, items]
            properties:
              room_id: { type: string }
              items:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/FurnitureOffer"
                    - type: object
                      required: [count, selection_source]
                      properties:
                        count: { type: integer, minimum: 1 }

    PipelineStatus:
      type: object
      required: [enabled, gateway_configured, flag]
      properties:
        enabled: { type: boolean }
        gateway_configured:
          type: boolean
          description: LLM gateway 是否已設定；只回布林，不回金鑰（`agent_pipeline_service.py:49`）。
        flag: { type: string, const: ROOMPILOT_AGENT_PIPELINE }

    PipelineStartRequest:
      type: object
      required: [layout_json]
      properties:
        layout_json:
          type: object
          description: 辨識步驟輸出的室內架構；`layout` 為相容別名（`main.py:3521`）。須含 `rooms`，否則 422。
          additionalProperties: true
        rules_json:
          type: object
          description: 選填規則覆寫；非 dict 即視為 null（`main.py:3528`）。
          additionalProperties: true

    PauseInfo:
      type: object
      description: MasterAgent 的 HITL 暫停點（`agent/master.py:65-73`）。
      required: [state, message, expects, payload]
      properties:
        state:
          type: string
          enum:
            - await_questionnaire
            - await_plan_choice
            - await_palette_choice
            - await_feedback
            - await_render_retry
            - done
        message: { type: string, description: 中文提示。 }
        expects:
          type: object
          description: |
            下一次 submit 期望的欄位說明，隨 state 變動；例如 `await_plan_choice` 為
            `variant`／`viewpoints`／`palette_room_id`／`scene_override`（`agent/master.py:189-199`）。
          additionalProperties: true
        payload:
          type: object
          description: 該階段產物（例如 `rooms`、`variants`）。生圖 base64 亦在此，故刻意不寫進 workflow blob。
          additionalProperties: true

    ReconcileRequest:
      type: object
      required: [width_cm, depth_cm, items]
      properties:
        room_id: { type: string, default: room }
        width_cm: { type: number, exclusiveMinimum: 0, description: 公分（`ADR-007`）。 }
        depth_cm: { type: number, exclusiveMinimum: 0, description: 公分（`ADR-007`）。 }
        items:
          type: array
          minItems: 1
          description: 第 6 步選定家具，server 物件格式；缺尺寸時套 120／60／80 cm fallback（`agent_reconcile_service.py:37-48`）。
          items:
            type: object
            properties:
              instance_id: { type: string }
              furniture_id: { type: string }
              catalog_furniture_id: { type: string }
              name_zh_raw: { type: string }
              normalized_type: { type: string }
              size_cm:
                type: object
                properties:
                  width: { type: number }
                  depth: { type: number }
                  height: { type: number }
              clearance:
                type: object
                description: 淨空覆寫；非 dict 即忽略（`agent_reconcile_service.py:56`）。
                additionalProperties: true
            additionalProperties: true

    ReconcileReport:
      type: object
      required: [room_id, item_count, consistent, step6, agent, divergence, note]
      properties:
        room_id: { type: string }
        item_count: { type: integer }
        consistent:
          type: boolean
          description: 家族集合相同**且** agent 路徑無硬違規（`agent_reconcile_service.py:104`）。
        step6: { $ref: "#/components/schemas/ReconcileSide" }
        agent:
          allOf:
            - $ref: "#/components/schemas/ReconcileSide"
            - type: object
              properties:
                hard_violations:
                  type: array
                  items:
                    type: object
                    properties:
                      item_id: { type: string }
                      reason: { type: string }
        divergence:
          type: object
          properties:
            families_only_in_step6: { type: array, items: { type: string } }
            families_only_in_agent: { type: array, items: { type: string } }
        note: { type: string, description: 固定中文說明，交代為何比家族覆蓋而非座標。 }

    ReconcileSide:
      type: object
      required: [placed, failed, families, failed_items]
      properties:
        placed: { type: integer }
        failed: { type: integer }
        families: { type: array, items: { type: string } }
        failed_items:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              type: { type: string, description: 僅 step6 側有此欄位。 }
              reason: { type: string }

    RagStatus:
      type: object
      required: [schema_version, enabled, ready, blockers, parser, models, database, boundary]
      properties:
        schema_version: { type: string, const: roompilot.rag.status.v1 }
        enabled: { type: boolean }
        ready: { type: boolean, description: "`blockers` 為空才為 true。" }
        blockers:
          type: array
          items:
            type: string
            enum:
              - feature_disabled
              - parser_provider_invalid
              - openai_api_key_missing
              - anthropic_api_key_missing
              - openrouter_api_key_missing
              - openai_package_missing
              - anthropic_package_missing
              - rag_model_packages_missing
              - embedding_model_cache_missing
              - reranker_model_cache_missing
              - furniture_embeddings_empty
              - filtered_search_function_missing
              - postgresql_unavailable
            description: |
              API-key／package 兩類 blocker 以 provider 名稱前綴動態組成（`rag/service.py:80-83`），
              列舉為現行三種 provider 的展開值。
        parser:
          type: object
          properties:
            provider: { type: string, enum: [openai, anthropic, openrouter] }
            model: { type: string }
            reasoning_effort: { type: [string, "null"], description: 僅 openai。 }
            max_tokens: { type: [integer, "null"], description: 僅 anthropic。 }
            key_configured: { type: boolean, description: 只回布林，不回金鑰。 }
            package_available: { type: boolean }
        models:
          type: object
          description: 模型快取狀態；`cache_dir` 已被主動移除以免外洩檔案佈局（`rag/service.py:64-66`）。
          properties:
            packages:
              type: object
              additionalProperties: { type: boolean }
            embedding_cached: { type: boolean }
            reranker_cached: { type: boolean }
          additionalProperties: true
        database:
          type: object
          properties:
            provider: { type: string, const: postgresql_pgvector }
            embedding_model: { type: string }
            embedding_dimension: { type: integer }
            current_embeddings: { type: integer }
            search_function_available: { type: boolean }
            available: { type: boolean }
        boundary: { type: string, const: retrieval_only_no_geometry_legality }

    RagSearchRequest:
      type: object
      description: "`backend/spatial_data/rag/models.py:80-88`；`extra=forbid`，未知欄位一律 422。"
      required: [query]
      additionalProperties: false
      properties:
        query: { type: string, minLength: 1, maxLength: 1000 }
        top_k: { type: integer, minimum: 1, maximum: 8, default: 8 }
        fast:
          type: boolean
          default: false
          description: |
            true 時以本地意圖正規化取代 LLM 解析（`rag/service.py:369-372`），仍走相同 pgvector
            與 reranker 管線。第 5 步問卷固定送 `fast: true`、`top_k: 6`（`scene_v2.js:869-875`）。

    RagSearchResult:
      type: object
      required: [schema_version, query, source, parsed_query, clarification, blocks, timings_ms, boundary]
      properties:
        schema_version: { type: string, const: roompilot.rag.search.v1 }
        query: { type: string }
        source:
          type: object
          properties:
            parser_provider: { type: string }
            parser_model: { type: string }
            embedding_model: { type: string }
            reranker_model: { type: string }
            vector_store: { type: string, const: postgresql_pgvector }
            current_embeddings: { type: integer }
        parsed_query:
          type: object
          description: "`RagQueryPlan.model_dump(mode=json)`（`rag/models.py:54-77`）。"
          additionalProperties: true
        parser_usage:
          type: object
          description: LLM token 用量；`fast` 路徑的內容待確認。
          additionalProperties: true
        clarification:
          type: object
          properties:
            needed: { type: boolean }
            question: { type: [string, "null"] }
            options: { type: array, items: { type: string }, maxItems: 4 }
        dominant_style: { type: [string, "null"] }
        style_zh: { type: string }
        budget_total: { type: [integer, "null"] }
        estimated_total:
          type: integer
          description: 各 block 首位命中價格 × 數量之和（`rag/service.py:453-457`）。
        blocks:
          type: array
          items:
            type: object
            required: [item_id, label_zh, quantity, is_inferred, filters, hits]
            properties:
              item_id: { type: string }
              label_zh: { type: string }
              category_group: { type: [string, "null"] }
              quantity: { type: integer, minimum: 1, maximum: 8 }
              is_inferred: { type: boolean }
              price_cap: { type: [integer, "null"] }
              filters:
                type: object
                description: 該品項實際套用的 SQL 硬篩條件；欄位組成待確認。
                additionalProperties: true
              hits:
                type: array
                items:
                  type: object
                  properties:
                    rank: { type: integer, minimum: 1 }
                    furniture: { $ref: "#/components/schemas/RagFurniture" }
                    scores:
                      type: object
                      description: 排序分項；權重 0.60 rerank ＋ 0.20 style ＋ 0.10 mood ＋ 0.10 confidence（FR-047）。
                      additionalProperties: true
                    duplicate_group: { type: [string, "null"] }
        timings_ms:
          type: object
          properties:
            readiness: { type: number }
            parse: { type: number }
            retrieve_and_rerank: { type: number }
            hydrate: { type: number }
            total: { type: number }
        boundary: { type: string, const: retrieval_only_no_geometry_legality }

    RagFurniture:
      type: object
      description: "`rag/service.py:326-353`；尺寸一律公分並以 `coordinate_unit` 自述（`ADR-007`）。"
      required: [item_id, name_zh, coordinate_unit]
      properties:
        item_id: { type: string }
        name_zh: { type: string }
        name_en: { type: string }
        category: { type: [string, "null"] }
        normalized_type: { type: [string, "null"] }
        price_twd: { type: [integer, "null"] }
        price_is_estimated: { type: boolean }
        style_primary: { type: [string, "null"] }
        style_secondary: { type: [string, "null"] }
        role: { type: [string, "null"] }
        size_class: { type: [string, "null"] }
        coordinate_unit: { type: string, const: cm }
        width_cm: { type: [number, "null"] }
        depth_cm: { type: [number, "null"] }
        height_cm: { type: [number, "null"] }
        image_url: { type: [string, "null"] }
        preview_images:
          type: object
          description: 型錄預覽圖；鍵名組成待確認。
          additionalProperties: true
        model_url: { type: [string, "null"] }
        has_model: { type: boolean }

    RagJobSnapshot:
      type: object
      description: "`rag_api.py:140-156`。`result` 與 `error` 為條件欄位，非 null 時才出現。"
      required: [schema_version, job_id, status, progress, stage, message, elapsed_ms]
      properties:
        schema_version: { type: string, const: roompilot.rag.job.v1 }
        job_id: { type: string }
        status: { type: string, enum: [queued, running, completed, failed] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        stage:
          type: string
          description: |
            已觀察到的值：`queued`、`starting`、`readiness`、`parsing`、`planning`、`hydrating`、
            `formatting`、`completed`、`failed`（`rag_api.py:82-84,98,113`、`rag/service.py:357-497`）。
            檢索過程中的中間 stage 由 `_search_items_batched` 回報，完整列舉待確認。
        message: { type: string }
        elapsed_ms: { type: number }
        result: { $ref: "#/components/schemas/RagSearchResult" }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            http_status: { type: integer }

