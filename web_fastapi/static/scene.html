<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D 場景展示</title>
    <link rel="stylesheet" href="/static/site.css?v=20260707a" />
  </head>
  <body data-page="scene">
    <canvas id="fx-canvas" aria-hidden="true"></canvas>

    <header class="topbar app-topbar">
      <a class="brand app-brand" href="/" aria-label="RoomPilot 首頁">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>RoomPilot</span>
      </a>
      <nav class="topnav" aria-label="主要導覽">
        <a href="/">探索功能</a>
        <a href="/styles">風格類型</a>
        <a href="/library">家具資料庫</a>
        <a href="/scene" class="active">3D 場景展示</a>
      </nav>
      <a class="topbar-cta" href="/scene">開始設計</a>
    </header>

    <main class="page-shell scene-shell">
      <section class="page-panel scene-form-panel">
        <div class="page-heading compact">
          <p class="eyebrow">SCENE FLOW</p>
          <h1>固定風格生成家具</h1>
          <p>上方先選房間、風格、牆面、地板與家具組合，下方直接生成並預覽 3D 場景。</p>
        </div>

        <form id="scene-form" class="scene-form scene-direct-form">
          <div class="scene-direct-grid">
            <label class="scene-field scene-field-full">
              <span>平面圖輸入</span>
              <input id="floorplan" name="floorplan" type="file" accept=".png,.jpg,.jpeg,.webp,.dxf,.dwg" />
            </label>

            <label class="scene-field">
              <span>空間類型</span>
              <select id="space-type" name="space_type">
                <option value="living_room">客廳</option>
                <option value="bedroom">臥室</option>
                <option value="workspace">工作空間</option>
                <option value="dining_room">餐廳</option>
                <option value="studio">套房</option>
              </select>
            </label>

            <label class="scene-field">
              <span>固定風格</span>
              <select id="style-preference" name="style_preference"></select>
            </label>

            <label class="scene-field">
              <span>家具組合</span>
              <select id="furniture-preset" name="furniture_preset"></select>
              <small id="furniture-preset-hint" class="scene-helper">會依房間類型帶出預設家具組合。</small>
            </label>

            <label class="scene-field">
              <span>偏好色系</span>
              <select id="color-preference" name="color_preference"></select>
            </label>

            <label class="scene-field">
              <span>牆面風格</span>
              <select id="wall-option-select" name="wall_option"></select>
            </label>

            <label class="scene-field">
              <span>地板材質</span>
              <select id="floor-option-select" name="floor_option"></select>
            </label>

            <label class="scene-field">
              <span>配置規則</span>
              <select id="rule-profile" name="rule_profile">
                <option value="balanced">平衡配置</option>
                <option value="storage">收納優先</option>
                <option value="calm">安靜留白</option>
                <option value="open">開放通透</option>
              </select>
            </label>

            <label class="scene-field">
              <span>房間寬度 CM</span>
              <input id="room-width" name="room_width_cm" type="number" min="200" step="10" value="420" />
            </label>

            <label class="scene-field">
              <span>房間深度 CM</span>
              <input id="room-depth" name="room_depth_cm" type="number" min="200" step="10" value="360" />
            </label>

            <label class="scene-field scene-field-full">
              <span>自填家具需求</span>
              <input
                id="custom-furniture"
                type="text"
                placeholder="例如：落地燈、玄關櫃、閱讀椅，使用逗號分隔"
              />
            </label>

            <label class="scene-field scene-field-full">
              <span>個人化需求</span>
              <textarea
                id="personal-notes"
                name="personal_notes"
                rows="3"
                placeholder="例如：沙發靠牆、保留走道、不要擋窗、需要展示櫃、希望空間更明亮。"
              ></textarea>
            </label>
          </div>

          <div class="scene-action-row scene-action-bar">
            <button id="random-furniture" type="button" class="secondary-action prominent">重抽家具組合</button>
            <button id="generate-scene" type="submit" class="primary-action">直接生成 3D 場景</button>
          </div>
        </form>
      </section>

      <section id="scene-viewer-panel" class="page-panel scene-viewer-side scene-viewer-panel">
        <div class="page-heading compact">
          <p class="eyebrow">SCENE VIEWER</p>
          <h2>家具配置預覽</h2>
        </div>

        <div class="scene-summary-grid">
          <div><span>風格</span><strong id="scene-style-name">-</strong></div>
          <div><span>LLM</span><strong id="scene-llm-mode">-</strong></div>
          <div><span>家具數量</span><strong id="scene-item-count">0</strong></div>
          <div><span>房間尺寸</span><strong id="scene-room-size">-</strong></div>
        </div>

        <div id="scene-viewer-canvas" class="viewer-canvas scene-canvas" aria-label="3D 場景預覽"></div>
        <div id="scene-status" class="viewer-status">請先選擇條件，再直接生成 3D 場景。</div>

        <div class="viewer-control-row">
          <div class="scene-view-preset-group" aria-label="鏡頭視角">
            <button type="button" class="secondary-action" data-view-preset="overview">俯視</button>
            <button type="button" class="secondary-action" data-view-preset="entrance">入口視角</button>
            <button type="button" class="secondary-action" data-view-preset="corner">角落視角</button>
            <button type="button" class="secondary-action" data-view-preset="inside">室內視角</button>
            <button id="reset-scene-view" type="button" class="secondary-action">重設視角</button>
          </div>
          <span class="viewer-wall-hint">旋轉視角時，擋住畫面的牆面會自動淡出，方便查看室內配置。</span>
        </div>

        <div class="scene-workbench">
          <div class="scene-workbench-main">
            <div class="scene-furniture-tools" aria-label="家具操作">
              <label>
                <span>新增家具</span>
                <select id="add-furniture-type"></select>
              </label>
              <button id="add-furniture" type="button" class="secondary-action">加入家具</button>
              <button id="reshuffle-scene" type="button" class="secondary-action prominent">同風格替換全部</button>
            </div>

            <div id="scene-selected-items" class="scene-selected-list"></div>
          </div>

          <aside class="scene-workbench-side">
            <div class="scene-meta-card scene-background-card">
              <span>空間背景與用材</span>
              <strong id="scene-background">-</strong>
              <small id="scene-background-detail" class="scene-background-detail">
                生成後會在這裡顯示目前牆面、地板與整體氛圍。
              </small>
              <div id="scene-background-surfaces" class="scene-background-surfaces"></div>
            </div>
          </aside>
        </div>
      </section>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="/static/scene.js?v=20260707a"></script>
  </body>
</html>
