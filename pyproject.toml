[project]
name = "roompilot-agent"
version = "0.1.0"
description = "RoomPilot — 室內設計即時提案溝通 Agent(AIPE03 第四組)"
requires-python = ">=3.12"
dependencies = [
    "shapely>=2.1.2",
]

[project.optional-dependencies]
# 網站後端(backend/server):四頁展示 + 場景生成 + DXF 升維
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pillow>=10",
    "ezdxf>=1.3",
    "python-multipart>=0.0.9",
    "certifi>=2024",     # OpenRouter VLM 呼叫的 SSL 憑證鏈(macOS 系統 Python 沒有)
]
# 平面辨識(backend/floorplan):PNG → DXF
vision = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "ezdxf>=1.3",
    "onnxruntime>=1.20",   # 分割模型融合(floorseg.onnx);缺這個管線自動退回純規則
    "certifi>=2024",       # VLM 選配呼叫的 SSL 憑證鏈
]
# 型錄管線(原 scripts/,2026-07-22 重組時移除;extra 暫留供合併含該管線的舊分支)
catalog = [
    "requests>=2.34",
    "selenium>=4.45",
    "webdriver-manager>=4.1",
    "tqdm>=4.68",
    "beautifulsoup4>=4.15",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.2",
]

[dependency-groups]
dev = [
    # 僅供 fastapi.testclient 的傳輸層;業務碼禁止 import(LLM 一律 OpenRouter,見 CLAUDE.md)
    "httpx2>=2.7",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
