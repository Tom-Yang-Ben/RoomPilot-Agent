[project]
name = "roompilot-agent"
version = "0.1.0"
description = "RoomPilot — 室內設計即時提案溝通 Agent(AIPE03 第四組)"
requires-python = ">=3.12"
dependencies = [
    "shapely>=2.1.2",
]

[project.optional-dependencies]
# 網站後端(backend/server):四頁展示 + 場景生成 + DXF 升維
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pillow>=10",
    "ezdxf>=1.3",
    "python-multipart>=0.0.9",
    "httpx>=0.28",
]
# 平面辨識(backend/floorplan):PNG → DXF
vision = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "ezdxf>=1.3",
]
# 尺度文字與繁中房名 OCR；模型較大，部署端按需安裝。
ocr = [
    "paddleocr>=3.0,<4",
    "paddlepaddle>=3.0,<4",
]
# 型錄管線(scripts/):IKEA 下載 + 清洗 + 匯入 PostgreSQL
catalog = [
    "requests>=2.34",
    "selenium>=4.45",
    "webdriver-manager>=4.1",
    "tqdm>=4.68",
    "beautifulsoup4>=4.15",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
