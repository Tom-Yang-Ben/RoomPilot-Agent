[project]
name = "roompilot-agent"
version = "0.1.0"
description = "RoomPilot — 室內設計即時提案溝通 Agent(AIPE03 第四組)"
requires-python = ">=3.12"
dependencies = [
    "shapely>=2.1.2",
]

[project.optional-dependencies]
# 網站後端(backend/server):四頁展示 + 場景生成 + DXF 升維
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pillow>=10",
    "ezdxf>=1.3",
    "python-multipart>=0.0.9",
    "httpx>=0.28",
]
# 平面辨識(backend/floorplan):PNG → DXF
vision = [
    "numpy>=2.0",
    "opencv-python>=4.10,<5",
    "ezdxf>=1.3",
    # symbol_match 解析模板庫的 SVG path——推論期依賴，不是研發工具。
    "svgpathtools>=1.6",
    # 房型 OCR 文字證據層(floorplan2room 層 5)。純 pip/CPU，免系統套件；
    # 與上方 ocr extra 的 PaddleOCR 是不同層的兩個引擎。
    "rapidocr-onnxruntime>=1.4",
]
# 尺度文字與繁中房名 OCR；模型較大，部署端按需安裝。
ocr = [
    "paddleocr>=3.0,<4",
    "paddlepaddle>=3.0,<4",
]
# 房型語意層(DINOv2 凍結骨幹 + 線性頭)：只推論不訓練，CPU 版即可。
# 2026-07-30 CubiCasa 血統移除，本 extra 的內容物換人但名稱沿用——缺它房型
# 退回面積規則，own_eval 72 房 90.3% 掉回幾何猜測水準，服務不中斷但會印警告。
# 與 ocr 同理獨立成 extra——torch 體積約 2GB，不該進每個人的預設環境。
# opencv-python-headless 必須同步鎖 <5：torch 生態會把它拉進來蓋掉 cv2，
# 而 OpenCV 5.0 改了 HoughLinesP 的回傳 shape，門偵測會當場失效。
semantic = [
    "torch>=2.0",
    "opencv-python-headless>=4.10,<5",
]
# 型錄管線(scripts/):IKEA 下載 + 清洗 + 匯入 PostgreSQL
catalog = [
    "requests>=2.34",
    "selenium>=4.45",
    "webdriver-manager>=4.1",
    "tqdm>=4.68",
    "beautifulsoup4>=4.15",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
packages = ["backend"]
