[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "roompilot-agent"
version = "0.1.0"
description = "RoomPilot — local-first AI-assisted interior planning workflow"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
authors = [{ name = "AIPE03 第四組" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
portable = [
    "certifi>=2024",
    "ezdxf>=1.3,<2",
    "fastapi>=0.115,<1",
    "numpy>=2.0,<3",
    "onnxruntime>=1.20,<2",
    "opencv-python-headless>=4.10,<5",
    "pillow>=10,<13",
    "python-multipart>=0.0.9,<1",
    "shapely>=2.1,<3",
    "uvicorn>=0.30,<1",
]
postgres = [
    "psycopg2-binary>=2.9,<3",
    "python-dotenv>=1.2,<2",
]
rag = [
    "anthropic>=0.64,<1",
    "openai>=2,<3",
    "sentence-transformers>=5,<6",
    "torch>=2,<3",
]
ocr = [
    "paddleocr>=3,<4",
    "paddlepaddle>=3,<4",
]
delivery = [
    "openpyxl>=3.1,<4",
    "pikepdf>=10,<11",
    "playwright>=1.55,<2",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "backend/server/tests"]
addopts = "--strict-markers"
markers = [
    "postgres: requires a disposable PostgreSQL service",
    "browser: requires Playwright Chromium",
    "external: requires an explicitly configured external provider",
]

[tool.setuptools.packages.find]
include = ["backend*"]
