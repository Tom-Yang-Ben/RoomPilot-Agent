<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RoomPilot 720° 提案漫遊</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      body {
        font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
        color: #fff;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        font-size: 13px;
      }
      button { font-family: inherit; }
      svg { display: block; }

      #pano-canvas { position: fixed; inset: 0; cursor: grab; }
      #pano-canvas.dragging { cursor: grabbing; }

      .pano-ui { position: fixed; z-index: 10; }

      /* ── 場景內房間膠囊(名稱+箭頭) ── */
      #chip-layer { position: fixed; inset: 0; z-index: 6; pointer-events: none; overflow: hidden; }
      .room-chip {
        position: absolute;
        transform: translate(-50%, -100%);
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        pointer-events: auto;
        cursor: pointer;
      }
      .room-chip .chip-label {
        background: rgba(38, 38, 40, 0.78);
        color: #fff;
        padding: 5px 12px;
        border-radius: 4px;
        font-size: 13px;
        letter-spacing: 1px;
        white-space: nowrap;
      }
      .room-chip .chip-arrow { opacity: 0.95; }
      .plan-label {
        position: absolute;
        transform: translate(-50%, -50%);
        text-align: center;
        pointer-events: none;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
      }
      .plan-label strong { display: block; font-size: 13px; }
      .plan-label small { font-size: 11px; opacity: 0.85; }

      /* ── 頂部中央:模式切換 ── */
      #mode-switch {
        top: 36px; left: 50%;
        transform: translateX(-50%);
        display: flex;
        border-radius: 4px;
        overflow: hidden;
        background: rgba(20, 20, 22, 0.42);
        backdrop-filter: blur(8px);
      }
      #mode-switch button {
        display: flex; align-items: center; gap: 7px;
        border: none;
        background: transparent;
        color: rgba(255, 255, 255, 0.72);
        font-size: 14px;
        letter-spacing: 1px;
        padding: 13px 22px;
        cursor: pointer;
      }
      #mode-switch button.active { background: rgba(15, 15, 17, 0.66); color: #fff; }
      #mode-switch button svg { opacity: 0.9; }

      /* ── 左上:戶型圖卡片 ── */
      #minimap-card {
        top: 40px; left: 20px;
        border-radius: 6px;
        background: rgba(105, 105, 108, 0.42);
        backdrop-filter: blur(8px);
        padding: 10px 0 8px;
        overflow: hidden;
      }
      #minimap-card header {
        display: flex; align-items: center; gap: 6px;
        padding: 0 14px 8px;
        font-size: 13px;
        color: #fff;
        letter-spacing: 1px;
      }
      #pano-minimap { display: block; cursor: crosshair; }
      #minimap-resize {
        position: absolute; right: 4px; bottom: 4px;
        width: 26px; height: 26px;
        border: none; background: none;
        color: rgba(255, 255, 255, 0.85);
        cursor: nesw-resize;
        display: flex; align-items: center; justify-content: center;
      }

      /* ── 右上:熱度 + 圓形按鈕直排 ── */
      #heat-pill {
        top: 28px; right: 20px;
        display: flex; align-items: center; gap: 5px;
        background: rgba(20, 20, 22, 0.5);
        backdrop-filter: blur(8px);
        border-radius: 999px;
        padding: 7px 13px;
        font-size: 13px;
      }
      #side-stack {
        top: 92px; right: 20px;
        display: flex; flex-direction: column; gap: 26px;
        align-items: center;
      }
      .circle-btn {
        width: 38px; height: 38px;
        border-radius: 50%;
        border: none;
        background: rgba(20, 20, 22, 0.5);
        backdrop-filter: blur(8px);
        color: #fff;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
      }
      .circle-btn:hover { background: rgba(50, 50, 54, 0.72); }
      .circle-btn.liked { color: #ff5f6b; }

      /* ── 底部工具列 ── */
      #bottom-bar {
        left: 0; right: 0; bottom: 0;
        height: 75px;
        display: flex; align-items: center; justify-content: flex-end;
        padding: 0 12px;
        background: linear-gradient(0deg, rgba(20, 20, 22, 0.55), rgba(20, 20, 22, 0.38));
        backdrop-filter: blur(10px);
      }
      .bar-item {
        width: 94px;
        border: none; background: none;
        color: rgba(255, 255, 255, 0.62);
        display: flex; flex-direction: column; align-items: center; gap: 5px;
        font-size: 12px;
        letter-spacing: 1px;
        cursor: pointer;
        padding: 8px 0;
      }
      .bar-item.active, .bar-item:hover { color: #fff; }
      .bar-item[hidden] { display: none; }

      /* ── 房間選擇抽屜 ── */
      #rooms-drawer {
        left: 0; right: 0; bottom: 75px;
        padding: 10px 16px 12px;
        background: linear-gradient(0deg, rgba(20, 20, 22, 0.5), rgba(20, 20, 22, 0.12));
        display: none;
      }
      #rooms-drawer.show { display: block; }
      #rooms-drawer h4 {
        text-align: center;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 2px;
        margin-bottom: 10px;
      }
      #rooms-list {
        display: flex; gap: 24px; justify-content: center;
        overflow-x: auto;
        scrollbar-width: none;
      }
      #rooms-list::-webkit-scrollbar { display: none; }
      .room-thumb {
        flex: 0 0 108px;
        width: 108px;
        border: 2px solid transparent;
        border-radius: 2px;
        padding: 0;
        background: #26262a;
        cursor: pointer;
        overflow: hidden;
        position: relative;
      }
      .room-thumb.active { border-color: #3d7eff; }
      .room-thumb img { width: 100%; height: 78px; object-fit: cover; display: block; }
      .room-thumb span {
        display: block;
        background: rgba(10, 10, 12, 0.72);
        color: #fff;
        font-size: 12px;
        letter-spacing: 1px;
        padding: 5px 0;
        text-align: center;
        position: absolute; left: 0; right: 0; bottom: 0;
      }

      /* ── 更多選單 ── */
      #more-menu {
        right: 12px; bottom: 86px;
        width: 236px;
        border-radius: 8px;
        background: rgba(24, 24, 27, 0.72);
        backdrop-filter: blur(10px);
        padding: 18px 8px 10px;
        display: none;
        grid-template-columns: repeat(2, 1fr);
        row-gap: 16px;
      }
      #more-menu.show { display: grid; }
      .more-item {
        border: none; background: none;
        color: rgba(255, 255, 255, 0.85);
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        font-size: 12px;
        letter-spacing: 1px;
        cursor: pointer;
      }
      .more-item .more-icon {
        width: 34px; height: 34px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        display: flex; align-items: center; justify-content: center;
      }
      .more-item.active { color: #ffb45f; }
      .more-item.active .more-icon { background: rgba(255, 180, 95, 0.28); }

      /* ── 分享面板 ── */
      #share-pop {
        top: 150px; right: 68px;
        width: 224px;
        border-radius: 8px;
        background: rgba(24, 24, 27, 0.85);
        backdrop-filter: blur(10px);
        padding: 14px;
        display: none;
      }
      #share-pop.show { display: block; }
      #share-pop p {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
        word-break: break-all;
        margin-bottom: 10px;
        line-height: 1.5;
      }
      #share-copy {
        width: 100%;
        border: none;
        border-radius: 4px;
        background: #3d7eff;
        color: #fff;
        font-size: 13px;
        padding: 8px 0;
        cursor: pointer;
      }

      /* ── 家具資訊卡(我們的加值:點家具看型錄資料) ── */
      #pano-card {
        right: 68px; top: 210px;
        width: 246px;
        border-radius: 8px;
        background: rgba(24, 24, 27, 0.85);
        backdrop-filter: blur(10px);
        padding: 14px;
        display: none;
      }
      #pano-card.show { display: block; }
      #pano-card h3 { font-size: 14px; margin-bottom: 6px; padding-right: 20px; }
      #pano-card p { font-size: 12px; line-height: 1.7; color: rgba(255, 255, 255, 0.78); }
      #pano-card-close {
        position: absolute; top: 8px; right: 10px;
        border: none; background: none;
        color: rgba(255, 255, 255, 0.6);
        font-size: 14px; cursor: pointer;
      }

      /* ── 提示、浮水印、清屏 ── */
      #pano-toast {
        left: 50%; top: 104px;
        transform: translateX(-50%);
        background: rgba(24, 24, 27, 0.8);
        border-radius: 999px;
        padding: 9px 18px;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
        white-space: nowrap;
      }
      #pano-toast.show { opacity: 1; }
      #brand-mark {
        left: 16px; bottom: 86px;
        font-size: 12px;
        letter-spacing: 1.5px;
        color: rgba(255, 255, 255, 0.55);
        pointer-events: none;
      }
      body.clean .pano-ui, body.clean #chip-layer { display: none !important; }
      body.clean #exit-clean { display: flex !important; }
      #exit-clean {
        display: none;
        left: 50%; bottom: 26px;
        transform: translateX(-50%);
        z-index: 12;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(24, 24, 27, 0.6);
        color: #fff;
        border-radius: 999px;
        padding: 9px 20px;
        font-size: 13px;
        cursor: pointer;
        position: fixed;
      }

      /* ── 載入畫面(深藍灰底 + 置中品牌 + 底部進度) ── */
      #pano-loading {
        inset: 0;
        z-index: 20;
        background: rgb(51, 58, 77);
        transition: opacity 0.5s ease;
      }
      #pano-loading.done { opacity: 0; pointer-events: none; }
      #loading-brand {
        position: absolute; left: 50%; top: 44%;
        transform: translate(-50%, -50%);
        text-align: center;
      }
      #loading-brand strong {
        font-size: 30px;
        letter-spacing: 3px;
      }
      #loading-brand small {
        display: block;
        margin-top: 8px;
        font-size: 13px;
        letter-spacing: 2px;
        color: rgba(255, 255, 255, 0.55);
      }
      #loading-text {
        position: absolute; left: 50%; bottom: 134px;
        transform: translateX(-50%);
        font-size: 18px;
        color: #ddd;
        white-space: nowrap;
      }
      #loading-track {
        position: absolute; left: 50%; bottom: 106px;
        transform: translateX(-50%);
        width: min(932px, 72vw);
        height: 8px;
        background: rgb(28, 33, 46);
      }
      #loading-track i {
        display: block; height: 100%; width: 0%;
        background: #e8e8ec;
        transition: width 0.25s ease;
      }

      @media (max-width: 760px) {
        #mode-switch button { padding: 11px 12px; font-size: 13px; }
        #minimap-card { transform: scale(0.72); transform-origin: top left; }
        .bar-item { width: 72px; }
        #heat-pill { top: 20px; }
        #side-stack { top: 76px; gap: 18px; }
      }
    </style>
  </head>
  <body>
    <div id="pano-canvas"></div>
    <div id="chip-layer"></div>

    <nav id="mode-switch" class="pano-ui" aria-label="檢視模式">
      <button type="button" data-mode="roam" class="active">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7.5" cy="2.4" r="1.5"/><path d="M7.5 4.2v4.2M7.5 8.4l-2.4 4.8M7.5 8.4l2.4 4.8M4.6 6.4l2.9-1.2 2.9 1.2"/></svg>
        漫遊
      </button>
      <button type="button" data-mode="plan2d">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.5" y="1.5" width="12" height="12" rx="1"/><path d="M7.5 1.5v6M7.5 7.5h6M1.5 7.5h3"/></svg>
        平面戶型
      </button>
      <button type="button" data-mode="plan3d">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M7.5 1.5l6 3v6l-6 3-6-3v-6z"/><path d="M1.5 4.5l6 3 6-3M7.5 13.5v-6"/></svg>
        三維戶型
      </button>
    </nav>

    <aside id="minimap-card" class="pano-ui">
      <header>
        <svg width="13" height="13" viewBox="0 0 13 13" fill="currentColor"><path d="M6.5 0.8a4.2 4.2 0 0 0-4.2 4.2c0 3 4.2 7.2 4.2 7.2s4.2-4.2 4.2-7.2A4.2 4.2 0 0 0 6.5.8zm0 5.8a1.7 1.7 0 1 1 0-3.4 1.7 1.7 0 0 1 0 3.4z"/></svg>
        <span id="minimap-room">戶型圖</span>
      </header>
      <canvas id="pano-minimap" width="560" height="560"></canvas>
      <button id="minimap-resize" type="button" aria-label="縮放戶型圖">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 2h3v3M12 2L8 6M5 12H2V9M2 12l4-4"/></svg>
      </button>
    </aside>

    <div id="heat-pill" class="pano-ui">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="currentColor"><path d="M6.9.6S8 2.4 6.7 4.3C5.8 5.6 5 6.3 5.4 7.6c-1-.4-1.6-1.3-1.7-2.3-.9 1-1.5 2.3-1.5 3.4 0 2.3 1.9 3.9 4.3 3.9s4.3-1.6 4.3-3.9C10.8 5.3 8.6 3.9 6.9.6z"/></svg>
      <span id="heat-count">1</span>
    </div>

    <div id="side-stack" class="pano-ui">
      <button id="btn-fullscreen" class="circle-btn" type="button" aria-label="全螢幕">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9.8 2h4.2v4.2M14 2L9.4 6.6M6.2 14H2V9.8M2 14l4.6-4.6"/></svg>
      </button>
      <button id="btn-share" class="circle-btn" type="button" aria-label="分享">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1.6v8M8 1.6L5.2 4.4M8 1.6l2.8 2.8M3 7.6v5.8h10V7.6"/></svg>
      </button>
      <button id="btn-like" class="circle-btn" type="button" aria-label="收藏">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 13.8S1.8 10 1.8 5.8C1.8 3.7 3.4 2.2 5.3 2.2c1.1 0 2.1.5 2.7 1.4.6-.9 1.6-1.4 2.7-1.4 1.9 0 3.5 1.5 3.5 3.6C14.2 10 8 13.8 8 13.8z"/></svg>
      </button>
    </div>

    <footer id="bottom-bar" class="pano-ui">
      <button id="bar-rooms" class="bar-item" type="button">
        <svg width="21" height="21" viewBox="0 0 21 21" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 9.5L10.5 3 18 9.5M5 8v9h6.5"/><path d="M13 12.5l4.5 2-2 .8-.8 2z" fill="currentColor"/></svg>
        房間選擇
      </button>
      <button id="bar-nav" class="bar-item active" type="button">
        <svg width="21" height="21" viewBox="0 0 21 21" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="15" height="15" rx="1"/><path d="M10.5 3v7.5M10.5 10.5H18M3 10.5h4"/></svg>
        戶型導航
      </button>
      <button id="bar-music" class="bar-item" type="button">
        <svg width="21" height="21" viewBox="0 0 21 21" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 16.5V5l9-1.8v11.4"/><circle cx="6" cy="16.5" r="2"/><circle cx="15" cy="14.6" r="2"/></svg>
        <span id="music-label">音樂關</span>
      </button>
      <button id="bar-more" class="bar-item" type="button">
        <svg width="21" height="21" viewBox="0 0 21 21" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="10.5" cy="10.5" r="8"/><circle cx="6.8" cy="10.5" r="0.9" fill="currentColor"/><circle cx="10.5" cy="10.5" r="0.9" fill="currentColor"/><circle cx="14.2" cy="10.5" r="0.9" fill="currentColor"/></svg>
        更多
      </button>
    </footer>

    <section id="rooms-drawer" class="pano-ui">
      <h4>房間選擇</h4>
      <div id="rooms-list"></div>
    </section>

    <section id="more-menu" class="pano-ui">
      <button class="more-item" id="more-tour" type="button">
        <span class="more-icon"><svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor"><path d="M4 2.5l8 5-8 5z"/></svg></span>
        自動導覽
      </button>
      <button class="more-item" id="more-spin" type="button">
        <span class="more-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M13.6 8a5.6 5.6 0 1 1-1.7-4"/><path d="M12.4 1.6v2.8H9.6" /></svg></span>
        自動旋轉
      </button>
      <button class="more-item" id="more-night" type="button">
        <span class="more-icon"><svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor"><path d="M12.8 9.6A6 6 0 0 1 5.4 2.2a6 6 0 1 0 7.4 7.4z"/></svg></span>
        <span id="night-label">夜間模式</span>
      </button>
      <button class="more-item" id="more-clean" type="button">
        <span class="more-icon"><svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="11" height="11" rx="1.5"/></svg></span>
        清屏模式
      </button>
    </section>

    <section id="share-pop" class="pano-ui">
      <p id="share-url"></p>
      <button id="share-copy" type="button">複製連結</button>
    </section>

    <div id="pano-card" class="pano-ui">
      <button id="pano-card-close" type="button" aria-label="關閉">✕</button>
      <h3 id="pano-card-name"></h3>
      <p id="pano-card-body"></p>
    </div>

    <div id="pano-toast" class="pano-ui"></div>
    <div id="brand-mark" class="pano-ui">RoomPilot</div>
    <button id="exit-clean" type="button">退出清屏</button>

    <div id="pano-loading" class="pano-ui">
      <div id="loading-brand">
        <strong>RoomPilot</strong>
        <small>720° 全屋提案漫遊</small>
      </div>
      <div id="loading-text">努力載入中...</div>
      <div id="loading-track"><i></i></div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "/static/vendor/three/build/three.module.min.js",
          "three/addons/": "/static/vendor/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="/static/panorama/panorama.js?v=20260709b"></script>
  </body>
</html>
