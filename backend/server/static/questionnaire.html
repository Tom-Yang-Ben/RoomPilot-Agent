<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoomPilot 專案需求問卷</title>
    <link rel="stylesheet" href="/static/site.css?v=sha256-144afa0b2447" />
  </head>
  <body class="rp-questionnaire-client">
    <header class="rp-questionnaire-client-header">
      <a class="brand" href="/" aria-label="RoomPilot 首頁">RoomPilot</a>
      <span>只可填寫本專案問卷</span>
    </header>
    <main class="rp-questionnaire-client-main">
      <section class="rp-questionnaire-client-intro">
        <span class="eyebrow">專案需求問卷</span>
        <h1 id="questionnaire-project-name">正在載入專案…</h1>
        <p>出現原因：讓設計師先理解你的生活與每個房間的使用偏好。</p>
        <p class="rp-questionnaire-notice">目前只選擇格局；色卡與風格尚未定義。</p>
        <p>回答只保存於這個專案，不用於模型訓練。</p>
        <div class="rp-action-row">
          <button id="questionnaire-previous" type="button" class="secondary-action" hidden>返回上一區</button>
          <button id="questionnaire-next-incomplete" type="button" class="secondary-action">跳到未完成部分</button>
        </div>
        <strong id="questionnaire-client-progress">載入中</strong>
      </section>

      <section id="questionnaire-client-basic" class="rp-questionnaire-client-card">
        <h2>基本生活條件</h2>
        <div class="rp-question-step-head">
          <strong id="questionnaire-client-basic-progress">基本資料 1/8</strong>
          <span>一次只回答一題</span>
        </div>
        <div id="questionnaire-client-basic-fields" class="rp-question-list"></div>
        <div class="rp-question-step-actions">
          <button id="questionnaire-client-basic-previous" type="button" class="secondary-action">上一題</button>
          <button id="questionnaire-client-basic-next" type="button" class="primary-action">下一題</button>
          <button id="questionnaire-client-basic-done" type="button" class="primary-action" hidden>完成基本資料並開始逐房選擇</button>
        </div>
      </section>

      <section id="questionnaire-client-room" class="rp-questionnaire-client-card" hidden>
        <section id="questionnaire-client-room-locator" class="rp-client-room-locator" aria-label="目前問卷房間定位">
          <div class="rp-room-locator-head">
            <span>現在討論的房間</span>
            <strong id="questionnaire-client-room-locator-title">尚未選擇</strong>
            <p>藍色是目前房間；點平面圖可直接切換。</p>
          </div>
          <div id="questionnaire-client-plan-stage" class="rp-plan-stage rp-mini-plan-stage rp-client-mini-plan">
            <img id="questionnaire-client-plan-image" alt="目前問卷房間平面圖" />
            <svg id="questionnaire-client-plan-overlay" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg>
          </div>
        </section>
        <div id="questionnaire-client-room-tabs" class="rp-room-tabs"></div>
        <h2 id="questionnaire-client-room-title">房間需求</h2>
        <div class="rp-room-question-actions">
          <button id="questionnaire-client-random" type="button" class="secondary-action">給我隨機靈感</button>
          <select id="questionnaire-client-copy-source" aria-label="沿用其他空間">
            <option value="">選擇已填寫空間</option>
          </select>
          <button id="questionnaire-client-copy" type="button" class="secondary-action">複製後再修改</button>
        </div>
        <div class="rp-question-step-head">
          <strong id="questionnaire-client-room-progress">選擇 1/3</strong>
          <span>逐題完成此空間</span>
        </div>
        <div id="questionnaire-client-room-axes" class="rp-room-axis-list"></div>
        <section id="questionnaire-client-warning" class="rp-questionnaire-warning" hidden>
          <div class="rp-questionnaire-warning-head">
            <strong id="questionnaire-client-warning-position">0/0</strong>
            <span id="questionnaire-client-warning-room"></span>
          </div>
          <p id="questionnaire-client-warning-reason"></p>
          <div class="rp-action-row">
            <button id="questionnaire-client-warning-previous" type="button" class="secondary-action">上一則</button>
            <button id="questionnaire-client-warning-next" type="button" class="secondary-action">下一則</button>
          </div>
        </section>
        <fieldset data-client-room-stage="uses">
          <legend>這個空間要怎麼使用？</legend>
          <div id="questionnaire-client-room-uses" class="rp-choice-grid"></div>
          <label class="rp-question-note">
            <span>其他使用方式（選填）</span>
            <textarea id="questionnaire-client-room-use-note" rows="2" placeholder="例如：同時需要瑜珈、投影與兒童遊戲空間。"></textarea>
          </label>
        </fieldset>
        <fieldset data-client-room-stage="furniture">
          <legend>希望有哪些家具？沒有需求可不選</legend>
          <div id="questionnaire-client-room-furniture" class="rp-choice-grid"></div>
          <label class="rp-question-note">
            <span>其他家具需求（選填）</span>
            <textarea id="questionnaire-client-room-furniture-note" rows="2" placeholder="例如：保留既有唱片櫃，另加一組可移動展示層架。"></textarea>
          </label>
        </fieldset>
        <fieldset data-client-room-stage="technical">
          <legend>天花、冷氣與燈光</legend>
          <p class="rp-control-hint">依房間逐項看圖選擇；冷氣只會出現在需要且可合理排風的空間。</p>
          <div id="questionnaire-client-room-technical" class="rp-technical-preference-grid"></div>
        </fieldset>
        <fieldset data-client-room-stage="materials">
          <legend>素材偏好（可不選，之後仍可與色卡一起確認）</legend>
          <div class="rp-material-preference-grid">
            <label><span>牆面</span><select id="questionnaire-client-wall" multiple size="4">
            </select></label>
            <label><span>地板</span><select id="questionnaire-client-floor" multiple size="4">
            </select></label>
            <label><span>家具材質</span><select id="questionnaire-client-furniture-material" multiple size="4">
            </select></label>
            <label><span>偏好色調</span><select id="questionnaire-client-color" multiple size="4">
            </select></label>
            <label><span>表面質感／光澤</span><select id="questionnaire-client-finish" multiple size="4">
            </select></label>
          </div>
          <label><span>特殊切割或材質需求</span><textarea id="questionnaire-client-material-cuts" rows="2" placeholder="例如：電視牆左右分材；窗邊一段改木質，其餘維持塗料。"></textarea></label>
        </fieldset>
        <section data-client-room-stage="summary" class="rp-room-final-question">
          <div id="questionnaire-client-room-summary" class="rp-room-integrated-summary" aria-live="polite"></div>
          <label>
            <span>補充筆記</span>
            <textarea id="questionnaire-client-room-note" rows="3" placeholder="沒有補充可留白，系統輸出會記為「無」。"></textarea>
          </label>
        </section>
        <div class="rp-question-step-actions">
          <button id="questionnaire-client-room-previous-question" type="button" class="secondary-action">上一題</button>
          <button id="questionnaire-client-room-next-question" type="button" class="primary-action">下一題</button>
          <button id="questionnaire-client-room-save" type="button" class="primary-action">確認此房間</button>
          <button id="questionnaire-client-room-skip" type="button" class="secondary-action">跳過（維持現況）</button>
        </div>
      </section>
      <p id="questionnaire-client-status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/static/questionnaire_client.js?v=sha256-da892ad6183c"></script>
  </body>
</html>
