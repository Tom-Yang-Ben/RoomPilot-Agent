# floorplan2dxf 設定檔（黑白管線專用；彩色管線請用 config_color.ini）。執行：
#   python3 backend/floorplan/floorplan2dxf.py          (批次 testdata/png/*.png → testdata/dxf/ + temp/chk/gray/)
#   python3 backend/floorplan/floorplan2dxf.py 圖.png            (單張；只寫檔名會自動去 testdata/png/ 找)
#
# 牆厚會自動偵測，下面 px 類參數留空就依牆厚自動推導 —— 換任何解析度的圖都不用改。

[io]
input   =                    ; 平常留空(批次)；填檔名可鎖定單張
output  =                    ; 留空 = testdata/dxf/同檔名.dxf (公分單位)
preview =                    ; 留空 = chk/同檔名_chk.png

[binarize]
thresh         = otsu        ; otsu=自動門檻(建議) | fixed | adaptive
thresh_value   = 110         ; 只有 thresh=fixed 時用
adaptive_block = 31
adaptive_c     = 5
invert         = false       ; 線是亮色時 true
blur           = 0
deskew         = false       ; 掃描/拍照歪斜才 true

[walls]
style        = solid         ; center=中線 | outline=兩面 | solid=黑色實心牆
wall_min_pct = 3             ; 牆厚低於 自動牆厚T 的此 % 者不畫出來
windows      = true          ; 在窗的開口畫窗戶符號(門洞留開)
win_cover_pct = 70           ; 開口長度被細線覆蓋超過此% 視為窗
win_min_pct   = 20           ; 窗的跨牆寬度若比牆厚少超過此% 就不算窗(擋假窗)
door_arc_pct  = 55           ; 門偵測:L形等長線兩自由端「連接弧」的吻合門檻(%)
                             ;   門=垂直線+水平線(等長垂直、共用鉸鏈)+連接弧；圓形家具無此對線
; 以下留空 = 依自動牆厚 T 推導(換圖免改)。要鎖死就填數字：
solid =                      ; 去細線核，預設 ≈0.35×T
h_len =                      ; 牆最短長度，預設 ≈1.5×T (一定 > 牆厚)
v_len =

[postprocess]
snap    =                    ; 預設 ≈0.6×T
gap     =                    ; 預設 ≈0.4×T
min_len =                    ; 預設 ≈1.0×T

[scale]
mm_per_px = 8.8              ; 用尺規量已知尺寸校正；或填 dpi
dpi       =
door_width_cm = 90           ; 假設的標準門寬，用偵測到的門寬中位數反推每張圖比例(testdata/dxf/ 與 temp/json/gray/ 用)

[arch]                        ; architecture.json(白模交接 arch/)的立面預設值——平面圖量不到
wall_height_cm   = 280        ; 牆高
window_height_cm = 120        ; 窗高
sill_height_cm   = 90         ; 窗台離地高

[hough]
hough_thresh  = 50
hough_min_len = 25
hough_max_gap = 5
angle_tol     = 8

[output]
layer = WALL
