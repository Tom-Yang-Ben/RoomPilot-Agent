<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoomPilot | AI 室內配置與 3D 預覽</title>
    <link rel="stylesheet" href="/static/site.css?v=sha256-a9d8d410420c" />
  </head>
  <body data-page="home">
    <canvas id="fx-canvas" aria-hidden="true"></canvas>

    <header class="topbar app-topbar home-topbar">
      <a class="brand app-brand home-brand" href="/" aria-label="RoomPilot 首頁">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>RoomPilot</span>
      </a>
      <nav class="topnav" aria-label="主要導覽">
        <a href="/" class="active">探索功能</a>
        <a href="/styles">風格類型</a>
        <a href="/library">家具資料庫</a>
        <a href="/scene">3D 場景展示</a>
        <a href="/projects">我的專案</a>
      </nav>
      <a class="topbar-cta" href="/projects">開始設計</a>
    </header>

    <main class="home-landing">
      <section class="home-hero">
        <div class="home-hero-media" aria-hidden="true">
          <img src="/static/style_images/scandinavian.png" alt="" />
        </div>
        <div class="home-hero-overlay" aria-hidden="true"></div>

        <div class="home-hero-content">
          <p class="home-kicker">AI INTERIOR CONFIGURATION</p>
          <h1>從 2D 到 3D<br />AI 室內配置<br /><span class="nowrap">一鍵實現理想空間</span></h1>
          <p class="home-lead">
            匯入平面圖、選擇風格與家具需求，RoomPilot 會整合材質、家具資料庫與配置規則，
            產生可以即時瀏覽的 3D 室內提案，協助設計溝通更快聚焦。
          </p>

          <div class="home-actions">
            <a class="home-primary-action" href="/scene">
              <span>開始設計</span>
              <span aria-hidden="true">→</span>
            </a>
            <a class="home-secondary-action" href="/styles">
              <span class="play-dot" aria-hidden="true"></span>
              <span>查看風格</span>
            </a>
          </div>
        </div>

        <div class="home-feature-strip" aria-label="核心功能">
          <article>
            <span class="feature-icon plan-icon" aria-hidden="true"></span>
            <strong>2D 平面圖上傳</strong>
            <small>支援 DXF 牆線解析</small>
          </article>
          <article>
            <span class="feature-icon style-icon" aria-hidden="true"></span>
            <strong>12 種風格條件</strong>
            <small>牆面與地板推薦</small>
          </article>
          <article>
            <span class="feature-icon chair-icon" aria-hidden="true"></span>
            <strong>GLB 家具資料庫</strong>
            <small><span id="metric-furniture">-</span> 筆候選家具</small>
          </article>
          <article>
            <span class="feature-icon ai-icon" aria-hidden="true"></span>
            <strong>LLM 配置規劃</strong>
            <small>問卷轉配置 JSON</small>
          </article>
          <article>
            <span class="feature-icon cube-icon" aria-hidden="true"></span>
            <strong>3D 場景預覽</strong>
            <small>Three.js 即時瀏覽</small>
          </article>
        </div>
      </section>

      <section class="home-flow-section" aria-labelledby="home-flow-title">
        <h2 id="home-flow-title">如何開始？</h2>
        <div id="scope-list" class="home-flow-list"></div>
      </section>
    </main>

    <script type="module" src="/static/home.js?v=sha256-d3b406a2e6d9"></script>
  </body>
</html>
