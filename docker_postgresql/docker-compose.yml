# Optional full-profile development database. It binds to loopback only and
# creates an empty, generic catalog schema; no production dump is bundled.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${DB_USER:-roompilot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-roompilot_db}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - roompilot_pgdata:/var/lib/postgresql/data
      - ./init/001_roompilot.sql:/docker-entrypoint-initdb.d/001_roompilot.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-roompilot} -d ${DB_NAME:-roompilot_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  roompilot_pgdata:
