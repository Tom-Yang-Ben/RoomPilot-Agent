# floorplan2dxf_color 設定檔（彩色管線專用，與黑白管線的 config.ini 完全分離）。執行：
#   python3 scripts/floorplan2dxf_color.py             (批次 color_png/*.png → color_dxf_scale/ + color_chk/)
#   python3 scripts/floorplan2dxf_color.py 圖.png      (單張；只寫檔名會自動去 color_png/ 找)
#
# 牆厚會自動偵測，下面 px 類參數留空就依牆厚自動推導 —— 換任何解析度的圖都不用改。

[io]
input   =                    ; 平常留空(批次)；填檔名可鎖定單張
output  =                    ; 留空 = color_dxf_scale/同檔名.dxf (公分單位)
preview =                    ; 留空 = color_chk/同檔名_chk.png

[binarize]
fade_levels    = 5           ; 彩色→灰階後淡化(色調分離)的層次數
fade_keep      = 2           ; 保留最深的幾層當實心牆(其餘淡化成白)。實測留1層會丟中灰色外牆(floor_01)，留2層完整
chroma_max     = 40          ; 絕對色度(BGR最大-最小通道差)低於此值才算牆。黑/灰牆色度<20，彩色深家具/草皮高；
                             ; 灰色沙發等灰家具靠層次擋(比牆淺1~2層)。建築基柱(黑實心)由厚塊偵測100%保留
gray_delta     = 25          ; 自適應假牆過濾:候選矩形平均灰度比本圖牆基準(全候選面積加權P30)淺超過
                             ; 此值即刪(P25守門防誤刪)；另含色度>18/紋理離散>30規則抓深棕木家具。0=停用
cc_mask_dir    =             ; 語意牆遮罩快取目錄(<名>_mask.npz)。有快取檔=啟用語意融合(否決+救回)；
                             ; 沒檔/留空=純古典管線。v2.13 起 MitUNet 已移除(CC-BY-NC 禁商用、
                             ; 融合增益僅 <1pp)，此機制留給未來高精準遮罩來源
cc_veto_cov    = 0.3         ; 否決票門檻:候選遮罩覆蓋率<此值且有弱訊號判假牆(高精準遮罩用 0.3、CubiCasa 改 0.15)
cc_rescue      = true        ; 漏牆救回(貼牆+牆厚條+深色+中性色四重門檻)。僅高精準遮罩可開；
                             ; CubiCasa 純度僅 37%，用它時必須 false
thresh         = otsu        ; otsu=自動門檻(建議) | fixed | adaptive
thresh_value   = 110         ; 只有 thresh=fixed 時用
adaptive_block = 31
adaptive_c     = 5
invert         = false       ; 線是亮色時 true
blur           = 0
deskew         = false       ; 掃描/拍照歪斜才 true

[walls]
style        = solid         ; center=中線 | outline=兩面 | solid=黑色實心牆
wall_min_pct = 3             ; 牆厚低於 自動牆厚T 的此 % 者不畫出來
windows      = true          ; v2.13 接回窗偵測（淺灰窗線用獨立二值層，見 run() solid 分支）
win_cover_pct = 70           ; 開口長度被細線覆蓋超過此% 視為窗
win_min_pct   = 20           ; 窗的跨牆寬度若比牆厚少超過此% 就不算窗(擋假窗)
door_arc_pct  = 55           ; 門偵測:L形等長線兩自由端「連接弧」的吻合門檻(%)
                             ;   門=垂直線+水平線(等長垂直、共用鉸鏈)+連接弧；圓形家具無此對線
; 以下留空 = 依自動牆厚 T 推導(換圖免改)。要鎖死就填數字：
solid =                      ; 去細線核，預設 ≈0.35×T
h_len =                      ; 牆最短長度，預設 ≈1.5×T (一定 > 牆厚)
v_len =

[postprocess]
snap    =                    ; 預設 ≈0.6×T
gap     =                    ; 預設 ≈0.4×T
min_len =                    ; 預設 ≈1.0×T

[scale]
mm_per_px = 8.8              ; 用尺規量已知尺寸校正；或填 dpi
dpi       =
door_width_cm = 90           ; 假設的標準門寬，用偵測到的門寬中位數反推每張圖比例(color_dxf_scale/ 與 color_json/ 用)

[arch]                        ; architecture.json(白模交接 color_arch/)的立面預設值——平面圖量不到
wall_height_cm   = 280        ; 牆高
window_height_cm = 120        ; 窗高
sill_height_cm   = 90         ; 窗台離地高

[hough]
hough_thresh  = 50
hough_min_len = 25
hough_max_gap = 5
angle_tol     = 8

[output]
layer = WALL
